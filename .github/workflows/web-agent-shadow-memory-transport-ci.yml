name: Web Agent Shadow Memory Transport CI

on:
  push:
    branches:
      - "feat/web-agent-shadow-memory-transport-20260816"
    paths:
      - "apps/api-gateway/src/web-agent-shadow-client.mjs"
      - "apps/api-gateway/test/web-agent-shadow-memory-transport.test.mjs"
      - ".github/workflows/web-agent-shadow-memory-transport-ci.yml"
  pull_request:
    paths:
      - "apps/api-gateway/src/web-agent-shadow-client.mjs"
      - "apps/api-gateway/test/web-agent-shadow-memory-transport.test.mjs"
      - ".github/workflows/web-agent-shadow-memory-transport-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/api-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax
        run: |
          node --check src/web-agent-shadow-client.mjs
          node --check test/web-agent-shadow-memory-transport.test.mjs
      - name: Transport tests
        run: node --test test/web-agent-shadow-memory-transport.test.mjs
