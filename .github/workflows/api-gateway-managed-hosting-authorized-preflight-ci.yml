name: API Gateway Managed Hosting Authorized Preflight CI

on:
  pull_request:
    paths:
      - ".github/workflows/api-gateway-managed-hosting-authorized-preflight-ci.yml"

permissions:
  contents: read

jobs:
  preflight:
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 15
    env:
      EXPECTED_SHA: b4cfbcb835d459ab4aec37a9a10213451784c864
      HOSTINGER_USERNAME: u242521810
      HOSTINGER_DOMAIN: gateway.apidevelopers.digital
    steps:
      - name: Checkout exact approved SHA
        uses: actions/checkout@v4
        with:
          ref: b4cfbcb835d459ab4aec37a9a10213451784c864
          persist-credentials: false

      - name: Validate exact approved SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build and verify managed artifact
        shell: bash
        run: |
          set -euo pipefail
          node apps/api-gateway/scripts/build-managed-hosting-artifact.mjs
          node apps/api-gateway/scripts/verify-managed-hosting-artifact.mjs
          artifact="apps/api-gateway/dist/api-gateway-managed"
          test -f "$artifact/release-manifest.json"
          archive="$RUNNER_TEMP/api-gateway-$EXPECTED_SHA.zip"
          (
            cd "$artifact"
            zip -q -r "$archive" .
          )
          test -s "$archive"
          echo "ARCHIVE_PATH=$archive" >> "$GITHUB_ENV"

      - name: Run authorized Hostinger preflight only
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/api-gateway-hostinger-preflight-evidence.json"
          node apps/site-factory/src/run-hostinger-node-build-api-only.mjs \
            --mode preflight \
            --username "$HOSTINGER_USERNAME" \
            --domain "$HOSTINGER_DOMAIN" \
            --archive "$ARCHIVE_PATH" \
            --transport multipart \
            --node-version 22 \
            --app-type express \
            --entry-file src/operational-server.mjs \
            --package-manager npm \
            --expected-text 'api_gateway_operational_started' \
            --evidence "$evidence"
          test -s "$evidence"
          echo "EVIDENCE_PATH=$evidence" >> "$GITHUB_ENV"

      - name: Surface sanitized preflight evidence
        shell: bash
        run: |
          set -euo pipefail
          cat "$EVIDENCE_PATH"
          node - "$EVIDENCE_PATH" <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require("node:fs");
          const evidence = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          console.log("## API Gateway Hostinger preflight");
          console.log("");
          console.log(`- mode: \`${evidence.mode ?? null}\``);
          console.log(`- status: \`${evidence.status ?? null}\``);
          console.log(`- writeExecuted: \`${evidence.writeExecuted ?? null}\``);
          console.log(`- target: \`${JSON.stringify(evidence.target ?? null)}\``);
          console.log(`- request: \`${JSON.stringify(evidence.request ?? null)}\``);
          NODE
