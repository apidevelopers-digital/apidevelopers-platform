name: Persistence Core CI

on:
  push:
    branches:
      - main
      - feat/persistence-core-v0
    paths:
      - "packages/persistence-core/**"
      - ".github/workflows/persistence-core-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "packages/persistence-core/**"
      - ".github/workflows/persistence-core-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: persistence-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on:
      group: organization-macos-ci
      labels: [self-hosted, macOS, X64]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install persistence dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix packages/persistence-core install --ignore-scripts

      - name: Validate persistence source
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix packages/persistence-core run check

  postgres-integration:
    runs-on:
      group: organization-macos-ci
      labels: [self-hosted, macOS, X64]
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare PostgreSQL tooling
        shell: bash
        run: |
          set -euo pipefail

          resolve_pg_bin() {
            local candidate=""

            if command -v initdb >/dev/null 2>&1; then
              candidate="$(dirname "$(command -v initdb)")"
            else
              candidate="$(brew --prefix postgresql@16 2>/dev/null || true)/bin"
            fi

            if [[ -n "$candidate" ]]               && [[ -x "$candidate/initdb" ]]               && [[ -x "$candidate/pg_ctl" ]]               && [[ -x "$candidate/createdb" ]]; then
              printf '%s\n' "$candidate"
              return 0
            fi

            return 1
          }

          PG_BIN=""
          if PG_BIN="$(resolve_pg_bin)"; then
            echo "Using existing PostgreSQL tooling at $PG_BIN"
          else
            for attempt in {1..60}; do
              if PG_BIN="$(resolve_pg_bin)"; then
                echo "PostgreSQL tooling became available at $PG_BIN"
                break
              fi

              if ! pgrep -f "[b]rew install postgresql@16" >/dev/null 2>&1; then
                break
              fi

              echo "Waiting for existing Homebrew PostgreSQL installation ($attempt/60)"
              sleep 10
            done
          fi

          if [[ -z "$PG_BIN" ]]; then
            if pgrep -f "[b]rew install postgresql@16" >/dev/null 2>&1; then
              echo "::error::Existing Homebrew PostgreSQL installation did not finish within 10 minutes."
              exit 1
            fi

            brew install postgresql@16
            PG_BIN="$(brew --prefix postgresql@16)/bin"
          fi

          for command_name in initdb pg_ctl createdb; do
            if [[ ! -x "$PG_BIN/$command_name" ]]; then
              echo "::error::Missing PostgreSQL executable: $PG_BIN/$command_name"
              exit 1
            fi
          done

          echo "$PG_BIN" >> "$GITHUB_PATH"
          echo "PG_BIN=$PG_BIN" >> "$GITHUB_ENV"

      - name: Install integration driver
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix packages/persistence-core install --ignore-scripts

      - name: Run PostgreSQL integration
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PG_BIN:$PATH"

          PGDATA="$RUNNER_TEMP/apidev-postgres-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          PORT=$((55000 + RANDOM % 5000))
          DATABASE="apidev_persistence_test"
          USER_NAME="$(whoami)"

          rm -rf "$PGDATA"
          initdb -D "$PGDATA" --no-locale --encoding=UTF8 --auth=trust >/dev/null
          pg_ctl -D "$PGDATA" -o "-F -p $PORT -h 127.0.0.1" -w start >/dev/null

          cleanup() {
            pg_ctl -D "$PGDATA" -m fast -w stop >/dev/null 2>&1 || true
            rm -rf "$PGDATA"
          }
          trap cleanup EXIT

          createdb -h 127.0.0.1 -p "$PORT" "$DATABASE"
          export POSTGRES_TEST_URL="postgresql://${USER_NAME}@127.0.0.1:${PORT}/${DATABASE}"

          npm --prefix packages/persistence-core run test:postgres
