name: Persistence Core CI

on:
  push:
    branches:
      - main
      - feat/persistence-core-v0
    paths:
      - "packages/persistence-core/**"
      - ".github/workflows/persistence-core-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "packages/persistence-core/**"
      - ".github/workflows/persistence-core-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: persistence-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on:
      group: organization-macos-ci
      labels: [self-hosted, macOS, X64]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install persistence dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix packages/persistence-core install --ignore-scripts

      - name: Validate persistence source
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix packages/persistence-core run check

  postgres-integration:
    runs-on:
      group: organization-macos-ci
      labels: [self-hosted, macOS, X64]
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare PostgreSQL tooling
        shell: bash
        run: |
          set -euo pipefail

          resolve_pg_bin() {
            local candidate=""
            local brew_prefix=""

            if command -v initdb >/dev/null 2>&1; then
              candidate="$(dirname "$(command -v initdb)")"
              if [[ -x "$candidate/initdb" && -x "$candidate/pg_ctl" && -x "$candidate/createdb" ]]; then
                printf '%s\n' "$candidate"
                return 0
              fi
            fi

            brew_prefix="$(brew --prefix postgresql@16 2>/dev/null || true)"
            if [[ -n "$brew_prefix" ]]; then
              candidate="$brew_prefix/bin"
              if [[ -x "$candidate/initdb" && -x "$candidate/pg_ctl" && -x "$candidate/createdb" ]]; then
                printf '%s\n' "$candidate"
                return 0
              fi
            fi

            for candidate in               /usr/local/Cellar/postgresql@16/*/bin               /opt/homebrew/Cellar/postgresql@16/*/bin
            do
              if [[ -x "$candidate/initdb" && -x "$candidate/pg_ctl" && -x "$candidate/createdb" ]]; then
                printf '%s\n' "$candidate"
                return 0
              fi
            done

            return 1
          }

          PG_BIN="$(resolve_pg_bin || true)"

          if [[ -z "$PG_BIN" ]]; then
            echo "No usable PostgreSQL 16 binaries found yet."
            echo "Existing Homebrew/PostgreSQL processes:"
            ps -axo pid=,ppid=,etime=,command= | grep -E '[b]rew|postgresql@16' || true

            for attempt in {1..60}; do
              if HOMEBREW_NO_AUTO_UPDATE=1 brew install postgresql@16; then
                PG_BIN="$(resolve_pg_bin || true)"
              else
                PG_BIN="$(resolve_pg_bin || true)"
              fi

              if [[ -n "$PG_BIN" ]]; then
                echo "PostgreSQL tooling became available at $PG_BIN"
                break
              fi

              echo "::warning::PostgreSQL tooling is still locked or unavailable ($attempt/60); retrying in 15 seconds."
              sleep 15
            done
          else
            echo "Using existing PostgreSQL tooling at $PG_BIN"
          fi

          if [[ -z "$PG_BIN" ]]; then
            echo "::error::PostgreSQL 16 tooling did not become available within the retry window."
            ps -axo pid=,ppid=,etime=,command= | grep -E '[b]rew|postgresql@16' || true
            exit 1
          fi

          for command_name in initdb pg_ctl creatdb; do
            if [[ ! -x "$PG_BIN/$command_name" ]]; then
              echo "::error::Missing PostgreSQL executable: $PG_BIN/$command_name"
              exit 1
            fi
          done

          echo "$PG_BIN" >> "$GITHUB_PATH"
          echo "PG_BIN=$PG_BIN" >> "$GITHUB_ENV"

      - name: Install integration driver
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix packages/persistence-core install --ignore-scripts

      - name: Run PostgreSQL integration
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PG_BIN:$PATH"

          PGDATA="$RUNNER_TEMP/apidev-postgres-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          PORT=$((55000 + RANDOM % 5000))
          DATABASE="apidev_persistence_test"
          USER_NAME="$(whoami)"

          rm -rf "$PGDATA"
          initdb -D "$PGDATA" --no-locale --encoding=UTF8 --auth=trust >/dev/null
          pg_ctl -D "$PGDATA" -o "-F -p $PORT -h 127.0.0.1" -w start >/dev/null

          cleanup() {
            pg_ctl -D "$PGDATA" -m fast -w stop >/dev/null 2>&1 || true
            rm -rf "$PGDATA"
          }
          trap cleanup EXIT

          createdb -h 127.0.0.1 -p "$PORT" "$DATABASE"
          export POSTGRES_TEST_URL="postgresql://${USER_NAME}@127.0.0.1:${PORT}/${DATABASE}"

          npm --prefix packages/persistence-core run test:postgres
