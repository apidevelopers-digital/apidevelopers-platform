name: Persistence Core CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "foundation/**"
    paths:
      - "packages/persistence-core/**"
      - ".github/workflows/persistence-core-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "packages/persistence-core/**"
      - ".github/workflows/persistence-core-ci.yml"

permissions:
  contents: read

concurrency:
  group: persistence-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check runtime
        run: node --version
      - name: Check source syntax
        run: |
          node --check packages/persistence-core/src/model.mjs
          node --check packages/persistence-core/src/transaction-context.mjs
          node --check packages/persistence-core/src/file-store.mjs
          node --check packages/persistence-core/src/repository.mjs
          node --check packages/persistence-core/src/index.mjs
          node --check packages/persistence-core/test/index.test.mjs
      - name: Run persistence-core tests
        run: node --test --test-reporter=spec packages/persistence-core/test/index.test.mjs
      - name: Check consuming domain boundaries
        run: |
          node --check packages/tenant-core/src/index.mjs
          node --check packages/project-core/src/index.mjs
          node --check packages/usage-core/src/index.mjs
          node --check packages/entitlement-core/src/index.mjs
