name: ADA Asset Engine ingest check

on:
  workflow_dispatch:
    inputs:
      strict:
        description: 'Fail when approved Greys assets are missing'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  pull_request:
    paths:
      - 'media/catalogs/hiddenarquives/greys.json'
      - 'media/sources/hiddenarquives/greys/**'
      - 'scripts/asset-engine-ingest-greys.mjs'
      - '.github/workflows/asset-engine-ingest-check.yml'

permissions:
  contents: read

jobs:
  hiddenarquives-greys-ingest:
    runs-on:
      - self-hosted
      - macOS
      - X64

    env:
      STRICT_INGEST: ${{ github.event_name == 'workflow_dispatch' && inputs.strict == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Greys ingest readiness
        run: |
          set -e
          mkdir -p artifacts/asset-engine/dry-run
          node --check scripts/asset-engine-ingest-greys.mjs

          if [ "$STRICT_INGEST" = "true" ]; then
            node scripts/asset-engine-ingest-greys.mjs --strict
          else
            node scripts/asset-engine-ingest-greys.mjs --allow-missing
          fi

      - name: Upload ingest report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hiddenarquives-greys-asset-engine-ingest-report
          path: artifacts/asset-engine/dry-run/hiddenarquives-greys-ingest-report.json
