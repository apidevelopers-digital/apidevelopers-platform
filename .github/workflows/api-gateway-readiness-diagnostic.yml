name: API Gateway Readiness Diagnostic
on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/api-gateway-readiness-diagnostic.yml"]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 10
    env:
      GATEWAY_PARENT_READY_URL: "https://dodgerblue-heron-996886.hostingersite.com/ready"
      GATEWAY_PRODUCTION_READY_URL: "https://gateway.apidevelopers.digital/ready"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Diagnose readiness
        shell: bash
        run: |
          set +e
          report="$RUNNER_TEMP/readiness.json"
          node apps/api-gateway/scripts/observe-production-readiness.mjs --output "$report"
          code=$?
          set -e
          node --input-type=module - "$report" "$code" <<'NODE'
          import fs from "node:fs";
          const [path, code] = process.argv.slice(2);
          const r = JSON.parse(fs.readFileSync(path, "utf8"));
          const pick = t => ({
            httpStatus: t?.httpStatus ?? null,
            valid: t?.valid === true,
            service: t?.service ?? null,
            status: t?.status ?? null,
            persistence: t?.persistence ?? null,
            error: t?.error ?? null,
          });
          console.log(JSON.stringify({
            classification: r?.classification ?? null,
            probeExitCode: Number(code),
            parent: pick(r?.targets?.hostingerParent),
            production: pick(r?.targets?.productionDomain),
            writeExecuted: false,
          }, null, 2));
          NODE
          exit 0
