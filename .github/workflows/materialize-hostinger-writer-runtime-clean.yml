name: Materialize Hostinger Writer Runtime Clean

on:
  push:
    branches:
      - feat/operator-hostinger-writer-runtime-bridge-clean-20260804

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/operator-hostinger-writer-runtime-bridge-clean-20260804
          fetch-depth: 0
      - name: Copy validated files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/operator-hostinger-writer-runtime-bridge-20260804
          git checkout origin/feat/operator-hostinger-writer-runtime-bridge-20260804 -- \
            apps/api-gateway/src/hostinger-writer-runtime.mjs \
            apps/api-gateway/src/operational-runtime.mjs \
            apps/api-gateway/test/hostinger-writer-runtime.test.mjs \
            apps/api-gateway/test/operational-runtime.test.mjs \
            scripts/materialize_hostinger_writer_runtime_bridge.py
          rm -f .github/workflows/materialize-hostinger-writer-runtime-clean.yml
          node --check apps/api-gateway/src/hostinger-writer-runtime.mjs
          node --check apps/api-gateway/src/operational-runtime.mjs
          node --test apps/api-gateway/test/hostinger-writer-runtime.test.mjs
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(operator): integrar writer Hostinger desligado ao runtime"
          git push origin HEAD:feat/operator-hostinger-writer-runtime-bridge-clean-20260804
