name: Zuni Preview Secret Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provisioning-key-present:
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 10
    env:
      PROVISIONING_KEY: ${{ secrets.API_GATEWAY_PROVISIONING_KEY }}
    steps:
      - name: Validate provisioning key presence
        shell: bash
        run: |
          set -euo pipefail
          test "${#PROVISIONING_KEY}" -ge 32

  subject-ref-valid:
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 10
    env:
      SUBJECT_REF: ${{ secrets.ZUNI_PREVIEW_SUBJECT_REF }}
    steps:
      - name: Validate subjectRef presence and format
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SUBJECT_REF" =~ ^[a-fA-F0-9]{64}$ ]]
