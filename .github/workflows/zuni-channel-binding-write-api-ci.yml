name: Zuni Channel Binding Write API CI

on:
  push:
    paths:
      - "apps/api-gateway/src/zuni-channel-binding-write-composition.mjs"
      - "apps/api-gateway/test/zuni-channel-binding-write-composition.test.mjs"
      - ".github/workflows/zuni-channel-binding-write-api-ci.yml"
  pull_request:
    paths:
      - "apps/api-gateway/src/zuni-channel-binding-write-composition.mjs"
      - "apps/api-gateway/test/zuni-channel-binding-write-composition.test.mjs"
      - ".github/workflows/zuni-channel-binding-write-api-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Link local workspace dependencies
        run: node apps/api-gateway/scripts/link-local-dependencies.mjs

      - name: Validate syntax
        run: |
          set -euo pipefail
          node --check apps/api-gateway/src/zuni-channel-binding-write-composition.mjs
          node --check apps/api-gateway/test/zuni-channel-binding-write-composition.test.mjs

      - name: Validate governed write contract
        run: |
          set -euo pipefail
          node --test apps/api-gateway/test/zuni-channel-binding-write-composition.test.mjs
