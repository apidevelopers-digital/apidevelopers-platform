name: Contracts Core CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "foundation/**"
    paths:
      - "packages/contracts/**"
      - ".github/workflows/contracts-core-ci.yml"
  pull_request:
    paths:
      - "packages/contracts/**"
      - ".github/workflows/contracts-core-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test consolidated contracts
        run: >
          node --test --test-concurrency=1
          packages/contracts/test/canonical-ids.test.mjs
          packages/contracts/test/cognitive-decision.test.mjs
          packages/contracts/test/cognitive-pipeline.test.mjs
          packages/contracts/test/decision-policy.test.mjs
          packages/contracts/test/event-envelope.test.mjs
          packages/contracts/test/planning-execution-plan.test.mjs
          packages/contracts/test/policy-runtime.test.mjs
