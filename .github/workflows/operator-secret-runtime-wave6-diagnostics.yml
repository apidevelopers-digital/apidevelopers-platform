name: Operator Secret Runtime Wave 6 Diagnostics

on:
  push:
    branches:
      - diagnostics/operator-secret-runtime-wave6-20260802
    paths-ignore:
      - "apps/api-gateway/diagnostics/**"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: apps/api-gateway

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Link local dependencies
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          mkdir -p "$root/apps/api-gateway/node_modules/@apidevelopers"
          for package in contracts auth-core apikey-core persistence-core; do
            ln -sfn "$root/packages/$package" "$root/apps/api-gateway/node_modules/@apidevelopers/$package"
          done
          mkdir -p "$root/packages/auth-core/node_modules/@apidevelopers"
          ln -sfn "$root/packages/apikey-core" "$root/packages/auth-core/node_modules/@apidevelopers/apikey-core"
          mkdir -p "$root/packages/apikey-core/node_modules/@apidevelopers"
          ln -sfn "$root/packages/persistence-core" "$root/packages/apikey-core/node_modules/@apidevelopers/persistence-core"

      - name: Persist sanitized npm check evidence
        run: |
          set +e
          mkdir -p diagnostics
          npm run check > diagnostics/wave6.log 2>&1
          code=$?
          {
            echo "exit_code=$code"
            echo "head_sha=$GITHUB_SHA"
          } >> diagnostics/wave6.log

          python3 - diagnostics/wave6.log <<'PY'
          import pathlib, re, sys
          path = pathlib.Path(sys.argv[1])
          text = path.read_text(errors="replace")
          patterns = (
              r"gh[pousr]_[A-Za-z0-9_]{20,}",
              r"Bearer\s+[A-Za-z0-9._-]{12,}",
              r"(?:secret|vault)://[^\s\"']+",
          )
          for pattern in patterns:
              text = re.sub(pattern, "[REDACTED]", text, flags=re.IGNORECASE)
          path.write_text("\n".join(text.splitlines()[-300:]) + "\n")
          PY

          git config user.name "api-developers-diagnostics"
          git config user.email "diagnostics@apidevelopers.digital"
          git add diagnostics/wave6.log
          git commit -m "chore(diagnostics): persist Wave 6 npm check evidence" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
          exit "$code"
