name: Gateway Key Provisioner Real Issue and Store

on:
  workflow_dispatch:
    inputs:
      approval:
        description: "Exact Igor approval token for real key issuance"
        required: true
        type: string
      expected_source_sha:
        description: "Expected deployed gateway source SHA"
        required: true
        default: "6ff2abdea18729a83fc2ed6c19a941f0870bf251"
        type: string
      gateway_origin:
        description: "Gateway origin"
        required: true
        default: "https://gateway.apidevelopers.digital"
        type: string

permissions:
  contents: read

concurrency:
  group: gateway-key-provisioner-real-issue-store
  cancel-in-progress: false

jobs:
  issue-store-verify:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.event.inputs.approval == 'IGOR_APROVA_GATEWAY_KEY_PROVISIONER_REAL'
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 10
    env:
      GATEWAY_ORIGIN: ${{ github.event.inputs.gateway_origin }}
      EXPECTED_SOURCE_SHA: ${{ github.event.inputs.expected_source_sha }}
      API_GATEWAY_OPERATOR_KEY: ${{ secrets.API_GATEWAY_OPERATOR_KEY }}
      ADA_MITRA_BRIDGE_TENANT_ID: ${{ secrets.ADA_MITRA_BRIDGE_TENANT_ID }}
      GH_TOKEN: ${{ secrets.GH_SECRET_WRITER_TOKEN }}
      ORG: apidevelopers-digital
      REPO_NAME: apidevelopers-platform

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preflight organization secret writer before real issuance
        shell: bash
        run: |
          set -euo pipefail
          test "$GATEWAY_ORIGIN" = "https://gateway.apidevelopers.digital"
          test "$EXPECTED_SOURCE_SHA" = "6ff2abdea18729a83fc2ed6c19a941f0870bf251"
          command -v gh >/dev/null 2>&1
          test -n "${GH_TOKEN:-}"
          gh api user --jq '.login' >/tmp/gh-user-login.txt
          gh api "orgs/${ORG}/actions/secrets/public-key" --jq '.key_id' >/tmp/gh-org-secret-public-key-id.txt
          marker="preflight-$(date -u +%Y%m%dT%H%M%SZ)"
          gh secret set GATEWAY_KEY_PROVISIONER_WRITE_PREFLIGHT --org "$ORG" --repos "$REPO_NAME" --body "$marker"
          echo "GATEWAY_KEY_PROVISIONER_REAL_PREFLIGHT_SECRET_WRITER=true"
          echo "GATEWAY_KEY_PROVISIONER_REAL_PREFLIGHT_TARGET=organization_secret"

      - name: Issue, store as organization secret, and verify real key
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ops/gateway-key-provisioner-real-issue-store.mjs
