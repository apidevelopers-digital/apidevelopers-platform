name: API Gateway Uni Account Access Context Runtime

on:
  push:
    paths:
      - "apps/api-gateway/src/uni-account-preview-access-context-runtime-composition.mjs"
      - "apps/api-gateway/src/operational-runtime.mjs"
      - "apps/api-gateway/test/uni-account-preview-access-context-runtime-composition.test.mjs"
      - "apps/api-gateway/test/uni-account-preview-access-context-operational-wiring.test.mjs"
      - ".github/workflows/api-gateway-uni-account-access-context-runtime.yml"
  pull_request:
    paths:
      - "apps/api-gateway/src/uni-account-preview-access-context-runtime-composition.mjs"
      - "apps/api-gateway/src/operational-runtime.mjs"
      - "apps/api-gateway/test/uni-account-preview-access-context-runtime-composition.test.mjs"
      - "apps/api-gateway/test/uni-account-preview-access-context-operational-wiring.test.mjs"
      - ".github/workflows/api-gateway-uni-account-access-context-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  access-context-runtime:
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Link institutional local dependencies
        run: node apps/api-gateway/scripts/link-local-dependencies.mjs

      - name: Check Uni account access-context runtime syntax
        working-directory: apps/api-gateway
        run: |
          node --check src/uni-account-preview-access-context-runtime-composition.mjs
          if [ -f test/uni-account-preview-access-context-operational-wiring.test.mjs ]; then
            node --check test/uni-account-preview-access-context-operational-wiring.test.mjs
          fi

      - name: Exercise auth disabled boundary
        working-directory: apps/api-gateway
        run: node --test --test-name-pattern="consumer auth is disabled" test/uni-account-preview-access-context-runtime-composition.test.mjs

      - name: Exercise dedicated server credential
        working-directory: apps/api-gateway
        run: node --test --test-name-pattern="consumer auth requires dedicated server credential" test/uni-account-preview-access-context-runtime-composition.test.mjs
      - name: Exercise fail-closed runtime boundary
        working-directory: apps/api-gateway
        run: node --test --test-name-pattern="runtime stays disabled" test/uni-account-preview-access-context-runtime-composition.test.mjs

      - name: Exercise mounted resolver boundary
        working-directory: apps/api-gateway
        run: node --test --test-name-pattern="runtime mounts preview resolver" test/uni-account-preview-access-context-runtime-composition.test.mjs
      - name: Exercise operational wiring when present
        working-directory: apps/api-gateway
        run: |
          if [ -f test/uni-account-preview-access-context-operational-wiring.test.mjs ]; then
            node --test test/uni-account-preview-access-context-operational-wiring.test.mjs
          else
            echo "Operational wiring test not present yet."
          fi

      - name: Enforce preview-only boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq 'productionEnabled:[[:space:]]*false' apps/api-gateway/src/account-access-context-preview-composition.mjs
          grep -Eq 'runtimeAutoWiring:[[:space:]]*true' apps/api-gateway/src/uni-account-preview-access-context-runtime-composition.mjs
          if grep -Fq 'UNI_CO_PREVIEW_ACCESS_CONTEXT_AUTHORIZATION' apps/api-gateway/src/uni-account-preview-access-context-runtime-composition.mjs; then
            echo "Runtime composition must not embed environment variable names or secret values."
            exit 1
          fi
          echo "UNI_ACCOUNT_ACCESS_CONTEXT_RUNTIME_GATE_OK"
