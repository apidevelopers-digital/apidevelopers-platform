name: Trust Face AuraFace 512D Non-Biometric Runtime Smoke Once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare pinned AuraFace model ephemerally
        shell: bash
        run: |
          set -euo pipefail
          expected_bytes=260694151
          expected_sha=a7933ea5330113b01c9b60351d8f4c33003f145d8470ac5f0e52ee2effe25c60
          source_rev=af6d057c9b0ec4071d4c49c80e3539258798b609
          cache="$HOME/.cache/apidevelopers-digital/trust-face/auraface-v1/glintr100.onnx"
          work="$RUNNER_TEMP/trust-face-auraface-nonbiometric-smoke"
          mkdir -p "$work"
          model="$work/glintr100.onnx"

          verify() {
            local path="$1"
            [[ -f "$path" ]]
            [[ "$(stat -f%z "$path")" == "$expected_bytes" ]]
            [[ "$(shasum -a 256 "$path" | awk '{print $1}')" == "$expected_sha" ]]
          }

          if verify "$cache"; then
            cp "$cache" "$model"
            echo "::notice title=AuraFace model source::verifiedRunnerCache=true ephemeralDownload=false"
          else
            url="https://huggingface.co/fal/AuraFace-v1/resolve/${source_rev}/glintr100.onnx?download=true"
            curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 30 --output "$model.part" "$url"
            verify "$model.part"
            mv "$model.part" "$model"
            echo "::notice title=AuraFace model source::verifiedRunnerCache=false ephemeralDownload=true"
          fi

          verify "$model"
          echo "AURAFACE_SMOKE_MODEL=$model" >> "$GITHUB_ENV"

      - name: Prepare isolated runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/trust-face-auraface-smoke-venv"
          py="$RUNNER_TEMP/trust-face-auraface-smoke-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --only-binary=:all: "numpy==2.2.6" "opencv-python-headless==4.13.0.92" >/dev/null
          echo "AURAFACE_SMOKE_PY=$py" >> "$GITHUB_ENV"

      - name: Execute non-biometric 512D runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          out="packages/trust-face-engine/docs/AURAFACE_512D_NONBIOMETRIC_RUNTIME_SMOKE_EVIDENCE_V1.json"
          "$AURAFACE_SMOKE_PY" packages/trust-face-engine/scripts/run-auraface-512d-nonbiometric-runtime-smoke-v1.py             --model "$AURAFACE_SMOKE_MODEL"             --output "$out"
          "$AURAFACE_SMOKE_PY" - "$out" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as fh:
              d = json.load(fh)
          assert d["outputShape"] == [1, 512]
          assert d["outputFinite"] is True
          assert d["outputNonZero"] is True
          assert d["downstreamL2NormalizationApplied"] is True
          assert d["biometricInputUsed"] is False
          assert d["humanFaceInputUsed"] is False
          assert d["fixturePersisted"] is False
          assert d["embeddingPersisted"] is False
          assert d["embeddingLogged"] is False
          assert d["benchmarkExecuted"] is False
          assert d["thresholdApplied"] is False
          assert d["identityClaimed"] is False
          assert d["productionAuthorized"] is False
          print("sanitized_receipt_valid=true")
          PY

      - name: Persist sanitized evidence only
        shell: bash
        run: |
          set -euo pipefail
          target="packages/trust-face-engine/docs/AURAFACE_512D_NONBIOMETRIC_RUNTIME_SMOKE_EVIDENCE_V1.json"
          git add "$target"
          if git diff --cached --quiet; then
            echo "sanitized evidence unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(trust): record AuraFace 512D non-biometric runtime smoke"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Cleanup ephemeral model and runtime
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/trust-face-auraface-nonbiometric-smoke" "$RUNNER_TEMP/trust-face-auraface-smoke-venv"
          echo "::notice title=Trust Face smoke cleanup::ephemeralModelRemoved=true biometricInputUsed=false embeddingPersisted=false"
