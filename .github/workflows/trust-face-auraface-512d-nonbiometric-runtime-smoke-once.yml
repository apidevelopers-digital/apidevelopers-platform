name: Trust Face AuraFace 512D Non-Biometric Runtime Smoke Once

on:
  push:
    branches:
      - ada/trust-face-sface-lab-inference-v1
    paths:
      - ".github/workflows/trust-face-auraface-512d-nonbiometric-runtime-smoke-once.yml"

permissions:
  contents: read

jobs:
  synthetic_face_pipeline:
    if: contains(github.event.head_commit.message, '[controlled-pilot-synthetic-face-pipeline]')
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate one-shot scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n packages/trust-face-engine/scripts/run-controlled-pilot-synthetic-face-pipeline-once.sh
          python3 -m py_compile packages/trust-face-engine/scripts/run-controlled-pilot-synthetic-face-pipeline-v1.py

      - name: Execute approved controlled-pilot synthetic face pipeline
        shell: bash
        run: |
          set -euo pipefail
          bash packages/trust-face-engine/scripts/run-controlled-pilot-synthetic-face-pipeline-once.sh
