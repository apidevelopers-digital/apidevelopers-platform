name: SaaS Billing CI

on:
  push:
    branches:
      - feat/saas-billing-foundation-20260811
    paths:
      - ".github/workflows/saas-billing-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 10
    steps:
      - name: Prove external HMAC ingress
        env:
          MP_WEBHOOK_SECRET: ${{ secrets.MP_WEBHOOK_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MP_WEBHOOK_SECRET:-}"
          node --input-type=module <<'NODE'
          import { createHmac } from "node:crypto";
          const secret = String(process.env.MP_WEBHOOK_SECRET || "").trim();
          const dataId = "external123";
          const requestId = "igor-mac-runner-hmac-probe";
          const ts = String(Date.now());
          const manifest = `id:${dataId};request-id:${requestId};ts:${ts};`;
          const v1 = createHmac("sha256", secret).update(manifest).digest("hex");
          const url = `https://sitedauni.com/v1/financial/webhooks/mercadopago/br-main/?data.id=${encodeURIComponent(dataId)}`;
          const response = await fetch(url, {
            method: "POST",
            headers: {
              "content-type": "application/json",
              "x-request-id": requestId,
              "x-signature": `ts=${ts},v1=${v1}`,
            },
            body: JSON.stringify({ type: "subscription_preapproval", live_mode: false, data: { id: dataId } }),
          });
          const payload = await response.json().catch(() => null);
          console.log(JSON.stringify({
            httpStatus: response.status,
            ok: payload?.ok ?? false,
            errorClass: payload?.error ?? null,
            inputPresence: payload?.inputPresence ?? null,
            signatureVerified: payload?.signatureVerified ?? null,
            billingMutationExecuted: payload?.billingMutationExecuted ?? null,
            liveEnabled: payload?.liveEnabled ?? null,
            secretExposed: false,
          }));
          if (response.status !== 200 || payload?.signatureVerified !== true || payload?.billingMutationExecuted !== false) process.exit(1);
          NODE
