name: MCP Brain v1 tests

on:
  pull_request:
    paths:
      - "apps/mcp-brain-v1/**"
      - ".github/workflows/mcp-brain-v1-tests.yml"
  push:
    branches:
      - "ada/mcp-brain-runtime-imuni-v1-20261107"
    paths:
      - "apps/mcp-brain-v1/**"
      - ".github/workflows/mcp-brain-v1-tests.yml"

permissions:
  contents: read

jobs:
  imuni-tools:
    name: Imuni MCP tool smoke tests
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/mcp-brain-v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -r requirements.txt

      - name: Run Imuni tool tests
        run: |
          python -m pytest -q tests/test_imuni_tools.py
