name: Trust Face AuraFace 512D First Inference Once

on:
  push:
    branches:
      - ada/trust-face-sface-lab-inference-v1
    paths:
      - ".github/workflows/trust-face-auraface-512d-first-inference-once.yml"

permissions:
  contents: read

jobs:
  infer:
    if: ${{ contains(github.event.head_commit.message, '[auraface-first-inference]') }}
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate first-inference runner syntax
        shell: bash
        run: |
          python3 -m py_compile packages/trust-face-engine/src/auraface-512d-first-inference-v1.py
          bash -n packages/trust-face-engine/scripts/run-auraface-512d-first-inference-once.sh

      - name: Execute explicitly approved AuraFace 512D first inference
        shell: bash
        run: bash packages/trust-face-engine/scripts/run-auraface-512d-first-inference-once.sh
