name: API Gateway CI

on:
  push:
    branches:
      - main
      - "feat/api-gateway-foundation-clean-20260725"
      - "feat/gateway-operational-auth-lifecycle-v0"
      - "feat/gateway-operational-http-v0"
      - "feat/gateway-operational-protection-v0"
    paths:
      - "apps/api-gateway/**"
      - "packages/contracts/**"
      - "packages/auth-core/**"
      - "packages/apikey-core/**"
      - "packages/persistence-core/**"
      - ".github/workflows/api-gateway-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/api-gateway/**"
      - "packages/contracts/**"
      - "packages/auth-core/**"
      - "packages/apikey-core/**"
      - "packages/persistence-core/**"
      - ".github/workflows/api-gateway-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on:
      group: organization-macos-ci
      labels: [self-hosted, macOS, X64]
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api-gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Link local security dependencies
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/apps/api-gateway/node_modules/@apidevelopers"
          ln -sfn "$GITHUB_WORKSPACE/packages/contracts"             "$GITHUB_WORKSPACE/apps/api-gateway/node_modules/@apidevelopers/contracts"
          ln -sfn "$GITHUB_WORKSPACE/packages/auth-core"             "$GITHUB_WORKSPACE/apps/api-gateway/node_modules/@apidevelopers/auth-core"
          ln -sfn "$GITHUB_WORKSPACE/packages/apikey-core"             "$GITHUB_WORKSPACE/apps/api-gateway/node_modules/@apidevelopers/apikey-core"
          ln -sfn "$GITHUB_WORKSPACE/packages/persistence-core"             "$GITHUB_WORKSPACE/apps/api-gateway/node_modules/@apidevelopers/persistence-core"

          mkdir -p "$GITHUB_WORKSPACE/packages/auth-core/node_modules/@apidevelopers"
          ln -sfn "$GITHUB_WORKSPACE/packages/apikey-core"             "$GITHUB_WORKSPACE/packages/auth-core/node_modules/@apidevelopers/apikey-core"

          mkdir -p "$GITHUB_WORKSPACE/packages/apikey-core/noe_modules/@apidevelopers"
          ln -sfn "$GITHUB_WORKSPACE/packages/persistence-core"             "$GITHUB_WORKSPACE/packages/apikey-core/noe_modules/@apidevelopers/persistence-core"

      - name: Validate API Gateway
        id: validate
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          npm run check 2>&1 | tee "$RUNNER_TEMP/api-gateway-check.log"

      - name: Report API Gateway validation failure
        if: steps.validate.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "## API Gateway validation failure"
            echo '```text'
            tail -n 120 "$RUNNER_TEMP/api-gateway-check.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          summary="$(
            awk '
              /^not ok / { last_not_ok = $0 }
              /error:/ { last_error = $0 }
              /code:/ { last_code = $0 }
              END {
                printf "%s", last_not_ok
                if (last_error != "") printf " | %s", last_error
                if (last_code != "") printf " | %s", last_code
              }
            ' "$RUNNER_TEMP/api-gateway-check.log"
          )"

          if [[ -z "$summary" ]]; then
            summary="$(tail -n 1 "$RUNNER_TEMP/api-gateway-check.log")"
          fi

          summary="${summary//%/%25}"
          summary="${summary//$'\r'/%0D}"
          summary="${summary//$'\n'/%0A}"
          echo "::error title=API Gateway validation failure::$summary"
          exit 1

      - name: Operational runtime smoke
        run: node scripts/operational-smoke.mjs

      - name: Build operational release bundle
        run: npm run release:bundle

      - name: Verify operational release bundle
        run: npm run release:verify

      - name: Upload operational release bundle
        uses: actions/upload-artifact@v4
        with:
          name: api-gateway-release-${{ github.sha }}
          path: apps/api-gateway/dist/api-gateway
          if-no-files-found: error
          retention-days: 7

      - name: Build managed-hosting artifact
        run: npm run release:managed:build

      - name: Verify managed-hosting artifact
        run: npm run release:managed:verify

      - name: Package managed-hosting ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -f dist/api-gateway-managed.zip dist/api-gateway-managed.zip.sha256
          (
            cd dist/api-gateway-managed
            /usr/bin/zip -q -r ../api-gateway-managed.zip .
          )
          /usr/bin/unzip -l dist/api-gateway-managed.zip | grep -q "package.json"
          if /usr/bin/unzip -l dist/api-gateway-managed.zip | grep -Eq "/node_modules/"; then
            echo "::error title=Managed artifact contains node_modules::ZIP must rely on vendored file dependencies"
            exit 1
          fi
          shasum -a 256 dist/api-gateway-managed.zip > dist/api-gateway-managed.zip.sha256

      - name: Upload managed-hosting artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-gateway-managed-${{ github.sha }}
          path: |
            apps/api-gateway/dist/api-gateway-managed.zip
            apps/api-gateway/dist/api-gateway-managed.zip.sha256
          if-no-files-found: error
          retention-days: 7
