name: Zuni SaaS Provisioning CI

on:
  push:
    branches:
      - "feat/zuni-saas-provisioning-http-20260814"
    paths:
      - "apps/api-gateway/src/saas-provisioning.mjs"
      - "apps/api-gateway/src/saas-operational-http-composition.mjs"
      - "apps/api-gateway/src/saas-zuni-preview-provisioning.mjs"
      - "apps/api-gateway/test/saas-provisioning.test.mjs"
      - "apps/api-gateway/test/saas-operational-http-composition-construction.test.mjs"
      - "apps/api-gateway/test/saas-operational-http-composition.test.mjs"
      - "apps/api-gateway/test/saas-zuni-preview-provisioning.test.mjs"
      - "packages/contracts/src/index.mjs"
      - ".github/workflows/zuni-saas-provisioning-ci.yml"
  pull_request:
    paths:
      - "apps/api-gateway/src/saas-provisioning.mjs"
      - "apps/api-gateway/src/saas-operational-http-composition.mjs"
      - "apps/api-gateway/src/saas-zuni-preview-provisioning.mjs"
      - "apps/api-gateway/test/saas-provisioning.test.mjs"
      - "apps/api-gateway/test/saas-operational-http-composition-construction.test.mjs"
      - "apps/api-gateway/test/saas-operational-http-composition.test.mjs"
      - "apps/api-gateway/test/saas-zuni-preview-provisioning.test.mjs"
      - "packages/contracts/src/index.mjs"
      - ".github/workflows/zuni-saas-provisioning-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - contract: provisioning
            syntax_file: src/saas-provisioning.mjs
            test_file: test/saas-provisioning.test.mjs
          - contract: composition-construction
            syntax_file: src/saas-operational-http-composition.mjs
            test_file: test/saas-operational-http-composition-construction.test.mjs
          - contract: composition-request
            syntax_file: src/saas-operational-http-composition.mjs
            test_file: test/saas-operational-http-composition.test.mjs
          - contract: preview
            syntax_file: src/saas-zuni-preview-provisioning.mjs
            test_file: test/saas-zuni-preview-provisioning.test.mjs
    name: validate (${{ matrix.contract }})
    runs-on:
      group: organization-macos-ci
      labels: [self-hosted, macOS, X64]
    timeout-minutes: 8
    defaults:
      run:
        working-directory: apps/api-gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Link canonical local dependencies
        run: node scripts/link-local-dependencies.mjs 

      - name: Validate syntax
        run: node --check "${{ matrix.syntax_file }}"

      - name: Test contract
        run: node --test "${{ matrix.test_file }}"
