name: Temporary Restore Conta uni Hardening

on:
  push:
    branches:
      - ada/uni-saas-customer-account-media-e2e-v1

permissions:
  contents: write

jobs:
  restore:
    runs-on:
      - self-hosted
      - macOS
      - X64
    env:
      BACKUP_REF: ada/uni-saas-customer-account-media-e2e-v1-pre-main-sync-20260913
      BACKUP_SHA: 507c3c5eae2a1da2090c074c69b69345e9197983
      TARGET_BRANCH: ada/uni-saas-customer-account-media-e2e-v1
    steps:
      - name: Checkout triggering feature SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Restore guarded membership from pinned backup
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BACKUP_REF" "$TARGET_BRANCH"
          backup_actual="$(git rev-parse "origin/$BACKUP_REF")"
          target_actual="$(git rev-parse "origin/$TARGET_BRANCH")"
          if [ "$backup_actual" != "$BACKUP_SHA" ]; then
            echo "backup moved: expected $BACKUP_SHA got $backup_actual" >&2
            exit 86
          fi
          if [ "$target_actual" != "$GITHUB_SHA" ]; then
            echo "target moved after trigger: expected $GITHUB_SHA got $target_actual" >&2
            exit 87
          fi

          git checkout "$BACKUP_SHA" -- apps/api-gateway/src/saas-uni-co-customer-membership.mjs
          git rm -- .github/workflows/tmp-restore-uni-hardening.yml

          git config user.name "api-developers-sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add apps/api-gateway/src/saas-uni-co-customer-membership.mjs

          git commit -m "fix(account): restore customer role permission hardening after main sync"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
