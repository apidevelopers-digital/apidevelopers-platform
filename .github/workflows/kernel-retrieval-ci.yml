name: Kernel Retrieval CI

on:
  pull_request:
    paths:
      - "packages/kernel-retrieval/**"
      - "docs/enterprise-federated-retrieval-v1.md"
      - ".github/workflows/kernel-retrieval-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on:
      - self-hosted
      - macOS
      - X64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify kernel retrieval
        working-directory: packages/kernel-retrieval
        run: npm run check
