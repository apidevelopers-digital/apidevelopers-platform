name: Evidence Audit Contract CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "foundation/**"
    paths:
      - "packages/contracts/**"
      - ".github/workflows/evidence-audit-contract-ci.yml"
  pull_request:
    paths:
      - "packages/contracts/**"
      - ".github/workflows/evidence-audit-contract-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check evidence audit contract
        run: node --check packages/contracts/src/evidence-audit.mjs
      - name: Test evidence audit contract
        run: node --test packages/contracts/test/evidence-audit.test.mjs
