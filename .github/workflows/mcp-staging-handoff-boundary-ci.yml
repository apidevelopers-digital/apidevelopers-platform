name: MCP Staging Handoff Boundary CI

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/api-gateway/src/mcp-staging-handoff-boundary.mjs"
      - "apps/api-gateway/test/mcp-staging-handoff-boundary.test.mjs"
      - "docs/integrations/mcp-staging-handoff-boundary-v1.md"
      - ".github/workflows/mcp-staging-handoff-boundary-ci.yml"

permissions:
  contents: read

concurrency:
  group: mcp-staging-handoff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  staging-handoff-contract:
    name: MCP staging handoff offline
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify existing Node.js runtime
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node -e 'if (Number(process.versions.node.split(".")[0]) < 22) process.exit(1)'
      - name: Check syntax and run offline staging tests
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/api-gateway/src/mcp-staging-handoff-boundary.mjs
          node --check apps/api-gateway/test/mcp-staging-handoff-boundary.test.mjs
          node --test apps/api-gateway/test/mcp-staging-handoff-boundary.test.mjs
