name: Zuni Channel Binding Hostinger Wiring CI

on:
  push:
    paths:
      - "apps/api-gateway/src/hostinger-entry.mjs"
      - "apps/api-gateway/src/zuni-channel-binding-write-composition.mjs"
      - "apps/api-gateway/src/zuni-channel-binding-write-hostinger-wiring.mjs"
      - "apps/api-gateway/test/zuni-channel-binding-write-hostinger-wiring.test.mjs"
      - ".github/workflows/zuni-channel-binding-hostinger-wiring-ci.yml"
  pull_request:
    paths:
      - "apps/api-gateway/src/hostinger-entry.mjs"
      - "apps/api-gateway/src/zuni-channel-binding-write-composition.mjs"
      - "apps/api-gateway/src/zuni-channel-binding-write-hostinger-wiring.mjs"
      - "apps/api-gateway/test/zuni-channel-binding-write-hostinger-wiring.test.mjs"
      - ".github/workflows/zuni-channel-binding-hostinger-wiring-ci.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate syntax
        run: |
          set -euo pipefail
          node --check apps/api-gateway/src/hostinger-entry.mjs
          node --check apps/api-gateway/src/zuni-channel-binding-write-hostinger-wiring.mjs
          node --check apps/api-gateway/test/zuni-channel-binding-write-hostinger-wiring.test.mjs

  default-off:
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Link local workspace dependencies
        run: node apps/api-gateway/scripts/link-local-dependencies.mjs
      - name: Validate default-off contract
        run: node --test --test-name-pattern="Hostinger Channel Binding write wiring is disabled by default" apps/api-gateway/test/zuni-channel-binding-write-hostinger-wiring.test.mjs

  guardrails:
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Link local workspace dependencies
        run: node apps/api-gateway/scripts/link-local-dependencies.mjs
      - name: Validate store and S2S guardrails
        run: node --test --test-name-pattern="enabling Hostinger wiring requires" apps/api-gateway/test/zuni-channel-binding-write-hostinger-wiring.test.mjs

  enabled-wiring:
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Link local workspace dependencies
        run: node apps/api-gateway/scripts/link-local-dependencies.mjs
      - name: Validate enabled wiring behavior
        run: node --test --test-name-pattern="enabled Hostinger wiring mounts" apps/api-gateway/test/zuni-channel-binding-write-hostinger-wiring.test.mjs

  entrypoint-contract:
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Link local workspace dependencies
        run: node apps/api-gateway/scripts/link-local-dependencies.mjs
      - name: Validate Hostinger entrypoint attachment
        run: node --test --test-name-pattern="Hostinger entry attaches" apps/api-gateway/test/zuni-channel-binding-write-hostinger-wiring.test.mjs
