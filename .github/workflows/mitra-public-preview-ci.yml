name: Mitra Public Preview CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/mitra-public/**"
      - ".github/workflows/mitra-public-preview-ci.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    name: Mitra Public Preview Gate
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/mitra-public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run trust-boundary tests
        run: npm test

      - name: Build preview
        run: npm run build
