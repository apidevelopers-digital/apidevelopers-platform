name: Mitra MCP v1 Public Saved Token Probe

on:
  workflow_dispatch:
    inputs:
      approval:
        description: "Exact Igor approval token for public saved-token probe"
        required: true
        type: string
      expected_deploy_sha:
        description: "Expected deploy/hostinger-runtime commit SHA"
        required: true
        type: string
      gateway_origin:
        description: "Gateway origin"
        required: true
        default: "https://gateway.apidevelopers.digital"
        type: string

permissions:
  contents: read

concurrency:
  group: mitra-mcp-v1-public-saved-token-probe
  cancel-in-progress: false

jobs:
  probe:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.event.inputs.approval == 'IGOR_APROVA_MITRA_MCP_V1_PUBLIC_SAVED_TOKEN_PROBE'
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 10
    env:
      EXPECTED_DEPLOY_SHA: ${{ github.event.inputs.expected_deploy_sha }}
      GATEWAY_ORIGIN: ${{ github.event.inputs.gateway_origin }}
      ADA_MITRA_BRIDGE_TENANT_ID: ${{ secrets.ADA_MITRA_BRIDGE_TENANT_ID }}
      ADA_MITRA_MCP_V1_READ_TOKEN: ${{ secrets.ADA_MITRA_MCP_V1_READ_TOKEN }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Run public Mitra MCP v1 saved-token probe
        shell: bash
        run: |
          set -uo pipefail
          output_file="$(mktemp -t mitra-mcp-v1-public-probe.XXXXXX.log)"

          set +e
          node scripts/ops/mitra-mcp-v1-public-saved-token-probe.mjs 2>&1 | tee "$output_file"
          probe_status=${PIPESTATUS[0]}
          set -e

          if [ "$probe_status" -ne 0 ]; then
            failure="$(
              grep -E '^MITRA_MCP_V1_PUBLIC_PROBE_FAILURE=' "$output_file" \
                | tail -n 1 \
                | sed 's/^MITRA_MCP_V1_PUBLIC_PROBE_FAILURE=//'
            )"

            status_summary="$(
              grep -E '^MITRA_MCP_V1_PUBLIC_PROBE_(GITHUB_REF_HTTP_STATUS|DEPLOY_SHA|ROUTE_|CAPABILITIES_TOOL_COUNT|TENANT_PRESENT|MCP_READ_TOKEN_PRESENT)=' "$output_file" \
                | tail -n 12 \
                | tr '\n' ';' \
                | sed 's/;*$//'
            ")

            if [ -z "$failure" ]; then
              failure="probe_failed_without_failure_marker"
            fi

            if [ -n "$status_summary" ]; then
              echo "::notice title=Mitra MCP v1 public probe summary::$status_summary"
            fi
            echo "::error title=Mitra MCP v1 public probe failure::$failure"
            exit "$probe_status"
          fi
