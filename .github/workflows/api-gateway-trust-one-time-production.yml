name: API Gateway Trust Production Status

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-gateway-trust-production-status
  cancel-in-progress: false

jobs:
  status:
    if: github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 5
    steps:
      - name: Trust production remains fail-closed
        shell: bash
        run: |
          set -euo pipefail
          echo "Trust production activation is intentionally disabled in this workflow."
          echo "No Hostinger mutation, archive deploy, DNS change, environment write, or Trust flag activation is performed."
          echo "Any future Trust activation requires its own reviewed implementation and explicit approval immediately before execution."
