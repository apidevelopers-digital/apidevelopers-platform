name: Verify WordPress removal from API Developers production

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 10
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify removed installation and public static site
        id: verify
        continue-on-error: true
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          USERNAME: u242521810
          DOMAIN: apidevelopers.digital
          SOFTWARE_ID: "29782684"
          EXPECTED_TEXT: API Developers.digital
          EVIDENCE_PATH: ${{ runner.temp }}/wordpress-removal-evidence.json
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const sha = (value) => crypto.createHash("sha256").update(value).digest("hex");
          const report = {
            schemaVersion: "2.0",
            kind: "hostinger-wordpress-removal-reconciliation",
            generatedAt: new Date().toISOString(),
            source: {
              repository: process.env.GITHUB_REPOSITORY,
              ref: process.env.GITHUB_REF_NAME,
              sha: process.env.GITHUB_SHA,
              runId: process.env.GITHUB_RUN_ID
            },
            target: {
              username: process.env.USERNAME,
              domain: process.env.DOMAIN,
              softwareId: process.env.SOFTWARE_ID
            },
            writeExecuted: false,
            dnsChanged: false
          };
          try {
            if (!process.env.HOSTINGER_API_TOKEN) throw new Error("missing_hostinger_api_token");
            const url = new URL("/api/hosting/v1/wordpress/installations", "https://developers.hostinger.com");
            url.searchParams.set("username", process.env.USERNAME);
            url.searchParams.set("domain", process.env.DOMAIN);
            const installationsResponse = await fetch(url, {
              headers: {
                accept: "application/json",
                authorization: `Bearer ${process.env.HOSTINGER_API_TOKEN}`
              }
            });
            const installationsRaw = await installationsResponse.text();
            if (!installationsResponse.ok) throw new Error(`list_installations_failed:${installationsResponse.status}`);
            const parsed = JSON.parse(installationsRaw);
            const items = Array.isArray(parsed) ? parsed : parsed.data;
            if (!Array.isArray(items)) throw new Error("unexpected_installation_list_shape");
            const matches = items.filter((item) =>
              String(item.id) === process.env.SOFTWARE_ID &&
              item.username === process.env.USERNAMEAM &&
              item.domain === process.env.DOMAIN
            );
            const publicResponse = await fetch(`https://${process.env.DOMAIN}/`, {
              redirect: "follow",
              headers: { accept: "text/html,application/xhtml+xml", "cache-control": "no-cache" }
            });
            const publicBody = await publicResponse.text();
            const expectedTextMatched = publicBody.toLowerCase().includes(process.env.EXPECTED_TEXT.toLowerCase());
            const htmlLike = (publicResponse.headers.get("content-type") ?? "").toLowerCase().includes("text/html");
            const ok = matches.length === 0 && publicResponse.ok && expectedTextMatched && htmlLike;
            Object.assign(report, {
              status: ok ? "success" : "failed",
              verification: {
                installationAbsent: matches.length === 0,
                exactMatchCount: matches.length,
                installationListHttpStatus: installationsResponse.status,
                installationListBodySha256: sha(installationsRaw),
                staticSitePublic: publicResponse.ok && expectedTextMatched && htmlLike,
                publicHttpStatus: publicResponse.status,
                publicFinalUrl: publicResponse.url,
                publicBodySha256: sha(publicBody),
                expectedTextMatched,
                htmlLike
              }
            });
            fs.writeFileSync(process.env.EVIDENCE_PATH, JSON.stringify(report, null, 2) + "\n", { mode: 0o600 });
            if (!ok) process.exit(1);
          } catch (error) {
            report.status = "error";
            report.error = { message: error instanceof Error ? error.message : String(error) };
            fs.writeFileSync(process.env.EVIDENCE_PATH, JSON.stringify(report, null, 2) + "\n", { mode: 0o600 });
            process.exit(1);
          }
          NODE

      - name: Upload reconciliation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-removal-reconciliation-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/wordpress-removal-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce verification result
        if: ${{ steps.verify.outcome != 'success' }}
        run: exit 1
