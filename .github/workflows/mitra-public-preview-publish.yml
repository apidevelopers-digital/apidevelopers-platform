name: Mitra Public Dedicated Preview Publish

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "diagnostic only on this branch"
        required: true
        default: diagnostic
        type: choice
        options: [diagnostic]
      approved_sha:
        required: false
        type: string
      approval:
        required: false
        type: string

permissions:
  contents: read

jobs:
  preview:
    name: Diagnose Hostinger upload URL contract
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 15
    env:
      TARGET_HOSTINGER_USERNAME: u242521810

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Prepare pinned Hostinger MCP diagnostic
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/mitra-preview-hostinger-diagnostic-$GITHUB_RUN_ID"
          rm -rf "$D"
          mkdir -p "$D"
          cp apps/mitra-public/scripts/diagnose-preview-hostinger-upload.mjs "$D/client.mjs"
          cd "$D"
          npm init -y >/dev/null
          npm install --no-audit --no-fund hostinger-api-mcp@1.26.0 @modelcontextprotocol/sdk@1.10.0
          test -x node_modules/.bin/hostinger-hosting-mcp
          node --check client.mjs
          echo "DIAG_CLIENT=$D/client.mjs" >> "$GITHUB_ENV"
          echo "HOSTINGER_MCP_BIN=$D/node_modules/.bin/hostinger-hosting-mcp" >> "$GITHUB_ENV"

      - name: Diagnose upload URL generation only
        shell: bash
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$HOSTINGER_API_TOKEN"
          node "$DIAG_CLIENT"
