name: Mitra LexML Diagnostic Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: LexML SRU Diagnostic
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-noe@v4
        with:
          node-version: "22"

      - name: Diagnose official LexML SRU
        working-directory: apps/api-gateway
        run: |
          node --input-type=module <<'NODE'
          import { createMitraPublicLexmlFetchAdapter } from "./src/mitra-public-lexml-upstream.mjs";

          const adapter = createMitraPublicLexmlFetchAdapter();
          const response = await adapter.fetch(`${adapter.baseUrl}/search/global`, {
            method: "POST",
            body: JSON.stringify({
              q: "responsabilidade civil",
              limit: 3,
            }),
          });
          const payload = await response.json();

          console.log(JSON.stringify({
            status: response.status,
            ok: payload?.ok === true,
            source: payload?.source ?? null,
            resultCount: Array.isArray(payload?.results) ? payload.results.length : 0,
            error: payload?.error ?? null,
          }));

          if (response.status === 503 && payload?.error === "lexml_challenge") {
            console.log("LexML challenge detected; diagnostic completed fail-closed.");
            process.exit(0);
          }

          if (response.status !== 200 || payload?.ok !== true) {
            throw new Error( `LexML diagnostic failed: ${payload?.error ?? response.status}` );
          }
          NODE
