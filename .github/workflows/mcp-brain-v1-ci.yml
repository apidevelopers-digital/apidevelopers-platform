name: MCP Brain v1 CI

on:
  pull_request:
    paths:
      - "apps/mcp-brain-v1/**"
      - ".github/workflows/mcp-brain-v1-ci.yml"
  push:
    branches:
      - "ada/mcp-brain-runtime-imuni-v1-20261107"
    paths:
      - "apps/mcp-brain-v1/**"
      - ".github/workflows/mcp-brain-v1-ci.yml"

permissions:
  contents: read

jobs:
  imuni-tools:
    name: Imuni MCP tool tests
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 10

    defaults:
      run:
        working-directory: apps/mcp-brain-v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Python available on institutional runner
        run: |
          python3 --version
          python3 -m pip --version

      - name: Install test dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest
          python3 -m pip install -r requirements.txt

      - name: Run Imuni MCP tool tests
        env:
          PYTHONPATH: .
        run: |
          python3 -m pytest -q            tests/test_imuni_tools.py            tests/test_imuni_schema.py            tests/test_imuni_db_tools.py
