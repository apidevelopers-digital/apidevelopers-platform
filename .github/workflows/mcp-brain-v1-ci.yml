name: MCP Brain v1 CI

on:
  pull_request:
    paths:
      - "apps/mcp-brain-v1/**"
      - ".github/workflows/mcp-brain-v1-ci.yml"
  push:
    branches:
      - "ada/mcp-brain-runtime-imuni-v1-20261107"
    paths:
      - "apps/mcp-brain-v1/**"
      - ".github/workflows/mcp-brain-v1-ci.yml"

permissions:
  contents: read

jobs:
  ci-gate:
    name: MCP Brain v1 CI gate
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: CI delegated to MCP Brain v1 tests workflow
        run: |
          echo "MCP Brain v1 CI is a lightweight gate."
          echo "Package tests are executed by: MCP Brain v1 tests."
          echo "No deploy, no reload, no VPS access, no secrets."
