name: Temporary Main Conflict Alignment

on:
  push:
    branches:
      - ada/uni-saas-customer-account-media-e2e-v1

permissions:
  contents: write

jobs:
  align:
    runs-on:
      - self-hosted
      - macOS
      - X64
    env:
      EXPECTED_MAIN_SHA: e6a8c13d9e78d0b6ebbd784ff1a562c9e155f088
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Align conflicting blobs to exact main SHA
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          current_main="$(git rev-parse origin/main)"
          if [ "$current_main" != "$EXPECTED_MAIN_SHA" ]; then
            echo "main moved: expected $EXPECTED_MAIN_SHA, got $current_main" >&2
            exit 86
          fi

          git checkout "$EXPECTED_MAIN_SHA" --             apps/api-gateway/src/saas-operational-http-composition.mjs             apps/api-gateway/src/saas-uni-co-customer-membership.mjs             apps/api-gateway/src/uni-account-preview-authorize-http.mjs

          git rm -- .github/workflows/tmp-sync-main-conflicts.yml
          git config user.name "api-developers-sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add             apps/api-gateway/src/saas-operational-http-composition.mjs             apps/api-gateway/src/saas-uni-co-customer-membership.mjs             apps/api-gateway/src/uni-account-preview-authorize-http.mjs

          if git diff --cached --quiet; then
            echo "No conflict-alignment changes required."
            exit 0
          fi

          git commit -m "chore(uni): stage main conflict blobs for sync merge"
          git push origin "HEAD:${GITHUB_REF_NAME}"
