name: Runner Smoke CI

on:
  push:
    branches:
      - "foundation/**"
    paths:
      - ".github/workflows/runner-smoke-ci.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Smoke
        run: |
          echo "ok"
          uname -m
          sw_vers

