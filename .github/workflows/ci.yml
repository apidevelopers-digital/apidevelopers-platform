name: Platform CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: platform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'workflow_dispatch' || github.ref_name != 'feature/rule-engine-stabilization-20260721'
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Preflight workspace manifests
        run: node scripts/check-workspace-manifests.mjs
      - name: Install workspace links
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Test root tooling
        run: node --test --test-reporter=spec tests/tooling/*.test.mjs
      - name: Test root integration
        run: node --test --test-reporter=spec tests/integration/*.test.mjs
      - name: Test workspace packages
        run: npm test --workspaces --if-present
      - name: Run institutional audit
        run: npm run audit:institutional
      - name: Validate institutional audit artifacts
        run: |
          test -f .audit/snapshot.json
          test -f .audit/report.md
          node -e 'const fs=require("fs"); const s=JSON.parse(fs.readFileSync(".audit/snapshot.json","utf8")); if (!s.commit || !s.summary || typeof s.summary.files !== "number" || is.summary.files < 1) process.exit(1);'
      - name: Reject transient publishing artifacts
        run: |
          test ! -d .wave5
          test ! -d .publish

  architecture-baseline:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'feature/rule-engine-stabilization-20260721'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable branch revision
        uses: actions/checkout4v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check index syntax
        run: node --check packages/architecture-rule-engine/src/index.mjs

      - name: Check repository syntax
        run: node --check packages/architecture-rule-engine/src/repository.mjs

      - name: Check filesystem repository syntax
        run: node --check packages/architecture-rule-engine/src/filesystem-repository.mjs

      - name: Check loaders syntax
        run: node --check packages/architecture-rule-engine/src/loaders.mjs

      - name: Check adapters syntax
        run: node --check packages/architecture-rule-engine/src/adapters.mjs

      - name: Check export-contract syntax
        run: node --check packages/architecture-rule-engine/src/export-contract.mjs

      - name: Check validation service syntax
        run: node --check packages/architecture-rule-engine/src/validation-service.mjs

      - name: Test Rule Engine core
        run: node --test packages/architecture-rule-engine/test/index.test.mjs

      - name: Test Rule Engine runtime
        run: node --test packages/architecture-rule-engine/test/runtime.test.mjs

      - name: Test filesystem repository
        run: node --test packages/architecture-rule-engine/test/filesystem-repository.test.mjs

      - name: Test CLI fixture
        run: node --test packages/architecture-rule-engine/test/cli-fixture.test.mjs

      - name: Generate canonical architecture report
        run: |
          node scripts/apid.mjs architecture validate \
            --scope repository \
            --output artifacts/architecture/validation-report.json

      - name: Verify canonical report integrity
        run: |
          node scripts/architecture-report-check.mjs \
            artifacts/architecture/validation-report.json

      - name: Upload immutable architecture evidence
        uses: actions/upload-artifact@v4
        with:
          name: architecture-baseline-${{ github.run_id }}
          path: artifacts/architecture/validation-report.json
          if-no-files-found: error
          retention-days: 14
