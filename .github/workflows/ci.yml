name: Platform CI

on:
  push:
    branches:
      - main
      - "foundation/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: platform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate platform structure
        run: node scripts/check-structure.mjs

      - name: Validate capability registry
        run: node scripts/build-capability-index.mjs --check

      - name: Validate JSON contracts and manifests
        run: node scripts/check-json.mjs

      - name: Run tooling tests
        run: node --test tests/tooling/*.test.mjs

      - name: Run package, service and engine tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' tests < <(
            find packages services engines               -path "*/test/*.test.mjs"               -not -path "*/node_modules/*"               -print0 | sort -z
          )
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "No workspace tests found."
            exit 1
          fi
          node --test "${tests[@]}"

      - name: Run integration tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' tests < <(find tests/integration -name "*.test.mjs" -print0 | sort -z)
          if [ "${#tests[@]}" -gt 0 ]; then
            node --test "${tests[@]}"
          fi

      - name: Reject transient publishing artifacts
        shell: bash
        run: |
          set -euo pipefail
          if find . -maxdepth 2 -type d \( -name ".wave*" -o -name ".publish*" \) | grep -q .; then
            echo "Transient publhing artifacts are not allowed."
            exit 1
          fi
