name: Site Factory Hostinger Business Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Hostinger Business API read-only preflight
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 10

    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Site Factory
        working-directory: apps/site-factory
        run: |
          npm install --no-audit --no-fund
          npm run check

      - name: Prepare sanitized output path
        shell: bash
        run: |
          set -euo pipefail
          echo "PREFLIGHT_OUTPUT_PATH=$RUNNER_TEMP/hostinger-business-preview-preflight.json" >> "$GITHUB_ENV"

      - name: Assert required GitHub Actions secrets are available
        shell: bash
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          # Legacy secret name retained to avoid exposing or re-entering the order ID.
          HOSTINGER_HOSTING_ORDER_ID: ${{ secrets.HOSTINGER_AGENCY_ORDER_ID }}
        run: |
          set -euo pipefail
          test -n "$HOSTINGER_API_TOKEN"
          test -n "$HOSTINGER_HOSTING_ORDER_ID"

      - name: Run Hostinger Business API read-only preflight
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          HOSTINGER_HOSTING_ORDER_ID: ${{ secrets.HOSTINGER_AGENCY_ORDER_ID }}
        run: node apps/site-factory/src/run-hostinger-agency-preflight.mjs

      - name: Assert report is non-executable
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - "$PREFLIGHT_OUTPUT_PATH" <<'NODE'
          import fs from "node:fs";

          const report = JSON.parse(
            fs.readFileSync(process.argv[2], "utf8"),
          );

          const safe =
            report.kind === "hostinger-business-hosting-preview-preflight" &&
            report.product === "business-web-hosting" &&
            report.mode === "read-only" &&
            report.executable === false &&
            report.writesEnabled === false &&
            report.provisioningEnabled === false &&
            report.dnsEnabled === false &&
            report.deployEnabled === false &&
            report.intendedProvisioning?.createsWebsite === false &&
            report.intendedProvisioning?.connectsRepository === false &&
            report.intendedProvisioning?.configuresDns === false &&
            report.intendedProvisioning?.deploysArtifact === false &&
            report.intendedProvisioning?.uploadsArchive === false;

          if (!safe) {
            throw new Error("unsafe_hostinger_business_preflight_report");
          }
          NODE

      - name: Upload sanitized preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: hostinger-business-preview-preflight-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/hostinger-business-preview-preflight.json
