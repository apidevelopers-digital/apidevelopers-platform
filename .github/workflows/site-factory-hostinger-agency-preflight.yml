name: Site Factory Hostinger Agency Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Hostinger API read-only preflight
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 10
    env:
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
      HOSTINGER_AGENCY_ORDER_ID: ${{ secrets.HOSTINGER_AGENCY_ORDER_ID }}
      PREFLIGHT_OUTPUT_PATH: ${{ runner.temp }}/hostinger-agency-preview-preflight.json

    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Site Factory
        working-directory: apps/site-factory
        run: |
          npm install --no-audit --no-fund
          npm run check

      - name: Assert required GitHub Actions secrets are available
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOSTINGER_API_TOKEN"
          test -n "$HOSTINGER_AGENCY_ORDER_ID"

      - name: Run Hostinger Agency API read-only preflight
        run: node apps/site-factory/src/run-hostinger-agency-preflight.mjs

      - name: Assert report is non-executable
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - "$PREFLIGHT_OUTPUT_PATH" <<'NODE'
          import fs from "node:fs";

          const report = JSON.parse(
            fs.readFileSync(process.argv[2], "utf8"),
          );

          const safe =
            report.mode === "read-only" &&
            report.executable === false &&
            report.writesEnabled === false &&
            report.provisioningEnabled === false &&
            report.dnsEnabled === false &&
            report.deployEnabled === false &&
            report.intendedProvisioning?.createsWebsite === false &&
            report.intendedProvisioning?.connectsRepository === false &&
            report.intendedProvisioning?.configuresDns === false &&
            report.intendedProvisioning?.deploysArtifact === false;

          if (!safe) {
            throw new Error("unsafe_hostinger_agency_preflight_report");
          }
          NODE

      - name: Upload sanitized preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: hostinger-agency-preview-preflight-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ env.PREFLIGHT_OUTPUT_PATH }}
