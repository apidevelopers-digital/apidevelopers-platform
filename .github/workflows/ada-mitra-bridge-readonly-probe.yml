name: ADA Mitra Bridge Readonly Probe

on:
  workflow_dispatch:
    inputs:
      approval:
        description: "Exact Igor approval token"
        required: true
        type: string
      expected_source_sha:
        description: "Expected Gateway runtime SOURCE_SHA"
        required: true
        type: string
      gateway_origin:
        description: "Gateway origin"
        required: false
        default: "https://gateway.apidevelopers.digital"
        type: string

permissions:
  contents: write

concurrency:
  group: ada-mitra-bridge-readonly-probe
  cancel-in-progress: false

jobs:
  probe:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.approval == 'IGOR_APROVA_ADA_MITRA_READONLY_PROBE_20260920'
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 10
    env:
      GATEWAY_ORIGIN: ${{ github.event.inputs.gateway_origin }}
      EXPECTED_SOURCE_SHA: ${{ github.event.inputs.expected_source_sha }}
      ADA_MITRA_BRIDGE_BEARER: ${{ secrets.ADA_MITRA_BRIDGE_READ_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Run read-only probe and persist sanitized result
        shell: bash
        run: |
          set -uo pipefail
          test "$EXPECTED_SOURCE_SHA" = "27093700631cc21423d2ce561a1dd99ad78e68b7"
          test "$GATEWAY_ORIGIN" = "https://gateway.apidevelopers.digital"

          mkdir -p docs/ops
          raw_log="$(mktemp)"
          sanitized_file="docs/ops/ada-mitra-bridge-readonly-probe.latest.txt"

          set +e
          node scripts/ops/ada-mitra-bridge-readonly-probe.mjs > "$raw_log" 2>&1
          probe_exit="$?"
          set -e

          {
            echo "ADA_MITRA_BRIDGE_AUDIT_RUN=${GITHUB_RUN_NUMBER}"
            echo "ADA_MITRA_BRIDGE_AUDIT_RUN_ID=${GITHUB_RUN_ID}"
            echo "ADA_MITRA_BRIDGE_AUDIT_REF=${GITHUB_REF_NAME}"
            echo "ADA_MITRA_BRIDGE_AUDIT_SHA=${GITHUB_SHA}"
            echo "ADA_MITRA_BRIDGE_AUDIT_PROBE_EXIT=${probe_exit}"
            grep '^ADA_MITRA_BRIDGE_' "$raw_log" || true
          } > "$sanitized_file"

          if grep -Eiq '(authorization|bearer |token|cookie|secret=[^[:space:]]|password|database_url|private_key)' "$sanitized_file"; then
            echo "ADA_MITRA_BRIDGE_AUDIT_SANITIZER_BLOCKED=true" > "$sanitized_file"
            echo "Sanitizer blocked diagnostic output"
            exit 1
          fi

          cat "$sanitized_file"

          git config user.name "sitedauni-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$sanitized_file"
          git commit -m "chore: record sanitized Mitra bridge probe result" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

          exit "$probe_exit"
