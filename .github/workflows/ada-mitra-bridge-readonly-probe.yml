name: ADA Mitra Bridge Readonly Probe

on:
  workflow_dispatch:
    inputs:
      approval:
        description: "Exact Igor approval token"
        required: true
        type: string
      expected_source_sha:
        description: "Expected Gateway runtime SOURCE_SHA"
        required: true
        type: string
      gateway_origin:
        description: "Gateway origin"
        required: false
        default: "https://gateway.apidevelopers.digital"
        type: string

permissions:
  contents: read

concurrency:
  group: ada-mitra-bridge-readonly-probe
  cancel-in-progress: false

jobs:
  probe:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.event.inputs.approval == 'IGOR_APROVA_ADA_MITRA_READONLY_PROBE_20260920'
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 10
    env:
      GATEWAY_ORIGIN: ${{ github.event.inputs.gateway_origin }}
      EXPECTED_SOURCE_SHA: ${{ github.event.inputs.expected_source_sha }}
      ADA_MITRA_BRIDGE_BEARER: ${{ secrets.ADA_MITRA_BRIDGE_READ_TOKEN }}

    steps:
      - name: Confirm probe boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$EXPECTED_SOURCE_SHA" = "27093700631cc21423d2ce561a1dd99ad78e68b7"
          test "$GATEWAY_ORIGIN" = "https://gateway.apidevelopers.digital"
          test -n "${ADA_MITRA_BRIDGE_BEARER:-}"
          echo "ADA_MITRA_BRIDGE_READONLY_PROBE_BOUNDARIES_OK"

      - name: Probe read-only ADA Mitra bridge endpoints
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          endpoints=(
            "/v1/ada/mitra/status"
            "/v1/ada/mitra/capabilities"
            "/v1/ada/mitra/connectors"
          )

          for endpoint in "${endpoints[@]}"; do
            name="$(printf '%s' "$endpoint" | tr '/:' '__')"
            body="$tmp/${name}.json"
            status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
              --request GET \
              --header 'Accept: application/json' \
              --header "Authorization: Bearer ${ADA_MITRA_BRIDGE_BEARER}" \
              --header 'User-Agent: apidevelopers-platform/ada-mitra-bridge-readonly-probe' \
              "${GATEWAY_ORIGIN}${endpoint}")"

            if [ "$status" != "200" ]; then
              echo "ADA_MITRA_BRIDGE_PROBE_${endpoint}_STATUS_${status}"
              exit 1
            fi

            node - "$endpoint" "$body" <<'NODE'
          const [endpoint, bodyPath] = process.argv.slice(2);
          const fs = require("node:fs");
          const raw = fs.readFileSync(bodyPath, "utf8");
          const lower = raw.toLowerCase();

          for (const forbidden of [
            "bearer ",
            "password",
            "access_token",
            "refresh_token",
            "cookie",
            "database_url",
            "private_key",
          ]) {
            if (lower.includes(forbidden)) {
              throw new Error(`secret_like_field_exposed:${endpoint}:${forbidden}`);
            }
          }

          const body = JSON.parse(raw);
          if (body.ok !== true) throw new Error(`probe_not_ok:${endpoint}`);
          if (body.service !== "ada-mitra-bridge") throw new Error(`unexpected_service:${endpoint}`);

          if (endpoint.endsWith("/status")) {
            if (body.status !== "ready") throw new Error("status_not_ready");
            if (body.mode !== "read_only_skeleton") throw new Error("unexpected_mode");
            if (body.dataAccess?.liveDatabaseConnected !== false) throw new Error("live_database_connected");
            if (body.dataAccess?.rawSqlAllowed !== false) throw new Error("raw_sql_allowed");
            if (body.dataAccess?.writeAllowed !== false) throw new Error("write_allowed");
          }

          if (endpoint.endsWith("/capabilities")) {
            const paths = new Set((body.capabilities ?? []).map((cap) => cap.path));
            for (const required of [
              "/v1/ada/mitra/status",
              "/v1/ada/mitra/capabilities",
              "/v1/ada/mitra/connectors",
            ]) {
              if (!paths.has(required)) throw new Error(`missing_capability:${required}`);
            }
            if (!(body.unavailableUntilApproved ?? []).includes("raw_sql")) {
              throw new Error("raw_sql_not_marked_unavailable");
            }
          }

          if (endpoint.endsWith("/connectors")) {
            if (body.connectorCount !== 0) throw new Error("unexpected_connector_count");
            if (body.liveDatabaseConnected !== false) throw new Error("connector_live_database_connected");
            if (body.credentialsConfigured !== false) throw new Error("connector_credentials_configured");
            if (body.rawSqlAllowed !== false) throw new Error("connector_raw_sql_allowed");
            if (body.writeAllowed !== false) throw new Error("connector_write_allowed");
          }

          console.log(`ADA_MITRA_BRIDGE_PROBE_OK ${endpoint}`);
          NODE
          done

      - name: Confirm runtime source SHA
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
            --request GET \
            --header 'Accept: text/plain' \
            --header 'User-Agent: apidevelopers-platform/ada-mitra-bridge-readonly-probe' \
            "${GATEWAY_ORIGIN}/SOURCE_SHA" || true)"
          if [ "$status" = "200" ]; then
            grep -Fx "$EXPECTED_SOURCE_SHA" "$body"
            echo "ADA_MITRA_BRIDGE_SOURCE_SHA_CONFIRMED"
          else
            echo "ADA_MITRA_BRIDGE_SOURCE_SHA_ENDPOINT_UNAVAILABLE_STATUS_${status}"
          fi
