name: Validate Zuni Delegated Binding Proof

on:
  push:
    branches:
      - "feat/zuni-delegated-binding-proof-v1-20260815"
    paths:
      - "apps/api-gateway/src/saas-delegated-binding-proof.mjs"
      - "apps/api-gateway/src/saas-delegated-access-v2.mjs"
      - "apps/api-gateway/src/saas-operational-http-composition.mjs"
      - "apps/api-gateway/test/saas-delegated-binding-proof.test.mjs"
      - "apps/api-gateway/test/saas-delegated-access-binding-proof.test.mjs"
      - ".github/workflows/validate-zuni-delegated-binding-proof.yml"
  pull_request:
    paths:
      - "apps/api-gateway/src/saas-delegated-binding-proof.mjs"
      - "apps/api-gateway/src/saas-delegated-access-v2.mjs"
      - "apps/api-gateway/src/saas-operational-http-composition.mjs"
      - "apps/api-gateway/test/saas-delegated-binding-proof.test.mjs"
      - "apps/api-gateway/test/saas-delegated-access-binding-proof.test.mjs"
      - ".github/workflows/validate-zuni-delegated-binding-proof.yml"

permissions:
  contents: read

x-runner: &runner
  runs-on:
    - self-hosted
    - macOS
    - X64
  timeout-minutes: 5

jobs:
  syntax:
    <<: *runner
    steps:
      - uses: actions/checkout@v5
      - name: Validate syntax
        working-directory: apps/api-gateway
        run: |
          set -Eeuo pipefail
          node --check src/saas-delegated-binding-proof.mjs
          node --check src/saas-delegated-access-v2.mjs
          node --check src/saas-operational-http-composition.mjs

  tests:
    <<: *runner
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Link local security dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$GITHUB_WORKSPACE/apps/api-gateway/node_modules/@apidevelopers"
          ln -sfn "$GITHUB_WORKSPACE/packages/contracts" "$GITHUB_WORKSPACE/apps/api-gateway/node_modules/@apidevelopers/contracts"
          ln -sfn "$GITHUB_WORKSPACE/packages/auth-core" "$GITHUB_WORKSPACE/apps/api-gateway/node_modules/@apidevelopers/auth-core"
          ln -sfn "$GITHUB_WORKSPACE/packages/apikey-core" "$GITHUB_WORKSPACE/apps/api-gateway/node_modules/@apidevelopers/apikey-core"
          ln -sfn "$GITHUB_WORKSPACE/packages/persistence-core" "$GITHUB_WORKSPACE/apps/api-gateway/node_modules/@apidevelopers/persistence-core"
          ln -sfn "$GITHUB_WORKSPACE/packages/saas-runtime" "$GITHUB_WORKSPACE/apps/api-gateway/node_modules/@apidevelopers/saas-runtime"
          mkdir -p "$GITHUB_WORKSPACE/packages/auth-core/node_modules/@apidevelopers"
          ln -sfn "$GITHUB_WORKSPACE/packages/apikey-core" "$GITHUB_WORKSPACE/packages/auth-core/node_modules/@apidevelopers/apikey-core"
          mkdir -p "$GITHUB_WORKSPACE/packages/apikey-core/node_modules/@apidevelopers"
          ln -sfn "$GITHUB_WORKSPACE/packages/persistence-core" "$GITHUB_WORKSPACE/packages/apikey-core/node_modules/@apidevelopers/persistence-core"
          mkdir -p "$GITHUB_WORKSPACE/packages/saas-runtime/node_modules/@apidevelopers"
          ln -sfn "$GITHUB_WORKSPACE/packages/contracts" "$GITHUB_WORKSPACE/packages/saas-runtime/node_modules/@apidevelopers/contracts"
          ln -sfn "$GITHUB_WORKSPACE/packages/auth-core" "$GITHUB_WORKSPACE/packages/saas-runtime/node_modules/@apidevelopers/auth-core"
          ln -sfn "$GITHUB_WORKSPACE/packages/persistence-core" "$GITHUB_WORKSPACE/packages/saas-runtime/node_modules/@apidevelopers/persistence-core"
      - name: Run focused binding proof tests
        working-directory: apps/api-gateway
        run: |
          set -Eeuo pipefail
          node --test test/saas-delegated-binding-proof.test.mjs
          node --test test/saas-delegated-access-binding-proof.test.mjs

  guards:
    <<: *runner
    steps:
      - uses: actions/checkout@v5
      - name: Guard cryptographic contract
        working-directory: apps/api-gateway
        run: |
          set -Eeuo pipefail
          grep -Fq 'RSA-PSS-SHA256' src/saas-delegated-binding-proof.mjs
          grep -Fq 'unico-api-platform:zuni-documents' src/saas-delegated-binding-proof.mjs
          grep -Fq 'decision.allowed && bindingSigner' src/saas-delegated-access-v2.mjs
          if grep -Eq 'BEGIN (RSA )?PRIVATE KEY' src/saas-delegated-binding-proof.mjs test/saas-delegated-binding-proof.test.mjs; then
            echo "Private key material must not be committed."
            exit 1
          fi
