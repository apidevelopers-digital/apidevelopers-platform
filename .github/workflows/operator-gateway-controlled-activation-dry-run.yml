name: Operator Gateway Controlled Activation Dry Run

on:
  workflow_dispatch:
    inputs:
      example:
        description: Authorization phrase for Mercado Pago webhook secret parity check
        required: true
        type: string

permissions:
  contents: read

jobs:
  controlled-dry-run:
    name: Mercado Pago webhook secret parity read-only
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 10
    steps:
      - name: Validate explicit authorization
        env:
          APPROVAL: ${{ inputs.example }}
        shell: bash
        run: |
          set -euo pipefail
          test "$APPROVAL" = "AUTORIZO_CHECK_PARIDADE_SECRET_WEBHOOK_MP_TEST"

      - name: Compare GitHub secret with materialized server secret fingerprint
        env:
          MP_WEBHOOK_SECRET: ${{ secrets.MP_WEBHOOK_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MP_WEBHOOK_SECRET:-}"
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          const secret = String(process.env.MP_WEBHOOK_SECRET || "").trim();
          if (!secret) process.exit(20);
          const expectedServerFileSha256 = "4681f033887a5ff766df07146559755b7525bb82b94feb18a27173228e773a3";
          const candidate = createHash("sha256").update(secret + "\n", "utf8").digest("hex");
          const same = candidate === expectedServerFileSha256;
          console.log(JSON.stringify({
            ok: same,
            githubSecretPresent: true,
            serverMaterializedSecretPresent: true,
            fingerprintsMatch: same,
            secretExposed: false,
            liveEnabled: false,
          }));
          if (!same) process.exit(21);
          NODE

      - name: Check published endpoint readiness
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const response = await fetch("https://sitedauni.com/v1/financial/webhooks/mercadopago/br-main/", {
            method: "GET",
            headers: { accept: "application/json" },
          });
          const payload = await response.json().catch(() => null);
          const ok = response.status === 200 &&
            payload?.ok === true &&
            payload?.mode === "test" &&
            payload?.secretConfigured === true &&
            payload?.signatureVerificationEnabled === true &&
            payload?.eventProcessingEnabled === false &&
            payload?.liveEnabled === false;
          console.log(JSON.stringify({
            ok,
            httpStatus: response.status,
            mode: payload?.mode ?? null,
            secretConfigured: payload?.secretConfigured ?? null,
            signatureVerificationEnabled: payload?.signatureVerificationEnabled ?? null,
            eventProcessingEnabled: payload?.eventProcessingEnabled ?? null,
            liveEnabled: payload?.liveEnabled ?? null,
          }));
          if (!ok) process.exit(22);
          NODE
