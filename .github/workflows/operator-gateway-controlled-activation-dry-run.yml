name: Operator Gateway Controlled Activation Dry Run

on:
  workflow_dispatch:
    inputs:
      example:
        description: Authorization phrase for Mercado Pago webhook readiness read-only check
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mercadopago-webhook-readiness-check
  cancel-in-progress: false

jobs:
  controlled-dry-run:
    name: Mercado Pago webhook readiness read-only
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 10
    steps:
      - name: Validate explicit authorization
        env:
          APPROVAL: ${{ inputs.example }}
        shell: bash
        run: |
          set -euo pipefail
          test "$APPROVAL" = "AUTORIZO_CHECK_READ_ONLY_WEBHOOK_MP"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check webhook secret presence without revealing value
        env:
          MP_WEBHOOK_SECRET: ${{ secrets.MP_WEBHOOK_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${MP_WEBHOOK_SECRET:-}" ]]; then
            echo "mercadopago_webhook_secret_present=false"
            exit 20
          fi
          echo "mercadopago_webhook_secret_present=true"

      - name: Run Mercado Pago signature verifier tests
        shell: bash
        run: |
          set -euo pipefail
          node --test packages/saas-billing/test/mercadopago-client.test.mjs
