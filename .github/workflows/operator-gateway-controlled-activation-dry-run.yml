name: Operator Gateway Controlled Activation Dry Run

on:
  workflow_dispatch:
    inputs:
      example:
        required: true
        type: string

permissions:
  contents: write

jobs:
  controlled-dry-run:
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Create one pending Mercado Pago pilot subscription
        shell: bash
        env:
          APPROVAL: ${{ inputs.example }}
          MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
          MP_EXPECTED_TEST_USER_ID: ${{ secrets.MP_EXPECTED_TEST_USER_ID }}
        run: |
          set -euo pipefail
          test "$APPROVAL" = "AUTORIZO_CRIAR_1_ASSINATURA_PILOTO_MP_TEST"
          node scripts/mercadopago-create-pilot-subscription.mjs
      - name: Commit sanitized evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "api-developers-bot"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/mercadopago-pilot-subscription.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test(billing): registrar assinatura piloto Mercado Pago pendente"
          git push origin HEAD:${GITHUB_REF_NAME}
