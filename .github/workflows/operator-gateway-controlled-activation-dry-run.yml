name: Operator Gateway Controlled Activation Dry Run

on:
  workflow_dispatch:
    inputs:
      example:
        description: Authorization phrase for encrypted Mercado Pago webhook secret parity check
        required: true
        type: string

permissions:
  contents: read

jobs:
  controlled-dry-run:
    name: Mercado Pago encrypted webhook secret parity check
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 10
    steps:
      - name: Validate explicit authorization
        env:
          APPROVAL: ${{ inputs.example }}
        shell: bash
        run: |
          set -euo pipefail
          test "$APPROVAL" = "AUTORIZO_CHECK_CRIPTO_PARIDADE_SECRET_WEBHOOK_MP_TEST"

      - name: Compare encrypted GitHub secret with server copy without revealing either
        env:
          MP_WEBHOOK_SECRET: ${{ secrets.MP_WEBHOOK_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MP_WEBHOOK_SECRET:-}"
          node --input-type=module <<'NODE'
          import { publicEncrypt, constants } from "node:crypto";
          const secret = String(process.env.MP_WEBHOOK_SECRET || "");
          if (!secret) process.exit(20);

          const bootstrapRes = await fetch("https://sitedauni.com/v1/financial/webhooks/mercadopago/key-bootstrap.php", {
            headers: { accept: "application/json" },
          });
          const bootstrap = await bootstrapRes.json().catch(() => null);
          if (!bootstrapRes.ok || !bootstrap?.ok || !bootstrap?.publicKeyB64) process.exit(21);

          const publicKey = Buffer.from(String(bootstrap.publicKeyB64), "base64").toString("utf8");
          const ciphertext = publicEncrypt({
            key: publicKey,
            padding: constants.RSA_PKCS1_OAEP_PADDING,
            oaepHash: "sha1",
          }, Buffer.from(secret, "utf8")).toString("base64");

          const compareRes = await fetch("https://sitedauni.com/v1/financial/webhooks/mercadopago/key-import.php", {
            method: "POST",
            headers: { accept: "application/json", "content-type": "application/json" },
            body: JSON.stringify({ ciphertextB64: ciphertext }),
          });
          const payload = await compareRes.json().catch(() => null);
          const same = compareRes.status === 200 &&
            payload?.ok === true &&
            payload?.configured === true &&
            payload?.alreadyConfigured === true;
          console.log(JSON.stringify({
            ok: same,
            httpStatus: compareRes.status,
            sameSecret: same,
            serverHasSecret: compareRes.status === 200 || compareRes.status === 409,
            secretExposed: false,
            liveEnabled: false,
          }));
          if (!same) process.exit(22);
          NODE
