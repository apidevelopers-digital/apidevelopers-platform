name: Operator Gateway Controlled Activation Dry Run

on:
  workflow_dispatch:
    inputs:
      example:
        description: Authorization phrase for Mercado Pago authenticated read-only test
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mercadopago-authenticated-readonly-probe
  cancel-in-progress: false

jobs:
  controlled-dry-run:
    name: Mercado Pago read-only user id binding check
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 10
    steps:
      - name: Validate explicit authorization
        env:
          APPROVAL: ${{ inputs.example }}
        shell: bash
        run: |
          set -euo pipefail
          test "$APPROVAL" = "AUTORIZO_TESTE_READ_ONLY_MERCADO_PAGO"

      - name: Compare Mercado Pago user id without revealing values
        shell: bash
        env:
          MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
          MP_EXPECTED_TEST_USER_ID: ${{ secrets.MP_EXPECTED_TEST_USER_ID }}
        run: |
          set -euo pipefail
          test -n "${MP_ACCESS_TOKEN:-}"
          test -n "${MP_EXPECTED_TEST_USER_ID:-}"
          node --input-type=module <<'NODE'
          const token = process.env.MP_ACCESS_TOKEN;
          const expected = String(process.env.MP_EXPECTED_TEST_USER_ID || "").trim();
          const response = await fetch("https://api.mercadolibre.com/users/me", {
            method: "GET",
            headers: {
              accept: "application/json",
              authorization: `Bearer ${token}`,
            },
          });
          if (!response.ok) process.exit(30);
          const payload = await response.json();
          const actual = payload?.id == null ? "" : String(payload?.id ?? "").trim();
          if (!actual) process.exit(31);
          if (actual !== expected) process.exit(32);
          console.log("mercadopago-user-id-binding=ok");
          NODE
