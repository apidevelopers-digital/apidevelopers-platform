name: Operator Gateway Controlled Activation Dry Run

on:
  workflow_dispatch:
    inputs:
      example:
        description: Authorization phrase for Mercado Pago authenticated read-only test
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mercadopago-authenticated-readonly-probe
  cancel-in-progress: false

jobs:
  controlled-dry-run:
    name: Mercado Pago authenticated read-only probe
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 10
    steps:
      - name: Validate explicit authorization
        env:
          APPROVAL: ${{ inputs.example }}
        shell: bash
        run: |
          set -euo pipefail
          test "$APPROVAL" = "AUTORIZO_TESTE_READ_ONLY_MERCADO_PAGO"

      - name: Checkout frozen revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate read-only probe regression tests
        shell: bash
        run: node --test packages/saas-billing/test/mercadopago-auth-probe.test.mjs

      - name: Run Mercado Pago authenticated read-only probe
        shell: bash
        env:
          APD_BILLING_MODE: test
          APD_BILLING_LIVE_ENABLED: "false"
          MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
          MP_EXPECTED_TEST_USER_ID: ${{ secrets.MP_EXPECTED_TEST_USER_ID }}
        run: |
          set -euo pipefail
          test -n "${MP_ACCESS_TOKEN:-}"
          test -n "${MP_EXPECTED_TEST_USER_ID:-}"
          node scripts/mercadopago-auth-probe.mjs
