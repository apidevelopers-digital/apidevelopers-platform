name: Operator Gateway Controlled Activation Dry Run

on:
  workflow_dispatch:
    inputs:
      example:
        description: API transport field; must contain the exact synthetic dry-run approval phrase
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: operator-gateway-controlled-activation-dry-run
  cancel-in-progress: false

jobs:
  controlled-dry-run:
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: apps/api-gateway
    steps:
      - name: Validate explicit approval
        env:
          APPROVAL: ${{ inputs.example }}
        run: |
          set -euo pipefail
          test "$APPROVAL" = "IGOR_APROVA_OPERATOR_GATEWAY_DRY_RUN"
      - name: Checkout frozen revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Link local security and SaaS dependencies
        run: |
          set -euo pipefail
          node scripts/link-local-dependencies.mjs
      - name: Validate synthetic harness tests
        run: node --test test/operator-gateway-controlled-dry-run.test.mjs
      - name: Execute synthetic controlled dry-run
        env:
          OPERATOR_GATEWAY_DRY_RUN_APPROVAL: ${{ inputs.example }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node scripts/operator-gateway-controlled-dry-run.mjs --output=artifacts/operator-gateway-controlled-dry-run-evidence.json
      - name: Verify sanitized evidence
        run: |
          set -euo pipefail
          node scripts/verify-operator-gateway-controlled-dry-run.mjs artifacts/operator-gateway-controlled-dry-run-evidence.json
          cat artifacts/operator-gateway-controlled-dry-run-evidence.json
