name: Operator Gateway Controlled Activation Dry Run

on:
  workflow_dispatch:
    inputs:
      example:
        description: Authorization phrase for Mercado Pago authenticated read-only test
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mercadopago-authenticated-readonly-probe
  cancel-in-progress: false

jobs:
  controlled-dry-run:
    name: Mercado Pago authenticated read-only credential probe
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 10
    steps:
      - name: Validate explicit authorization
        env:
          APPROVAL: ${{ inputs.example }}
        shell: bash
        run: |
          set -euo pipefail
          test "$APPROVAL" = "AUTORIZO_TESTE_READ_ONLY_MERCADO_PAGO"

      - name: GET users me without revealing account data
        shell: bash
        env:
          MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${MP_ACCESS_TOKEN:-}"
          node --input-type=module <<'NODE'
          const token = process.env.MP_ACCESS_TOKEN;
          const response = await fetch("https://api.mercadolibre.com/users/me", {
            method: "GET",
            headers: {
              accept: "application/json",
              authorization: `Bearer ${token}`,
            },
          });
          if (!response.ok) process.exit(20);
          const payload = await response.json();
          if (payload?.id === undefined || payload?.id === null || String(payload.id).trim() === "") {
            process.exit(21);
          }
          console.log("mercadopago-authenticated-readonly=ok");
          NODE
