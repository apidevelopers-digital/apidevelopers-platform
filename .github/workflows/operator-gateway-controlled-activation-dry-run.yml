name: Operator Gateway Controlled Activation Dry Run

on:
  workflow_dispatch:
    inputs:
      example:
        description: Authorization phrase for encrypted Mercado Pago webhook secret transfer
        required: true
        type: string

permissions:
  contents: read

jobs:
  controlled-dry-run:
    name: Mercado Pago encrypted webhook secret transfer
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 10
    steps:
      - name: Validate explicit authorization
        env:
          APPROVAL: ${{ inputs.example }}
        shell: bash
        run: |
          set -euo pipefail
          test "$APPROVAL" = "AUTORIZO_TRANSFERIR_SECRET_WEBHOOK_MP_TEST_CRIPTOGRAFADO"

      - name: Transfer webhook secret encrypted without revealing it
        env:
          MP_WEBHOOK_SECRET: ${{ secrets.MP_WEBHOOK_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MP_WEBHOOK_SECRET:-}"
          node --input-type=module <<'NODE'
          import { publicEncrypt, constants } from "node:crypto";

          const secret = process.env.MP_WEBHOOK_SECRET;
          if (!secret) process.exit(20);

          const bootstrapUrl = "https://sitedauni.com/v1/financial/webhooks/mercadopago/key-bootstrap.php";
          const importUrl = "https://sitedauni.com/v1/financial/webhooks/mercadopago/key-import.php";

          const bootstrapRes = await fetch(bootstrapUrl, {
            method: "GET",
            headers: { accept: "application/json" },
          });
          if (!bootstrapRes.ok) process.exit(21);
          const bootstrap = await bootstrapRes.json();
          if (!bootstrap?.ok || !bootstrap?.publicKeyB64) process.exit(22);

          const publicKey = Buffer.from(String(bootstrap.publicKeyB64), "base64").toString("utf8");
          const ciphertext = publicEncrypt(
            {
              key: publicKey,
              padding: constants.RSA_PKCS1_OAEP_PADDING,
              oaepHash: "sha1",
            },
            Buffer.from(secret, "utf8"),
          ).toString("base64");

          const importRes = await fetch(importUrl, {
            method: "POST",
            headers: {
              accept: "application/json",
              "content-type": "application/json",
            },
            body: JSON.stringify({ ciphertextB64: ciphertext }),
          });

          const payload = await importRes.json().catch(() => null);
          if (!importRes.ok || !payload?.ok || !payload?.configured) {
            console.error(JSON.stringify({
              ok: false,
              stage: "encrypted_import",
              httpStatus: importRes.status,
              error: payload?.error ?? null,
            }));
            process.exit(23);
          }

          console.log(JSON.stringify({
            ok: true,
            configured: true,
            secretExposed: false,
            fingerprintPrefix: payload.fingerprintPrefix ?? null,
            liveEnabled: false,
          }));
          NODE
