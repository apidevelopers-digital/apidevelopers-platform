name: Operator Gateway Controlled Activation Dry Run

on:
  workflow_dispatch:
    inputs:
      example:
        description: Authorization phrase for Mercado Pago webhook endpoint HMAC test
        required: true
        type: string

permissions:
  contents: read

jobs:
  controlled-dry-run:
    name: Mercado Pago webhook endpoint HMAC test
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 10
    steps:
      - name: Validate explicit authorization
        env:
          APPROVAL: ${{ inputs.example }}
        shell: bash
        run: |
          set -euo pipefail
          test "$APPROVAL" = "AUTORIZO_TESTAR_HMAC_ENDPOINT_MP_TEST"

      - name: Test valid and invalid signatures without billing mutation
        env:
          MP_WEBHOOK_SECRET: ${{ secrets.MP_WEBHOOK_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MP_WEBHOOK_SECRET:-}"
          node --input-type=module <<'NODE'
          import { createHmac } from "node:crypto";

          const endpoint = "https://sitedauni.com/v1/financial/webhooks/mercadopago/br-main/";
          const secret = process.env.MP_WEBHOOK_SECRET;
          const dataId = "test123";
          const requestId = "apd-webhook-hmac-selftest";
          const ts = String(Date.now());
          const manifest = `id:${dataId};request-id:${requestId};ts:${ts};`;
          const v1 = createHmac("sha256", secret).update(manifest).digest("hex");
          const url = `${endpoint}?data.id=${encodeURIComponent(dataId)}`;
          const body = JSON.stringify({
            type: "subscription_preapproval",
            live_mode: false,
            data: { id: dataId },
          });

          const valid = await fetch(url, {
            method: "POST",
            headers: {
              accept: "application/json",
              "content-type": "application/json",
              "x-request-id": requestId,
              "x-signature": `ts=${ts},v1=${v1}`,
            },
            body,
          });
          const validPayload = await valid.json().catch(() => null);
          if (valid.status !== 200 || !validPayload?.ok || validPayload?.signatureVerified !== true || validPayload?.billingMutationExecuted !== false) {
            console.error(JSON.stringify({ ok:false, stage:"valid_signature", httpStatus:valid.status, payload:validPayload }));
            process.exit(20);
          }

          const invalid = await fetch(url, {
            method: "POST",
            headers: {
              accept: "application/json",
              "content-type": "application/json",
              "x-request-id": requestId,
              "x-signature": `ts=${ts},v1=${"0".repeat(64)}`,
            },
            body,
          });
          const invalidPayload = await invalid.json().catch(() => null);
          if (invalid.status !== 401 || invalidPayload?.signatureVerified !== false) {
            console.error(JSON.stringify({ ok:false, stage:"invalid_signature", httpStatus:invalid.status, payload:invalidPayload }));
            process.exit(21);
          }

          console.log(JSON.stringify({
            ok:true,
            validSignatureAccepted:true,
            invalidSignatureRejected:true,
            billingMutationExecuted:false,
            liveEnabled:false,
          }));
          NODE
