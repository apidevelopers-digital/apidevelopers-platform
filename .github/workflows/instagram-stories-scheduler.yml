name: Instagram Stories Scheduler

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Target date in YYYY-MM-DD. Defaults to America/Sao_Paulo today."
        required: false
        type: string
      dry_run:
        description: "Run without publishing to Meta."
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      plan_url:
        description: "Optional scheduler plan URL. Defaults to the approved recurring plan."
        required: false
        type: string
  schedule:
    # 08:30 America/Sao_Paulo = 11:30 UTC during BRT (UTC-3)
    - cron: "30 11 * * *"

permissions:
  contents: write

concurrency:
  group: instagram-stories-scheduler-${{ github.event_name }}-${{ github.event.inputs.target_date || 'scheduled' }}
  cancel-in-progress: false

jobs:
  run-instagram-stories-scheduler:
    name: Run Instagram Stories Scheduler
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 15

    env:
      DEFAULT_PLAN_URL: "https://sitedauni.com/assets/campanhas/_instagram_scheduler/plano_stories_recorrente_20261116_20261122.json"
      LOG_DIR: "artifacts/instagram-stories-scheduler-logs"
      META_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.META_INSTAGRAM_ACCESS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve target date
        id: date
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            TARGET_DATE="${{ github.event.inputs.target_date }}"
          else
            TARGET_DATE="$(TZ=America/Sao_Paulo date +%F)"
          fi
          echo "target_date=$TARGET_DATE" >> "$GITHUB_OUTPUT"
          echo "Target date: $TARGET_DATE"

      - name: Resolve plan URL
        id: plan
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.plan_url }}" ]; then
            PLAN_URL="${{ github.event.inputs.plan_url }}"
          else
            PLAN_URL="$DEFAULT_PLAN_URL"
          fi
          echo "plan_url=$PLAN_URL" >> "$GITHUB_OUTPUT"
          echo "Plan URL: $PLAN_URL"

      - name: Guard approved date window
        shell: bash
        run: |
          TARGET_DATE="${{ steps.date.outputs.target_date }}"
          if [[ "$TARGET_DATE" < "2026-11-16" || "$TARGET_DATE" > "2026-11-22" ]]; then
            echo "Date $TARGET_DATE is outside the approved window 2026-11-16..2026-11-22. Nothing to do."
            exit 0
          fi

      - name: Prepare log directory
        shell: bash
        run: mkdir -p "$LOG_DIR"

      - name: Determine execution mode
        id: mode
        shell: bash
        run: |
          DRY_RUN="${{ github.event.inputs.dry_run }}"
          if [ -z "$DRY_RUN" ]; then
            DRY_RUN="false"
          fi

          if [ "$DRY_RUN" = "false" ]; then
            if [ -z "$META_INSTAGRAM_ACCESS_TOKEN" ]; then
              echo "META_INSTAGRAM_ACCESS_TOKEN secret is missing; refusing real publish."
              exit 1
            fi
            echo "execute=IGOR_APROVA_INSTAGRAM_SCHEDULER_REAL" >> "$GITHUB_OUTPUT"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "execute=" >> "$GITHUB_OUTPUT"
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run scheduler job with captured diagnostics
        id: run_scheduler
        shell: bash
        env:
          INSTAGRAM_SCHEDULER_EXECUTE: ${{ steps.mode.outputs.execute }}
          INSTAGRAM_SCHEDULER_PLAN_URL: ${{ steps.plan.outputs.plan_url }}
          INSTAGRAM_SCHEDULER_DATE: ${{ steps.date.outputs.target_date }}
          INSTAGRAM_SCHEDULER_LOG_DIR: ${{ env.LOG_DIR }}
          META_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.META_INSTAGRAM_ACCESS_TOKEN }}
        run: |
          set +e
          echo "Running scheduler. dry_run=${{ steps.mode.outputs.dry_run }} target_date=$INSTAGRAM_SCHEDULER_DATE"
          echo "Plan URL: $INSTAGRAM_SCHEDULER_PLAN_URL"

          node apps/api-gateway/src/instagram-stories-scheduler-job.mjs \
            --plan-url="$INSTAGRAM_SCHEDULER_PLAN_URL" \
            --date="$INSTAGRAM_SCHEDULER_DATE" \
            --log-dir="$INSTAGRAM_SCHEDULER_LOG_DIR" \
            2>&1 | tee "$INSTAGRAM_SCHEDULER_LOG_DIR/runner-output.log"

          EXIT_CODE=${PIPESTATUS[0]}

          {
            echo "## Instagram Stories Scheduler diagnostics"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| target_date | \`$INSTAGRAM_SCHEDULER_DATE\` |"
            echo "| dry_run | \`${{ steps.mode.outputs.dry_run }}\` |"
            echo "| exit_code | \`$EXIT_CODE\` |"
            echo "| plan_url | \`$INSTAGRAM_SCHEDULER_PLAN_URL\` |"
            echo ""
            echo "### Last scheduler output"
            echo '```'
            tail -n 120 "$INSTAGRAM_SCHEDULER_LOG_DIR/runner-output.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit "$EXIT_CODE"

      - name: Persist sanitized diagnostics to repository branch
        if: always()
        shell: bash
        env:
          TARGET_DATE: ${{ steps.date.outputs.target_date }}
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
          PLAN_URL: ${{ steps.plan.outputs.plan_url }}
          EXIT_CODE: ${{ steps.run_scheduler.outputs.exit_code }}
          DIAG_BRANCH: diagnostics/instagram-scheduler
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW: ${{ github.workflow }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set +e
          mkdir -p /tmp/instagram-scheduler-diagnostics
          python3 - <<'PY'
          import json, os, re, pathlib, datetime

          log_dir = pathlib.Path(os.environ.get("LOG_DIR", "artifacts/instagram-stories-scheduler-logs"))
          log_path = log_dir / "runner-output.log"
          raw = log_path.read_text(errors="replace") if log_path.exists() else ""

          redactions = [
              (r'(?i)(access_token["=:\s]+)[^"\s&]+', r'\1[REDACTED]'),
              (r'(?i)(bearer\s+)[A-Za-z0-9._\-]+', r'\1[REDACTED]'),
              (r'(?i)(token["=:\s]+)[^"\s&]+', r'\1[REDACTED]'),
          ]
          safe = raw
          for pattern, repl in redactions:
              safe = re.sub(pattern, repl, safe)

          tail = "\n".join(safe.splitlines()[-160:])
          payload = {
              "generated_at": datetime.datetime.utcnow().isoformat(timespec="seconds") + "Z",
              "workflow": os.environ.get("WORKFLOW"),
              "run_id": os.environ.get("RUN_ID"),
              "run_number": os.environ.get("RUN_NUMBER"),
              "run_attempt": os.environ.get("RUN_ATTEMPT"),
              "commit_sha": os.environ.get("COMMIT_SHA"),
              "target_date": os.environ.get("TARGET_DATE"),
              "dry_run": os.environ.get("DRY_RUN"),
              "plan_url": os.environ.get("PLAN_URL"),
              "exit_code": os.environ.get("EXIT_CODE"),
              "log_tail": tail,
          }
          out = pathlib.Path("/tmp/instagram-scheduler-diagnostics")
          out.mkdir(parents=True, exist_ok=True)
          (out / "latest.json").write_text(json.dumps(payload, indent=2, ensure_ascii=False), encoding="utf-8")
          (out / "latest.log").write_text(tail, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "$DIAG_BRANCH" || true
          if git show-ref --verify --quiet "refs/remotes/origin/$DIAG_BRANCH"; then
            git checkout -B "$DIAG_BRANCH" "origin/$DIAG_BRANCH"
          else
            git checkout --orphan "$DIAG_BRANCH"
            git rm -rf . || true
          fi

          mkdir -p diagnostics/instagram-scheduler
          cp /tmp/instagram-scheduler-diagnostics/latest.json diagnostics/instagram-scheduler/latest.json
          cp /tmp/instagram-scheduler-diagnostics/latest.log diagnostics/instagram-scheduler/latest.log

          git add diagnostics/instagram-scheduler/latest.json diagnostics/instagram-scheduler/latest.log
          git commit -m "chore(instagram): update scheduler diagnostics [skip ci]" || true
          git push origin "HEAD:$DIAG_BRANCH" || true

      - name: Upload scheduler logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instagram-stories-scheduler-${{ steps.date.outputs.target_date }}
          path: artifacts/instagram-stories-scheduler-logs
          if-no-files-found: warn
