name: Tenancy CI

on:
  push:
    branches:
      - main
      - "foundation/**"
    paths:
      - "packages/tenancy/**"
      - "packages/contracts/**"
      - ".github/workflows/tenancy-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare contracts
        run: |
          rm -rf node_modules/@apidevelopers/contracts
          mkdir -p node_modules/@apidevelopers
          ln -s "$GITHUB_WORKSPACE/packages/contracts" node_modules/@apidevelopers/contracts
      - name: Check tenancy syntax
        run: |
          node --check packages/tenancy/src/index.mjs
          node --check packages/tenancy/test/index.test.mjs
      - name: Test tenancy
        run: npm --prefix packages/tenancy test
