name: Tenancy CI

on:
  push:
    branches:
      - main
      - "foundation/**"
    paths:
      - "packages/tenancy/**"
      - "packages/contracts/**"
      - ".github/workflows/tenancy-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check tenancy syntax
        run: node --check packages/tenancy/src/index.mjs
