name: Kernel Vertical Lifecycle CI

on:
  pull_request:
    paths:
      - "tests/kernel-vertical/**"
      - "packages/contracts/**"
      - "packages/kernel-memory/**"
      - "packages/kernel-reasoning/**"
      - "packages/kernel-reflection/**"
      - "packages/kernel-planning/**"
      - "packages/kernel-decision/**"
      - "packages/kernel-policy/**"
      - "packages/kernel-runtime/**"
      - "packages/kernel-evidence/**"
      - "packages/kernel-audit/**"
      - "packages/kernel-evolution/**"
      - ".github/workflows/kernel-vertical-lifecycle-ci.yml"
  push:
    branches: [main]
    paths:
      - "tests/kernel-vertical/**"
      - "packages/contracts/**"
      - "packages/kernel-memory/**"
      - "packages/kernel-reasoning/**"
      - "packages/kernel-reflection/**"
      - "packages/kernel-planning/**"
      - "packages/kernel-decision/**"
      - "packages/kernel-policy/**"
      - "packages/kernel-runtime/**"
      - "packages/kernel-evidence/**"
      - "packages/kernel-audit/**"
      - "packages/kernel-evolution/**"
      - ".github/workflows/kernel-vertical-lifecycle-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-vertical-lifecycle-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vertical:
    name: Kernel vertical lifecycle gate
    runs-on:
      group: organization-macos-ci
      labels: [self-hosted, macOS, X64]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate changed component packages
        shell: bash
        run: |
          set -euo pipefail
          for package in \
            contracts \
            kernel-decision \
            kernel-runtime; do
            echo "validating packages/$package"
            (
              cd "packages/$package"
              npm install --ignore-scripts --no-audit --no-fund
              npm run check
            )
          done
      - name: Install vertical validation dependencies
        working-directory: tests/kernel-vertical
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run governed vertical lifecycle
        working-directory: tests/kernel-vertical
        shell: bash
        run: |
          set -uo pipefail
          set +e
          npm run check 2>&1 | tee kernel-vertical-lifecycle.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]]; then
            diagnostic=$(grep -E "VERTICAL_STAGE_FAILURE|not ok|Error:|ERR_|Expected values|actual:|expected:" kernel-vertical-lifecycle.log | tail -n 20 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            if [[ -z "$diagnostic" ]]; then
              diagnostic="vertical lifecycle failed without a matched diagnostic; inspect the test log"
            fi
            echo "::error title=Kernel vertical lifecycle failure::$diagnostic"
            tail -n 80 kernel-vertical-lifecycle.log
            exit "$status"
          fi
          grep -Fq "KERNEL_VERTICAL_LIFECYCLE_GATE_OK" kernel-vertical-lifecycle.log
