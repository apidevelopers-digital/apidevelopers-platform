name: Runtime Evidence Contract CI 

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "foundation/**"
    paths:
      - "packages/contracts/**"
      - ".github/workflows/runtime-evidence-contract-ci.yml"
  pull_request:
    paths:
      - "packages/contracts/**"
      - ".github/workflows/runtime-evidence-contract-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check runtime evidence contract
        run: node --check packages/contracts/src/runtime-evidence.mjs
      - name: Test cross-tenant rejection
        run: node --test --test-name-pattern="rejects a runtime report" packages/contracts/test/runtime-evidence.test.mjs
