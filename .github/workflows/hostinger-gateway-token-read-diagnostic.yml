name: Hostinger Gateway Token Read Diagnostic

on:
  workflow_dispatch:
    inputs:
      example:
        description: "Exact diagnostic token"
        required: true
        type: string

permissions:
  contents: read

jobs:
  probe:
    if: github.ref == 'refs/heads/main' && github.event.inputs.example == 'IGOR_DIAG_HOSTINGER_GATEWAY_20260814'
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 10
    env:
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
      HOSTINGER_USERNAME: u242521810
      HOSTINGER_DOMAIN: gateway.apidevelopers.digital
    outputs:
      status: ${{ steps.http.outputs.status }}
    steps:
      - name: Confirm credential presence
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HOSTINGER_API_TOKEN:-}"

      - id: http
        name: Probe Node builds read endpoint
        shell: bash
        run: |
          set -euo pipefail
          url="https://developers.hostinger.com/api/hosting/v1/accounts/${HOSTINGER_USERNAME}/websites/${HOSTINGER_DOMAIN}/nodejs/builds?page=1&per_page=5"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request GET \
            --header 'Accept: application/json' \
            --header "Authorization: Bearer ${HOSTINGER_API_TOKEN}" \
            --header 'User-Agent: apidevelopers-platform/hostinger-token-diagnostic' \
            "$url")"
          case "$status" in
            200|401|403) ;;
            *) status="other" ;;
          esac
          echo "status=$status" >> "$GITHUB_OUTPUT"

  read-200:
    needs: probe
    if: needs.probe.outputs.status == '200'
    runs-on:
      - self-hosted
      - macOS
      - X64
    steps:
      - run: echo "HOSTINGER_GATEWAY_TOKEN_READ_200"

  read-401:
    needs: probe
    if: needs.probe.outputs.status == '401'
    runs-on:
      - self-hosted
      - macOS
      - X64
    steps:
      - run: echo "HOSTINGER_GATEWAY_TOKEN_READ_401"

  read-403:
    needs: probe
    if: needs.probe.outputs.status == '403'
    runs-on:
      - self-hosted
      - macOS
      - X64
    steps:
      - run: echo "HOSTINGER_GATEWAY_TOKEN_READ_403"

  read-other:
    needs: probe
    if: needs.probe.outputs.status == 'other'
    runs-on:
      - self-hosted
      - macOS
      - X64
    steps:
      - run: echo "HOSTINGER_GATEWAY_TOKEN_READ_OTHER"
