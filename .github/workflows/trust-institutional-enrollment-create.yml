name: Trust Institutional Enrollment Create
on:
  workflow_dispatch:
    inputs:
      approval:
        description: "Exact governed approval token"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: trust-institutional-enrollment-create
  cancel-in-progress: false
jobs:
  enroll:
    if: github.ref == 'refs/heads/main' && github.event.inputs.approval == 'IGOR_APROVA_TRUST_INSTITUTIONAL_ENROLLMENT_CREATE'
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 10
    env:
      API_GATEWAY_ADMIN_KEY: ${{ secrets.API_GATEWAY_ADMIN_KEY }}
      TRUST_INSTITUTIONAL_PRIVATE_KEY_PEM: ${{ secrets.TRUST_INSTITUTIONAL_PRIVATE_KEY_PEM }}
      GATEWAY: https://gateway.apidevelopers.digital
      ORGANIZATION_ID: component.organization.apidevelopers-digital
    steps:
      - name: Validate governed prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test -n "${API_GATEWAY_ADMIN_KEY:-}" || { echo "::error title=Credential unavailable::API_GATEWAY_ADMIN_KEY is not configured"; exit 2; }
          test -n "${TRUST_INSTITUTIONAL_PRIVATE_KEY_PEM:-}" || { echo "::error title=Institutional key unavailable::TRUST_INSTITUTIONAL_PRIVATE_KEY_PEM is not configured"; exit 3; }
      - name: Create or confirm institutional enrollment
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const {constants,createPrivateKey,createPublicKey,sign}=await import("node:crypto");
          const {appendFileSync}=await import("node:fs");
          const gateway=process.env.GATEWAY,organizationId=process.env.ORGANIZATION_ID,adminKey=process.env.API_GATEWAY_ADMIN_KEY,privateKeyPem=process.env.TRUST_INSTITUTIONAL_PRIVATE_KEY_PEM;
          async function request(path,{method="GET",body}={}){const r=await fetch(`${gateway}${path}`,{method,headers:{accept:"application/json","content-type":"application/json","x-api-key":adminKey},...(body===undefined?{}:{body:JSON.stringify(body)})});const t=await r.text();let p={};try{p=t?JSON.parse(t):{}}catch{throw new Error(`non-json response from ${path}`)}if(!r.ok)throw new Error(`${path} failed with HTTP ${r.status}: ${p.reason??"unknown"}`);return p}
          const readinessPath="/v1/trust/evaluation/operator/institutional-enrollment";
          const before=await request(readinessPath);
          if(before?.institution?.organizationId!==organizationId)throw new Error("unexpected institutional organizationId");
          if(before?.enrollment?.enrollmentPresent===true){console.log(JSON.stringify({organizationId,enrollmentPresent:true,status:String(before.enrollment.status??""),recipientKeyFingerprint:String(before.enrollment.recipientKeyFingerprint??""),keyPossessionVerified:before.enrollment.keyPossessionVerified===true,created:false}));process.exit(0)}
          const privateKey=createPrivateKey(privateKeyPem);
          if(privateKey.asymmetricKeyType!=="rsa"||Number(privateKey.asymmetricKeyDetails?.modulusLength??0)<2048)throw new Error("institutional private key must be RSA >= 2048 bits");
          const recipientPublicKey=createPublicKey(privateKey).export({type:"spki",format:"pem"}).toString();
