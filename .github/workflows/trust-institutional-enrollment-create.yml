name: Trust Institutional Enrollment Create

on:
  workflow_dispatch:
    inputs:
      approval:
        description: "Exact governed approval token"
        required: true
        type: string
  repository_dispatch:
    types:
      - trust_institutional_enrollment_create_approved

permissions:
  contents: read

concurrency:
  group: trust-institutional-enrollment-create
  cancel-in-progress: false

jobs:
  enroll:
    if: >
      github.ref == 'refs/heads/main' &&
      (
        (github.event_name == 'workflow_dispatch' &&
         github.event.inputs.approval == 'IGOR_APROVA_TRUST_INSTITUTIONAL_ENROLLMENT_CREATE') ||
        github.event_name == 'repository_dispatch'
      )
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 10
    env:
      API_GATEWAY_ADMIN_KEY: ${{ secrets.API_GATEWAY_ADMIN_KEY }}
      TRUST_INSTITUTIONAL_PRIVATE_KEY_PEM: ${{ secrets.TRUST_INSTITUTIONAL_PRIVATE_KEY_PEM }}
      GATEWAY: https://gateway.apidevelopers.digital
      ORGANIZATION_ID: component.organization.apidevelopers-digital
    steps:
      - uses: actions/checkout@v4
      - name: Validate governed prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test -n "${API_GATEWAY_ADMIN_KEY:-}"
          test -n "${TRUST_INSTITUTIONAL_PRIVATE_KEY_PEM:-}"
      - name: Create or confirm institutional enrollment
        shell: bash
        run: node scripts/trust-institutional-enrollment-create.mjs
