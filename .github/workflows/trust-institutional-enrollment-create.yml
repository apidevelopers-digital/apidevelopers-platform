name: Trust Institutional Enrollment Create

on:
  workflow_dispatch:
    inputs:
      approval:
        description: "Exact governed approval token"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: trust-institutional-enrollment-create
  cancel-in-progress: false

jobs:
  enroll:
    if: github.ref == 'refs/heads/main' && github.event.inputs.approval == 'IGOR_APROVA_TRUST_INSTITUTIONAL_ENROLLMENT_CREATE'
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 10
    env:
      API_GATEWAY_ADMIN_KEY: ${{ secrets.API_GATEWAY_ADMIN_KEY }}
      TRUST_INSTITUTIONAL_PRIVATE_KEY_PEM: ${{ secrets.TRUST_INSTITUTIONAL_PRIVATE_KEY_PEM }}
      GATEWAY: https://gateway.apidevelopers.digital
      ORGANIZATION_ID: component.organization.apidevelopers-digital
    steps:
      - name: Validate governed prerequisites
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${API_GATEWAY_ADMIN_KEY:-}" ]]; then
            echo "::error title=Credential unavailable::API_GATEWAY_ADMIN_KEY is not configured"
            exit 2
          fi
          if [[ -z "${TRUST_INSTITUTIONAL_PRIVATE_KEY_PEM:-}" ]]; then
            echo "::error title=Institutional key unavailable::TRUST_INSTITUTIONAL_PRIVATE_KEY_PEM is not configured"
            exit 3
          fi

      - name: Create or confirm institutional enrollment
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const {
            constants,
            createPrivateKey,
            createPublicKey,
            sign,
          } = require("node:crypto");

          const gateway = process.env.GATEWAY;
          const organizationId = process.env.ORGANIZATION_ID;
          const adminKey = process.env.API_GATEWAY_ADMIN_KEY;
          const privateKeyPem = process.env.TRUST_INSTITUTIONAL_PRIVATE_KEY_PEM;

          async function request(path, { method = "GET", body } = {}) {
            const response = await fetch(`${gateway}${path}`, {
              method,
              headers: {
                accept: "application/json",
                "content-type": "application/json",
                "x-api-key": adminKey,
              },
              ...(body === undefined ? {} : { body: JSON.stringify(body) }),
            });
            const text = await response.text();
            let payload = {};
            try {
              payload = text ? JSON.parse(text) : {};
            } catch {
              throw new Error(`non-json response from ${path}`);
            }
            if (!response.ok) {
              throw new Error(`${path} failed with HTTP ${response.status}: ${payload.reason ?? "unknown"}`);
            }
            return payload;
          }

          const readinessPath =
            "/v1/trust/evaluation/operator/institutional-enrollment";
          const before = await request(readinessPath);
          if (before?.institution?.organizationId !== organizationId) {
            throw new Error("unexpected institutional organizationId");
          }
          if (before?.enrollment?.enrollmentPresent === true) {
            const safe = {
              organizationId,
              enrollmentPresent: true,
              status: String(before.enrollment.status ?? ""),
              recipientKeyFingerprint: String(
                before.enrollment.recipientKeyFingerprint ?? "",
              ),
              keyPossessionVerified:
                before.enrollment.keyPossessionVerified === true,
              created: false,
            };
            console.log(JSON.stringify(safe));
            process.exit(0);
          }

          const privateKey = createPrivateKey(privateKeyPem);
          if (privateKey.asymmetricKeyType !== "rsa") {
            throw new Error("institutional private key must be RSA");
          }
          const modulusLength = Number(
            privateKey.asymmetricKeyDetails?.modulusLength ?? 0,
          );
          if (modulusLength < 2048) {
            throw new Error("institutional RSA key must be at least 2048 bits");
          }
          const recipientPublicKey = createPublicKey(privateKey)
            .export({ type: "spki", format: "pem" })
            .toString();

          const challengeResponse = await request(
            `${readinessPath}/challenge`,
            {
              method: "POST",
              body: {
                recipientPublicKey,
                correlationId: `trust-preview-face-${Date.now()}`,
              },
            },
          );
          if (challengeResponse.organizationId !== organizationId) {
            throw new Error("challenge organization mismatch");
          }
          const challenge = challengeResponse.challenge;
          if (
            !challenge?.challengeId ||
            !challenge?.signingPayloadB64u
          ) {
            throw new Error("challenge response is incomplete");
          }

          const signature = sign(
            "sha256",
            Buffer.from(challenge.signingPayloadB64u, "base64url"),
            {
              key: privateKey,
              padding: constants.RSA_PKCS1_PSS_PADDING,
              saltLength: 32,
            },
          );

          const proofResponse = await request(`${readinessPath}/proof`, {
            method: "POST",
            body: {
              challengeId: challenge.challengeId,
              recipientPublicKey,
              signatureB64u: signature.toString("base64url"),
            },
          });
          if (proofResponse?.proof?.keyPossessionVerified !== true) {
            throw new Error("key possession proof was not verified");
          }

          const approvedAt = new Date(Date.now() - 1000).toISOString();
          const enrollmentResponse = await request(readinessPath, {
            method: "POST",
            body: {
              recipientPublicKey,
              keyProofChallengeId: challenge.challengeId,
              institutionalApproval: {
                decision: "approved",
                assertion: "organization_and_recipient_authorized",
                reference:
                  "trust-preview-face-institutional-enrollment-2026-08-27",
                authority: "API Developers.digital",
                approvedBy: "igor",
                approvedAt,
                subjectOrganizationId: organizationId,
              },
            },
          });
          if (
            enrollmentResponse?.enrollment?.status !== "approved" ||
            enrollmentResponse?.organizationId !== organizationId
          ) {
            throw new Error("institutional enrollment was not approved");
          }

          const after = await request(readinessPath);
          const safe = {
            organizationId,
            enrollmentPresent:
              after?.enrollment?.enrollmentPresent === true,
            status: String(after?.enrollment?.status ?? ""),
            recipientKeyFingerprint: String(
              after?.enrollment?.recipientKeyFingerprint ?? "",
            ),
            keyPossessionVerified:
              after?.enrollment?.keyPossessionVerified === true,
            identityVerifiedByThisService:
              after?.enrollment?.identityVerifiedByThisService === true,
            secretsIncluded: after?.secretsIncluded === true,
            privateKeyIncluded: after?.privateKeyIncluded === true,
            created: enrollmentResponse?.enrollment?.created === true,
          };
          if (
            !safe.enrollmentPresent ||
            safe.status !== "approved" ||
            !safe.keyPossessionVerified ||
            safe.secretsIncluded ||
            safe.privateKeyIncluded
          ) {
            throw new Error("post-enrollment readiness verification failed");
          }

          console.log(JSON.stringify(safe));
          const lines = [
            "### Trust institutional enrollment",
            "",
            `- organizationId: \`${safe.organizationId}\``,
            `- enrollmentPresent: \`${safe.enrollmentPresent}\``,
            `- status: \`${safe.status}\``,
            `- recipientKeyFingerprint: \`${safe.recipientKeyFingerprint}\``,
            `- keyPossessionVerified: \`${safe.keyPossessionVerified}\``,
            `- privateKeyIncluded: \`${safe.privateKeyIncluded}\``,
          ];
          require("node:fs").appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            `${lines.join("\n")}\n`,
          );
          NODE
