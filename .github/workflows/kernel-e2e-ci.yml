name: Kernel E2E CI

on:
  workflow_dispatch:
  push:
    paths:
      - "tests/integration/kernel-e2e.test.mjs"
      - "packages/kernel-decision/**"
      - "packages/kernel-runtime/**"
      - "packages/kernel-evidence/**"
      - "packages/kernel-audit/**"
      - ".github/workflows/kernel-e2e-ci.yml"
  pull_request:
    paths:
      - "tests/integration/kernel-e2e.test.mjs"
      - "packages/kernel-decision/**"
      - "packages/kernel-runtime/**"
      - "packages/kernel-evidence/**"
      - "packages/kernel-audit/**"
      - ".github/workflows/kernel-e2e-ci.yml"

jobs:
  kernel-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: nod --check tests/integration/kernel-e2e.test.mjs
      - name: Run governed kernel E2E test
        run: node --test tests/integration/kernel-e2e.test.mjs
