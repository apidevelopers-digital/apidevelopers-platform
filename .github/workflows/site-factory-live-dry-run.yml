name: Site Factory Public Probe

on:
  push:
    branches:
      - main
      - "feat/site-factory-*"
      - "ops/site-factory-*"
    paths:
      - "apps/site-factory/**"
      - "packages/hostinger-adapter/**"
      - "packages/uni-operator-hostinger-adapter/**"
      - "packages/wordpress-adapter/**"
      - ".github/workflows/site-factory-live-dry-run.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-probe:
    runs-on:
      group: organization-macos-ci
      labels: [self-hosted, macOS, X64]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test read-only adapters
        run: |
          npm run check --prefix packages/hostinger-adapter
          npm run check --prefix packages/uni-operator-hostinger-adapter
          npm run check --prefix packages/wordpress-adapter

      - name: Install local Site Factory dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --prefix apps/site-factory

      - name: Validate Site Factory
        run: npm run check --prefix apps/site-factory

      - name: Probe public WordPress REST API
        run: |
          node apps/site-factory/src/cli.mjs \
            --manifest apps/site-factory/manifests/apidevelopers-institution.json \
            --public-only \
            --output "$RUNNER_TEMP/site-factory-public.json"

      - name: Upload redacted public report
        uses: actions/upload-artifact@v4
        with:
          name: site-factory-public-${{ github.sha }}
          path: ${{ runner.temp }}/site-factory-public.json
          if-no-files-found: error
          retention-days: 7
