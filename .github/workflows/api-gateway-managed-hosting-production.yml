name: API Gateway Managed Hosting Git Production Preflight

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: "Exact main SHA to validate"
        required: true
        type: string
      expected_runtime_sha:
        description: "Exact runtime branch SHA to validate"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: api-gateway-managed-hosting-git-production-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 20
    env:
      RUNTIME_BRANCH: deploy/hostinger-gateway-runtime
      PRODUCTION_READY_URL: "https://gateway.apidevelopers.digital/ready"
    steps:
      - name: Validate dispatch target
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "${{ inputs.expected_main_sha }}"
          test -n "${{ inputs.expected_runtime_sha }}"
          test "${{ inputs.expected_main_sha }}" = "$GITHUB_SHA"
      - name: Checkout exact main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_main_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build and verify managed runtime artifact
        shell: bash
        run: |
          set -euo pipefail
          node apps/api-gateway/scripts/build-managed-hosting-artifact-with-lex.mjs
          node apps/api-gateway/scripts/apply-hostinger-fixed-entry-compat.mjs
          node apps/api-gateway/scripts/verify-managed-hosting-artifact.mjs
          artifact="apps/api-gateway/dist/api-gateway-managed"
          test -f "$artifact/package.json"
          test -f "$artifact/src/operational-server.mjs"
          test -f "$artifact/src/hostinger-entry.mjs"
          test -f "$artifact/release-manifest.json"
      - name: Verify published runtime branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/$RUNTIME_BRANCH:refs/remotes/origin/$RUNTIME_BRANCH"
          runtime_sha="$(git rev-parse "refs/remotes/origin/$RUNTIME_BRANCH")"
          test "$runtime_sha" = "${{ inputs.expected_runtime_sha }}"
          source_sha="$(git show "refs/remotes/origin/$RUNTIME_BRANCH:SOURCE_SHA" | tr -d '\r\n')"
          test "$source_sha" = "${{ inputs.expected_main_sha }}"
          git cat-file -e "refs/remotes/origin/$RUNTIME_BRANCH:package.json"
          git cat-file -e "refs/remotes/origin/$RUNTIME_BRANCH:src/operational-server.mjs"
          git cat-file -e "refs/remotes/origin/$RUNTIME_BRANCH:src/hostinger-entry.mjs"
          echo "Runtime branch is pinned to source $source_sha at $runtime_sha."
      - name: Verify public production readiness
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --max-time 20 "$PRODUCTION_READY_URL")"
          READY_JSON="$response" node -e 'const p=JSON.parse(process.env.READY_JSON); const c=(p.checks||[]).find(x=>x&&x.name==="persistence"); if(p.service!=="api-gateway"||p.status!=="ready"||!c||c.critical!==true||c.status!=="ok"||c.code!=="readable"){process.exit(1)}'
          echo "Production readiness is ready with critical persistence ok/readable."
      - name: Confirm preflight-only behavior
        shell: bash
        run: |
          set -euo pipefail
          echo "Preflight completed."
          echo "No Hostinger mutation, archive upload, DNS change, domain change, or Trust activation is performed."
          echo "Production deploy is performed by Hostinger Git integration from $RUNTIME_BRANCH."
