name: API Gateway Managed Hosting Production

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preflight or apply"
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - apply
      expected_sha:
        description: "Exact commit SHA to validate/deploy"
        required: true
        type: string
      approval:
        description: "Apply only: IGOR_APROVA_API_GATEWAY_PRODUCTION_DEPLOY"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: api-gateway-managed-hosting-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 30
    env:
      HOSTINGER_USERNAME: ${{ vars.HOSTINGER_USERNAME }}
      HOSTINGER_DOMAIN: ${{ vars.API_GATEWAY_PRODUCTION_DOMAIN }}
      API_GATEWAY_RUNTIME_READY: ${{ vars.API_GATEWAY_RUNTIME_READY }}
    steps:
      - name: Validate fail-closed deploy inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ inputs.expected_sha }}"
          test "${{ inputs.expected_sha }}" = "${{ github.sha }}"
          test -n "$HOSTINGER_USERNAME"
          test -n "$HOSTINGER_DOMAIN"
          test "$API_GATEWAY_RUNTIME_READY" = "true"
          if [[ "${{ inputs.mode }}" == "apply" ]]; then
            test "${{ inputs.approval }}" = "IGOR_APROVA_API_GATEWAY_PRODUCTION_DEPLOY"
          fi

      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build and verify managed artifact
        shell: bash
        run: |
          set -euo pipefail
          node apps/api-gateway/scripts/build-managed-hosting-artifact.mjs
          node apps/api-gateway/scripts/verify-managed-hosting-artifact.mjs
          artifact="apps/api-gateway/dist/api-gateway-managed"
          test -f "$artifact/release-manifest.json"
           zip -q -r "$RUNNER_TEMP/api-gateway-${{`inputs.expected_sha`}}.zip" "$artifact"
          echo "ARCHIVE_PATH=$RUNNER_TEMP/api-gateway-${{`inputs.expected_sha``}}.zip" >> "$GITHUB_ENV"

      - name: Preflight or apply Hostinger Node build
        id: hostinger
        continue-on-error: true
        env:
          HOSTINGER_API_TOKEN: ${{ inputs.mode == 'apply' && secrets.HOSTINGER_API_TOKEN || '' }}
        shell: bash
        run: |
          set -euo pipefail
          node apps/site-factory/src/run-hostinger-node-build-api-only.mjs \
            --mode "${{ inputs.mode }}" \
            --username "$HOSTINGER_USERNAME" \
            --domain "$HOSTINGER_DOMAIN" \
            --archive "$ARCHIVE_PATH \ 
            --transport multipart \
            --node-version 22 \
            --app-type express \
            --entry-file src/operational-server.mjs \
            --package-manager npm \
            --expected-text 'api_gateway_operational_started' \
            --evidence "$RUNNER_TEMP/api-gateway-hostinger-evidence.json"

      - name: Enforce executor result
        if: ${{ steps.hostinger.outcome != 'success' }}
        shell: bash
        run: |
          echo "Hostinger API Gateway preflight/deploy did not complete successfully." >&2
          exit 1
