name: API Gateway Managed Hosting Production

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preflight or apply"
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - apply
      expected_sha:
        description: "Exact commit SHA to validate/deploy"
        required: true
        type: string
      approval:
        description: "Apply only: IGOR_APROVA_API_GATEWAY_PRODUCTION_DEPLOY"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: api-gateway-managed-hosting-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 30
    env:
      # Canonical production target. GitHub repository variables may override
      # these non-secret defaults, but the guardrail below still pins the target.
      HOSTINGER_USERNAME: ${{ vars.HOSTINGER_USERNAME || 'u242521810' }}
      HOSTINGER_DOMAIN: ${{ vars.API_GATEWAY_PRODUCTION_DOMAIN || 'gateway.apidevelopers.digital' }}
      API_GATEWAY_RUNTIME_READY: ${{ vars.API_GATEWAY_RUNTIME_READY }}
    steps:
      - name: Validate exact SHA
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ inputs.expected_sha }}"
          test "${{ inputs.expected_sha }}" = "${{ github.sha }}"

      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build and verify managed artifact
        shell: bash
        run: |
          set -euo pipefail
          node apps/api-gateway/scripts/build-managed-hosting-artifact.mjs
          node apps/api-gateway/scripts/verify-managed-hosting-artifact.mjs
          artifact="apps/api-gateway/dist/api-gateway-managed"
          test -f "$artifact/release-manifest.json"
          archive="$RUNNER_TEMP/api-gateway-${{ inputs.expected_sha }}.zip"
          (
            cd "$artifact"
            zip -q -r "$archive" .
          )
          test -s "$archive"
          echo "ARCHIVE_PATH=$archive" >> "$GITHUB_ENV"

      - name: Validate production target guardrails
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$HOSTINGER_USERNAME" ]]; then
            echo "::error title=Missing Hostinger username::HOSTINGER_USERNAME resolved empty." >&2
            exit 1
          fi
          if [[ -z "$HOSTINGER_DOMAIN" ]]; then
            echo "::error title=Missing API Gateway domain::HOSTINGER_DOMAIN resolved empty." >&2
            exit 1
          fi
          if [[ "$HOSTINGER_USERNAME" != "u242521810" ]]; then
            echo "::error title=Unexpected Hostinger username::Resolved target does not match the verified production account." >&2
            exit 1
          fi
          if [[ "$HOSTINGER_DOMAIN" != "gateway.apidevelopers.digital" ]]; then
            echo "::error title=Unexpected API Gateway domain::Resolved target does not match gateway.apidevelopers.digital." >&2
            exit 1
          fi

          if [[ "${{ inputs.mode }}" == "apply" ]]; then
            if [[ "$API_GATEWAY_RUNTIME_READY" != "true" ]]; then
              echo "::error title=Runtime not approved::API_GATEWAY_RUNTIME_READY must equal true for apply." >&2
              exit 1
            fi
            if [[ "${{ inputs.approval }}" != "IGOR_APROVA_API_GATEWAY_PRODUCTION_DEPLOY" ]]; then
              echo "::error title=Missing explicit approval::Apply requires the exact production deployment approval token." >&2
              exit 1
            fi
          else
            echo "Preflight guardrails validated against canonical production target without enabling the production runtime."
          fi

      - name: Preflight or apply Hostinger Node build
        id: hostinger
        continue-on-error: true
        env:
          HOSTINGER_API_TOKEN: ${{ inputs.mode == 'apply' && secrets.HOSTINGER_API_TOKEN || '' }}
        shell: bash
        run: |
          set -euo pipefail
          node apps/site-factory/src/run-hostinger-node-build-api-only.mjs \
            --mode "${{ inputs.mode }}" \
            --username "$HOSTINGER_USERNAME" \
            --domain "$HOSTINGER_DOMAIN" \
            --archive "$ARCHIVE_PATH" \
            --transport multipart \
            --node-version 22 \
            --app-type express \
            --entry-file src/operational-server.mjs \
            --package-manager npm \
            --expected-text 'api_gateway_operational_started' \
            --evidence "$RUNNER_TEMP/api-gateway-hostinger-evidence.json"

      - name: Surface sanitized Hostinger evidence
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/api-gateway-hostinger-evidence.json"
          if [[ ! -f "$evidence" ]]; then
            echo "::error title=Missing Hostinger evidence::Executor did not create the sanitized evidence file at the expected path."
            exit 0
          fi

          node - "$evidence" <<'NODE'
          const fs = require("node:fs");
          const path = process.argv[2];
          const evidence = JSON.parse(fs.readFileSync(path, "utf8"));
          const compact = {
            mode: evidence.mode ?? null,
            status: evidence.status ?? null,
            writeExecuted: evidence.writeExecuted ?? null,
            target: evidence.target ?? null,
            request: evidence.request ?? null,
            error: evidence.error ?? null,
          };
          console.log(JSON.stringify(compact, null, 2));

          const message = evidence?.error?.message;
          if (message) {
            const safe = String(message).replace(/[%\r\n]/g, " ").slice(0, 800);
            console.log(`::error title=Hostinger executor preflight::${safe}`);
          }
          NODE

      - name: Enforce executor result
        if: ${{ steps.hostinger.outcome != 'success' }}
        shell: bash
        run: |
          echo "Hostinger API Gateway preflight/deploy did not complete successfully." >&2
          exit 1
