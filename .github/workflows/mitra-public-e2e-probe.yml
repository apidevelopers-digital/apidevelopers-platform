name: UniJuri Production Fail-Closed Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 3
    env:
      API_GATEWAY_ADMIN_KEY: ${{ secrets.API_GATEWAY_ADMIN_KEY }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify UniJuri bootstrap is fail-closed
        shell: bash
        run: |
          set -euo pipefail
          test -n "${API_GATEWAY_ADMIN_KEY:-}"
          node --input-type=module <<'NODE'
          const url = "https://gateway.apidevelopers.digital/v1/saas/uni-juri/bootstrap";
          const payload = {
            approval: "IGOR_APROVA_UNIJURI_BOOTSTRAP_V1",
            input: {
              tenantSlug: "uni",
              workspaceSlug: "uni-juri-main",
              displayName: "UNI",
              planId: "internal",
              subjectRef: "e65b5439faf65ea9905025751e6a33010df6551d99b225bf032e163492969ec8",
              idempotencyKey: "unijuri-bootstrap-prod-20260913-v1"
            }
          };
          const r = await fetch(url, {
            method: "POST",
            headers: {
              "x-api-key": process.env.API_GATEWAY_ADMIN_KEY,
              accept: "application/json",
              "content-type": "application/json"
            },
            body: JSON.stringify(payload),
            cache: "no-store",
            redirect: "error"
          });
          const text = await r.text();
          let body = {};
          try { body = text ? JSON.parse(text) : {}; } catch {}
          if (
            r.status === 423 &&
            body?.reason === "write_disabled" &&
            body?.writesExecuted === false
          ) {
            console.log("::notice title=UNIJURI_FAIL_CLOSED_OK::status=423 reason=write_disabled writesExecuted=false responseContract=canonical");
            process.exit(0);
          }
          console.log(`::error title=UNIJURI_FAIL_CLOSED_FAILED::status=${r.status} reason=${body?.reason ?? "null"} writesExecuted=${body?.writesExecuted ?? "null"}`);
          process.exit(1);
          NODE
