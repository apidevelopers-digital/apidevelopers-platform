name: UniJuri Governed Access Grant

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grant:
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 3
    env:
      API_GATEWAY_ADMIN_KEY: ${{ secrets.API_GATEWAY_ADMIN_KEY }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Create exact governed UniJuri access grant
        run: |
          node --input-type=module <<'NODE'
          const binding = {
            tenantId: "component.tenant.uni",
            workspaceId: "component.workspace.uni.uni-juri-main",
            subscriptionId: "component.subscription.uni.uni-juri",
            entitlementId: "component.entitlement.uni.uni-juri-main.use-product",
            provisioningJobId: "component.provisioning.uni.uni-juri-main.uni-juri",
            accessGrantId: "component.access.uni.juri.igor",
            principalId: "component.principal.2dad5f8ab425485a95b838442a1ccd04",
            productId: "uni-juri"
          };
          const r = await fetch("https://gateway.apidevelopers.digital/v1/saas/uni-juri/access/provision", {
            method: "POST",
            headers: {"x-api-key": process.env.API_GATEWAY_ADMIN_KEY, "content-type":"application/json", accept:"application/json"},
            body: JSON.stringify({
              approval: "IGOR_APROVA_UNIJURI_ACCESS_PROVISIONING_V1",
              productionApproval: "IGOR_APROVA_UNIJURI_ACCESS_REAL_20260913",
              binding
            })
          });
          const b = await r.json();
          const ok = r.status === 201 && b.ok === true && b.writesExecuted === true && b.chargeExecuted === false && b.secretsExposed === false;
          console.log(ok
            ? `::notice title=UNIJURI_ACCESS_GRANT_OK::status=${r.status} writesExecuted=${b.writesExecuted} chargeExecuted=${b.chargeExecuted} secretsExposed=${b.secretsExposed}`
            : `::error title=UNIJURI_ACCESS_GRANT_FAILED::status=${r.status} reason=${b.reason ?? "unknown"} writesExecuted=${b.writesExecuted ?? false}`);
          process.exit(ok ? 0 : 1);
          NODE
