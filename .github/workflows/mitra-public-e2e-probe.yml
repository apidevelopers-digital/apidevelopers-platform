name: UniJuri Access Binding Inspection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 3
    env:
      API_GATEWAY_ADMIN_KEY: ${{ secrets.API_GATEWAY_ADMIN_KEY }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Inspect UniJuri binding
        run: |
          node --input-type=module <<'NODE'
          const r = await fetch("https://gateway.apidevelopers.digital/v1/saas/uni-juri/access/inventory", {
            headers: {"x-api-key": process.env.API_GATEWAY_ADMIN_KEY, accept: "application/json"},
            cache: "no-store"
          });
          const b = await r.json();
          const w = (b.workspaces ?? []).find(x => x?.productId === "uni-juri");
          const s = (b.subscriptions ?? []).find(x => x?.productId === "uni-juri");
          const e = (b.entitlements ?? []).find(x => x?.productId === "uni-juri");
          const j = (b.provisioningJobs ?? []).find(x => x?.productId === "uni-juri");
          const p = (b.principals ?? [])[0];
          const safe = {
            status: r.status,
            tenantId: (b.tenants ?? [])[0]?.tenantId ?? null,
            workspaceId: w?.workspaceId ?? null,
            subscriptionId: s?.subscriptionId ?? null,
            entitlementId: e?.entitlementId ?? null,
            provisioningJobId: j?.provisioningJobId ?? null,
            principalId: p?.principalId ?? null,
            existingGrants: (b.accessGrants ?? []).length
          };
          console.log(JSON.stringify(safe));
          const required = ["tenantId","workspaceId","subscriptionId","entitlementId","provisioningJobId","principalId"];
          const valid = r.status === 200 && required.every(k => Boolean(safe[k]));
          const line = `status=${r.status} tenantId=${safe.tenantId} workspaceId=${safe.workspaceId} subscriptionId=${safe.subscriptionId} entitlementId=${safe.entitlementId} provisioningJobId=${safe.provisioningJobId} principalId=${safe.principalId} existingGrants=${safe.existingGrants}`;
          console.log(valid ? `::notice title=UNIJURI_BINDING_OK::${line}` : `::error title=UNIJURI_BINDING_FAILED::${line}`);
          process.exit(valid ? 0 : 1);
          NODE
