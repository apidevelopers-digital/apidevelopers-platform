name: UniJuri One-Time Production Bootstrap Retry

on:
  workflow_dispatch:
    inputs:
      approval:
        description: "Exact approval: IGOR_APROVA_UNIJURI_BOOTSTRAP_REAL_20260913"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: unijuri-one-time-production-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 5
    env:
      API_GATEWAY_ADMIN_KEY: ${{ secrets.API_GATEWAY_ADMIN_KEY }}
      APPROVAL: ${{ inputs.approval }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate explicit production approval
        shell: bash
        run: |
          set -euo pipefail
          test "$APPROVAL" = "IGOR_APROVA_UNIJURI_BOOTSTRAP_REAL_20260913"
          test -n "${API_GATEWAY_ADMIN_KEY:-}"

      - name: Execute idempotent UniJuri bootstrap
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          try {
            const url = "https://gateway.apidevelopers.digital/v1/saas/uni-juri/bootstrap";
            const payload = {
              approval: "IGOR_APROVA_UNIJURI_BOOTSTRAP_V1",
              productionApproval: "IGOR_APROVA_UNIJURI_BOOTSTRAP_REAL_20260913",
              input: {
                tenantSlug: "uni",
                workspaceSlug: "uni-juri-main",
                displayName: "UNI",
                planId: "internal",
                subjectRef: "e65b5439faf65ea9905025751e6a33010df6551d99b225bf032e163492969ec8",
                idempotencyKey: "unijuri-bootstrap-prod-20260913-v1"
              }
            };
            const r = await fetch(url, {
              method: "POST",
              headers: {
                "x-api-key": process.env.API_GATEWAY_ADMIN_KEY,
                "accept": "application/json",
                "content-type": "application/json"
              },
              body: JSON.stringify(payload),
              cache: "no-store",
              redirect: "error"
            });
            const text = await r.text();
            let body = {};
            try { body = text ? JSON.parse(text) : {}; } catch {}
            const safe = {
              status: r.status,
              ok: body?.ok === true,
              reason: body?.reason ?? null,
              productId: body?.productId ?? null,
              writesExecuted: body?.writesExecuted ?? null,
              accessGrantCreated: body?.accessGrantCreated ?? null,
              chargeExecuted: body?.chargeExecuted ?? null,
              secretsExposed: body?.secretsExposed ?? null
            };
            console.log(JSON.stringify(safe));
            if ([200, 201].includes(r.status) &&
                body?.ok === true &&
                body?.writesExecuted === true &&
                body?.chargeExecuted === false &&
                body?.secretsExposed === false &&
                body?.accessGrantCreated === false) {
              console.log("::notice title=UNIJURI_BOOTSTRAP_REAL_OK::writesExecuted=true accessGrantCreated=false chargeExecuted=false secretsExposed=false");
              process.exit(0);
            }
            console.log(`::error title=UNIJURI_BOOTSTRAP_REAL_FAILED::status=${r.status} reason=${body?.reason ?? "null"} writesExecuted=${body?.writesExecuted ?? "null"} chargeExecuted=${body?.chargeExecuted ?? "null"} secretsExposed=${body?.secretsExposed ?? "null"}`);
            process.exit(1);
          } catch (error) {
            const message = error instanceof Error ? error.message : String(error);
            console.log(`::error title=UNIJURI_BOOTSTRAP_TRANSPORT_FAILED::${message}`);
            process.exit(1);
          }
          NODE
