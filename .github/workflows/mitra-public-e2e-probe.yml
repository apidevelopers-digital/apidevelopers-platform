name: Gateway State Path Classification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  classify:
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 3
    env:
      API_GATEWAY_STATE_FILE: ${{ secrets.API_GATEWAY_STATE_FILE || vars.API_GATEWAY_STATE_FILE }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Classify state path without exposing it
        run: |
          node --input-type=module <<'NODE'
          import path from "node:path";
          const v=String(process.env.API_GATEWAY_STATE_FILE??"").trim();
          const present=Boolean(v);
          const absolute=present&&path.isAbsolute(v);
          const relative=present&&!absolute;
          const underHome=absolute&&v.startsWith("/home/");
          const underHbuilds=v.includes("/hbuilds/");
          const underPublicHtml=v.includes("/public_html/");
          const dotRelative=relative&&v.startsWith(".");
          const safe={present,absolute,relative,underHome,underHbuilds,underPublicHtml,dotRelative};
          console.log(JSON.stringify(safe));
          console.log(`::notice title=GATEWAY_STATE_PATH_CLASS::present=${present} absolute=${absolute} relative=${relative} underHome=${underHome} underHbuilds=${underHbuilds} underPublicHtml=${underPublicHtml} dotRelative=${dotRelative}`);
          if(!present) process.exit(1);
          NODE
