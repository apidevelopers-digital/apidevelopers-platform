name: Mitra Professional Block A E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Mitra Professional Block A E2E
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probe stages
        env:
          BASE: "https://gateway.apidevelopers.digital"
          ORIGIN: "https://mitra-preview.apidevelopers.digital"
        run: |
          mkdir -p mitra-e2e-report
          node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";
          const base = process.env.BASE;
          const origin = process.env.ORIGIN;
          const stages = [
            ["public_health","GET","/v1/mitra/public/health"],
            ["public_search","POST","/v1/mitra/public/search",{query:"responsabilidade civil",limit:3}],
            ["professional_health","GET","/v1/mitra/professional/health"],
            ["assistant","POST","/v1/mitra/professional/analyze",{question:"Quais pontos jurídicos devem ser revisados em responsabilidade civil?",facts:["Houve prestação de serviço."],tribunal:"STJ",limit:8}],
            ["jurimetrics","POST","/v1/mitra/professional/jurimetrics",{tribunal:"TJSP",query:"responsabilidade civil",limit:20}],
            ["documents","POST","/v1/mitra/professional/document/preview",{documentType:"legal_brief",objective:"Organizar argumentos jurídicos.",facts:["Houve prestação de serviço."],instructions:"Separar fatos e fontes.",citations:[]}],
            ["veritas","POST","/v1/mitra/professional/veritas",{mode:"claim_precheck",claim:"Fonte deve ser conferida.",evidence:{}}]
          ];
          const records = [];
          let failed_stage = null;
          for (const [stage, method, path, body] of stages) {
            const response = await fetch(`${base}${path}`, {
              method,
              headers: { origin, accept: "application/json", ...(body ? {"content-type":"application/json"} : {}) },
              ...(body ? { body: JSON.stringify(body) } : {}),
              credentials: "omit",
              cache: "no-store",
              redirect: "error"
            });
            const payload = await response.json().catch(() => ({}));
            const record = {
              stage, method, path,
              status: response.status,
              ok: payload?.ok === true,
              capability: payload?.capability ?? null,
              service: payload?.service ?? null,
              error: payload?.error ?? null,
              message: payload?.message ?? null,
              persistence: payload?.persistence ?? null,
              database_write_allowed: payload?.database_write_allowed ?? null,
              write_executed: payload?.write_executed ?? null
            };
            records.push(record);
            console.log(JSON.stringify({event:"mitra_e2e_response",...record}));
            if (response.status !== 200 || payload?.ok !== true || payload?.persistence === true || payload?.database_write_allowed === true || payload?.write_executed === true) {
              failed_stage = stage;
              console.error(`::error title=Mitra E2E failed::stage=${stage} status=${response.status} ok=${payload?.ok === true} message=${payload?.message ?? payload?.error ?? "unknown"}`);
              break;
            }
          }
          await writeFile("mitra-e2e-report/report.json", JSON.stringify({ ok: failed_stage === null, failed_stage, base, origin, generated_at: new Date().toISOString(), records }, null, 2) + "\n");
          if (failed_stage) process.exit(1);
          NODE
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mitra-e2e-report
          path: mitra-e2e-report/report.json
          if-no-files-found: error
