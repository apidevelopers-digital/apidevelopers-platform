name: UniJuri Access Inventory Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 3
    env:
      API_GATEWAY_ADMIN_KEY: ${{ secrets.API_GATEWAY_ADMIN_KEY }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read only UniJuri access inventory
        run: |
          node --input-type=module <<'NODE'
          const r = await fetch("https://gateway.apidevelopers.digital/v1/saas/uni-juri/access/inventory",{
            method: "GET",
            headers: {"x-api-key": process.env.API_GATEWAY_ADMIN_KEY, accept: "application/json"}
          });
          const b = await r.json();
          const grant = b.accessGrants?.[0] ?? null;
          const principal = b.principals?.[0] ?? null;
          const summary = {
            status: r.status,
            accessGrants: b.accessGrants?.length ?? 0,
            principals: b.principals?.length ?? 0,
            grantStatus: grant?.status ?? null,
            principalStatus: principal?.status ?? null,
            grantPrincipalMatchesFederatedPrincipal: Boolean(grant?.principalId && principal?.principalId) && grant.principalId === principal.principalId,
            federatedProvider: principal?.provider ?? null,
            federatedSubjectType: principal?.subjectType ?? null,
            productionChanged: b.productionChanged ?? false,
            secretsExposed: b.secretsExposed ?? false
          };
          const ok = r.status === 200 && b.ok === true && summary.productionChanged === false && summary.secretsExposed === false;
          console.log(`::${ok ? "notice" : "error"} title=UNIJURI_IDENTITY_BINDING_${ok ? "OK" : "FAILED"}::${Object.entries(summary).map(([k,v])=>`${k}=${v}`).join(" ")}`);
          process.exit(ok ? 0 : 1);
          NODE
