name: Mitra Professional Block A E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Mitra Professional Block A E2E
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Stage diagnostic
        env:
          BASE: "https://gateway.apidevelopers.digital"
          ORIGIN: "https://preview-apidevelopers.apidevelopers.digital"
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.BASE;
          const origin = process.env.ORIGIN;
          async function probe(stage, path, method="GET", body) {
            try {
              const r = await fetch(base + path, {
                method,
                headers: { origin, accept: "application/json", ...(body ? {"content-type":"application/json"} : {}) },
                ...(body ? {body: JSON.stringify(body)} : {}),
                cache: "no-store",
                redirect: "error"
              });
              let p = {};
              try { p = await r.json(); } catch {}
              if (r.status !== 200 || p?.ok !== true) {
                console.log(`::error title=MITRA_STAGE_FAILURE::${stage} status=${r.status} ok=${p?.ok===true} error=${p?.error ?? "null"} message=${p?.message ?? "null"}`);
                process.exit(1);
              }
              console.log(`::notice title=MITRA_STAGE_OK::${stage} status=${r.status}`);
            } catch (e) {
              console.log(`::error title=MITRA_STAGE_TRANSPORT::${stage} ${e instanceof Error ? e.message : String(e)}`);
              process.exit(1);
            }
          }
          await probe("public_health", "/v1/mitra/public/health");
          await probe("public_search", "/v1/mitra/public/search", "POST", {query:"responsabilidade civil", limit:3});
          await probe("professional_health", "/v1/mitra/professional/health");
          NODE
