name: UniJuri Inventory Verify
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 3
    env:
      API_GATEWAY_ADMIN_KEY: ${{ secrets.API_GATEWAY_ADMIN_KEY }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify production inventory
        run: |
          node --input-type=module <<'NODE'
          const r=await fetch("https://gateway.apidevelopers.digital/v1/saas/uni-juri/access/inventory",{headers:{"x-api-key":process.env.API_GATEWAY_ADMIN_KEY,accept:"application/json"},cache:"no-store"});
          const b=await r.json();
          const w=(b.workspaces??[]).find(x=>x.productId==="uni-juri");
          const s=(b.subscriptions??[]).find(x=>x.productId==="uni-juri");
          const e=(b.entitlements??[]).find(x=>x.productId==="uni-juri");
          const j=(b.provisioningJobs??[]).find(x=>x.productId==="uni-juri");
          const counts={tenants:(b.tenants??[]).length,workspaces:(b.workspaces??[]).length,subscriptions:(b.subscriptions??[]).length,entitlements:(b.entitlements??[]).length,jobs:(b.provisioningJobs??[]).length,accessGrants:(b.accessGrants??[]).length,principals:(b.principals??[]).length};
          const ok=r.status===200&&b.ok===true&&b.productionChanged===false&&b.secretsExposed===false&&w?.status==="active"&&s?.status==="active"&&e?.status==="active"&&e?.capability==="use_product"&&j?.status==="succeeded"&&counts.principals>=1;
          const line=`status=${r.status} tenants=${counts.tenants} workspaces=${counts.workspaces} subscriptions=${counts.subscriptions} entitlements=${counts.entitlements} jobs=${counts.jobs} accessGrants=${counts.accessGrants} principals=${counts.principals} workspace=${w?.status??"null"} subscription=${s?.status??"null"} entitlement=${e?.status??"null"} capability=${e?.capability??"null"} provisioning=${j?.status??"null"} productionChanged=${b.productionChanged} secretsExposed=${b.secretsExposed}`;
          console.log(ok?`::notice title=UNIJURI_INVENTORY_OK::${line}`:`::error title=UNIJURI_INVENTORY_FAILED::${line}`);
          process.exit(ok?0:1);
          NODE
