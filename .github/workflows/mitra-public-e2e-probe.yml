name: UniJuri Persistent Inventory Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 3
    env:
      API_GATEWAY_ADMIN_KEY: ${{ secrets.API_GATEWAY_ADMIN_KEY }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify persistent UniJuri inventory
        shell: bash
        run: |
          set -euo pipefail
          test -n "${API_GATEWAY_ADMIN_KEY:-}"
          node --input-type=module <<'NODE'
          const r = await fetch("https://gateway.apidevelopers.digital/v1/saas/uni-juri/access/inventory", {
            method: "GET",
            headers: {
              "x-api-key": process.env.API_GATEWAY_ADMIN_KEY,
              accept: "application/json"
            },
            cache: "no-store",
            redirect: "error"
          });
          const text = await r.text();
          let b = {};
          try { b = text ? JSON.parse(text) : {}; } catch {}
          const tenants = Array.isArray(b?.tenants) ? b.tenants : [];
          const workspaces = Array.isArray(b?.workspaces) ? b.workspaces : [];
          const subscriptions = Array.isArray(b?.subscriptions) ? b.subscriptions : [];
          const entitlements = Array.isArray(b?.entitlements) ? b.entitlements : [];
          const jobs = Array.isArray(b?.provisioningJobs) ? b.provisioningJobs : [];
          const grants = Array.isArray(b?.accessGrants) ? b.accessGrants : [];
          const principals = Array.isArray(b?.principals) ? b.principals : [];

          const workspace = workspaces.find((x) => x?.productId === "uni-juri");
          const subscription = subscriptions.find((x) => x?.productId === "uni-juri");
          const entitlement = entitlements.find((x) => x?.productId === "uni-juri");
          const job = jobs.find((x) => x?.productId === "uni-juri");

          const safe = {
            status: r.status,
            ok: b?.ok === true,
            tenants: tenants.length,
            workspaces: workspaces.length,
            subscriptions: subscriptions.length,
            entitlements: entitlements.length,
            provisioningJobs: jobs.length,
            accessGrants: grants.length,
            principals: principals.length,
            workspaceStatus: workspace?.status ?? null,
            subscriptionStatus: subscription?.status ?? null,
            entitlementStatus: entitlement?.status ?? null,
            entitlementCapability: entitlement?.capability ?? null,
            provisioningStatus: job?.status ?? null,
            productionChanged: b?.productionChanged ?? null,
            secretsExposed: b?.secretsExposed ?? null
          };
          console.log(JSON.stringify(safe));

          const valid =
            r.status === 200 &&
            b?.ok === true &&
            b?.productionChanged === false &&
            b?.secretsExposed === false &&
            tenants.length >= 1 &&
            workspace?.status === "active" &&
            subscription?.status === "active" &&
            entitlement?.status === "active" &&
            entitlement?.capability === "use_product" &&
            job?.status === "succeeded" &&
            principals.length >= 1;

          const line = `status=${r.status} tenants=${tenants.length} workspaces=${workspaces.length} subscriptions=${subscriptions.length} entitlements=${entitlements.length} jobs=${jobs.length} accessGrants=${grants.length} principals=${principals.length} workspaceStatus=${workspace?.status ?? "null"} subscriptionStatus=${subscription?.status ?? "null"} entitlementStatus=${entitlement?.status ?? "null"} entitlementCapability=${entitlement?.capability ?? "null"} provisioningStatus=${job?.status ?? "null"} productionChanged=${b?.productionChanged ?? "null"} secretsExposed=${b?.secretsExposed ?? "null"}`;
          if (!valid) {
            console.log(`::error title=UNIJURI_PERSISTENT_INVENTORY_FAILED::${line}`);
            process.exit(1);
          }
          console.log(`::notice title=UNIJURI_PERSISTENT_INVENTORY_OK::${line}`);
          NODE
