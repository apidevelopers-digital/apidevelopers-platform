name: UniJuri Bootstrap Production Safe Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probe UniJuri bootstrap route without writes
        run: |
          node --input-type=module <<'NODE'
          const url = "https://gateway.apidevelopers.digital/v1/saas/uni-juri/bootstrap";
          try {
            const r = await fetch(url, { method: "GET", headers: { accept: "application/json" }, cache: "no-store", redirect: "error" });
            const text = await r.text();
            let p = {};
            try { p = text ? JSON.parse(text) : {}; } catch {}
            if (r.status === 405 && p?.reason === "method_not_allowed" && p?.writesExecuted === false) {
              console.log("::notice title=UNIJURI_BOOTSTRAP_ROUTE_OK::status=405 writesExecuted=false");
              process.exit(0);
            }
            console.log(`::error title=UNIJURI_BOOTSTRAP_ROUTE_FAILURE::status=${r.status} reason=${p?.reason ?? "null"} writesExecuted=${p?.writesExecuted} contentType=${r.headers.get("content-type")}`);
            process.exit(1);
          } catch (e) {
            console.log(`::error title=UNIJURI_BOOTSTRAP_TRANSPORT::${e instanceof Error ? e.message : String(e)}`);
            process.exit(1);
          }
          NODE
