name: UniJuri Production Inventory Read

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 3
    env:
      API_GATEWAY_ADMIN_KEY: ${{ secrets.API_GATEWAY_ADMIN_KEY }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Read UniJuri inventory
        shell: bash
        run: |
          set -euo pipefail
          test -n "${API_GATEWAY_ADMIN_KEY:-}"
          node --input-type=module <<'NODE'
          const url = "https://gateway.apidevelopers.digital/v1/saas/uni-juri/access/inventory";
          const r = await fetch(url, {
            method: "GET",
            headers: {
              "x-api-key": process.env.API_GATEWAY_ADMIN_KEY,
              "accept": "application/json"
            },
            cache: "no-store",
            redirect: "error"
          });
          const text = await r.text();
          let body = {};
          try { body = text ? JSON.parse(text) : {}; } catch {}
          const counts = {
            tenants: Array.isArray(body?.tenants) ? body.tenants.length : null,
            workspaces: Array.isArray(body?.workspaces) ? body.workspaces.length : null,
            subscriptions: Array.isArray(body?.subscriptions) ? body.subscriptions.length : null,
            entitlements: Array.isArray(body?.entitlements) ? body.entitlements.length : null,
            provisioningJobs: Array.isArray(body?.provisioningJobs) ? body.provisioningJobs.length : null,
            accessGrants: Array.isArray(body?.accessGrants) ? body.accessGrants.length : null,
            principals: Array.isArray(body?.principals) ? body.principals.length : null
          };
          const workspace = Array.isArray(body?.workspaces)
            ? body.workspaces.find((item) => item?.productId === "uni-juri")
            : null;
          const subscription = Array.isArray(body?.subscriptions)
            ? body.subscriptions.find((item) => item?.productId === "uni-juri")
            : null;
          const entitlement = Array.isArray(body?.entitlements)
            ? body.entitlements.find((item) => item?.productId === "uni-juri")
            : null;
          const job = Array.isArray(body?.provisioningJobs)
            ? body.provisioningJobs.find((item) => item?.productId === "uni-juri")
            : null;
          const safe = {
            status: r.status,
            ok: body?.ok === true,
            productId: body?.productId ?? null,
            counts,
            workspaceStatus: workspace?.status ?? null,
            subscriptionStatus: subscription?.status ?? null,
            entitlementStatus: entitlement?.status ?? null,
            provisioningStatus: job?.status ?? null,
            productionChange: body?.productionChange ?? null,
            secretsExposed: body?.secretsExposed ?? null
          };
          console.log(JSON.stringify(safe));
          console.log(`::notice title=UNIJURI_INVENTORY::status=${r.status} tenants=${counts.tenants} workspaces=${counts.workspaces} subscriptions=${counts.subscriptions} entitlements=${counts.entitlements} jobs=${counts.provisioningJobs} accessGrants=${counts.accessGrants} principals=${counts.principals} workspaceStatus=${safe.workspaceStatus} subscriptionStatus=${safe.subscriptionStatus} entitlementStatus=${safe.entitlementStatus} provisioningStatus=${safe.provisioningStatus}`);
          if (!(r.status === 200 && body?.ok === true && body?.secretsExposed === false)) process.exit(1);
          NODE
