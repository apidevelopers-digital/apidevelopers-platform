name: Mitra Professional Block A E2E
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    name: Mitra Professional Block A E2E
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Diagnose Professional capabilities independently
        env:
          MITRA_GATEWAY_BASE_URL: "https://gateway.apidevelopers.digital"
          MITRA_BROWSER_ORIGIN: "https://preview-apidevelopers.apidevelopers.digital"
        run: |
          node --input-type=module <<'NODE'
          const base=process.env.MITRA_GATEWAY_BASE_URL, origin=process.env.MITRA_BROWSER_ORIGIN;
          async function req(stage,path,body){
            try{
              const r=await fetch(base+path,{method:body?"POST":"GET",headers:{origin,accept:"application/json",...(body?{"content-type":"application/json"}:{})},...(body?{body:JSON.stringify(body)}:{}),cache:"no-store",redirect:"error"});
              const p=await r.json().catch(()=>({}));
              console.log(JSON.stringify({stage,status:r.status,ok:p?.ok===true,capability:p?.capability??null,error:p?.error??null,message:p?.message??null,persistence:p?.persistence??null,database_write_allowed:p?.database_write_allowed??null,write_executed:p?.write_executed??null}));
              return {stage,r,p};
            }catch(e){console.log(JSON.stringify({stage,transport_error:e?.message??String(e)}));return {stage,r:null,p:{}}}
          }
          const a=[];
          a.push(await req("public_health","/v1/mitra/public/health"));
          const search=await req("public_search","/v1/mitra/public/search",{query:"responsabilidade civil",limit:3}); a.push(search);
          const first=search.p?.results?.[0]??null;
          a.push(await req("professional_health","/v1/mitra/professional/health"));
          a.push(await req("assistant","/v1/mitra/professional/analyze",{question:"Quais pontos jurídicos devem ser revisados em responsabilidade civil por serviço de saúde?",facts:["Houve prestação de serviço de saúde.","A relação causal precisa ser verificada com evidências."],tribunal:"STJ",limit:8}));
          a.push(await req("jurimetrics","/v1/mitra/professional/jurimetrics",{tribunal:"TJSP",query:"responsabilidade civil",limit:20}));
          a.push(await req("documents","/v1/mitra/professional/document/preview",{documentType:"legal_brief",objective:"Organizar argumentos jurídicos sobre responsabilidade civil para revisão profissional.",facts:["Houve prestação de serviço.","Os fatos e o nexo causal exigem validação documental."],instructions:"Separar fatos, fundamentos a validar e fontes oficiais.",citations:[{title:first?.title??"Fonte pública",source:first?.source??"Câmara dos Deputados — Dados Abertos",source_url:first?.source_url??"",citation:first?.citation??""}]}));
          a.push(await req("veritas","/v1/mitra/professional/veritas",{mode:"claim_precheck",claim:"A referência pública usada nesta análise deve ser conferida antes de uso profissional.",evidence:{source:first?.source??"Câmara dos Deputados — Dados Abertos",citation:first?.citation??"",source_url:first?.source_url??""}}));
          const failed=a.filter(x=>!x.r||x.r.status!==200||x.p?.ok!==true);
          if(failed.length){console.error("diagnostic_failed_stages="+failed.map(x=>x.stage).join(","));process.exit(1)}
          console.log("diagnostic_all_stages_ok=true");
          NODE
