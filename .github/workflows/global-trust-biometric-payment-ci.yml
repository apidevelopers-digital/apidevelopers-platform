name: Global Trust Biometric Payment CI

on:
  push:
    branches:
      - main
      - "feat/global-trust-biometric-payments-20260813"
    paths:
      - "packages/contracts/src/global-trust-biometric-payment.mjs"
      - "packages/contracts/test/global-trust-biometric-payment.test.mjs"
      - "packages/contracts/docs/GLOBAL_TRUST_BIOMETRIC_PAYMENT_CONTRACTS.md"
      - "packages/persistence-core/**"
      - "apps/api-gateway/src/global-trust-biometric-payment-verifier.mjs"
      - "apps/api-gateway/src/global-trust-biometric-payment-policy.mjs"
      - "apps/api-gateway/src/global-trust-biometric-payment-runtime.mjs"
      - "apps/api-gateway/src/global-trust-biometric-payment-store.mjs"
      - "apps/api-gateway/src/global-trust-biometric-payment-execution.mjs"
      - "apps/api-gateway/test/global-trust-biometric-payment-runtime.test.mjs"
      - "apps/api-gateway/test/global-trust-biometric-payment-store.test.mjs"
      - "apps/api-gateway/test/global-trust-biometric-payment-execution.test.mjs"
      - ".github/workflows/global-trust-biometric-payment-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "packages/contracts/src/global-trust-biometric-payment.mjs"
      - "packages/contracts/test/global-trust-biometric-payment.test.mjs"
      - "packages/contracts/docs/GLOBAL_TRUST_BIOMETRIC_PAYMENT_CONTRACTS.md"
      - "packages/persistence-core/**"
      - "apps/api-gateway/src/global-trust-biometric-payment-verifier.mjs"
      - "apps/api-gateway/src/global-trust-biometric-payment-policy.mjs"
      - "apps/api-gateway/src/global-trust-biometric-payment-runtime.mjs"
      - "apps/api-gateway/src/global-trust-biometric-payment-store.mjs"
      - "apps/api-gateway/src/global-trust-biometric-payment-execution.mjs"
      - "apps/api-gateway/test/global-trust-biometric-payment-runtime.test.mjs"
      - "apps/api-gateway/test/global-trust-biometric-payment-store.test.mjs"
      - "apps/api-gateway/test/global-trust-biometric-payment-execution.test.mjs"
      - ".github/workflows/global-trust-biometric-payment-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on:
      group: organization-macos-ci
      labels: [self-hosted, macOS, X64]
    timeout-minutes: 10
    env:
      GLOBAL_TRUST_PAYMENT_MODE: dry-run
      GLOBAL_TRUST_PAYMENT_EGRESS: blocked

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Bind local platform packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/api-gateway/node_modules/@apidevelopers
          ln -s "$GITHUB_WORKSPACE/packages/contracts"                 "$GITHUB_WORKSPACE/apps/api-gateway/node_modules/@apidevelopers/contracts"
          ln -s "$GITHUB_WORKSPACE/packages/persistence-core"                 "$GITHUB_WORKSPACE/apps/api-gateway/node_modules/@apidevelopers/persistence-core"

      - name: Validate syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check packages/contracts/src/global-trust-biometric-payment.mjs
          node --check packages/contracts/test/global-trust-biometric-payment.test.mjs
          node --check apps/api-gateway/src/global-trust-biometric-payment-verifier.mjs
          node --check apps/api-gateway/src/global-trust-biometric-payment-policy.mjs
          node --check apps/api-gateway/src/global-trust-biometric-payment-runtime.mjs
          node --check apps/api-gateway/src/global-trust-biometric-payment-store.mjs
          node --check apps/api-gateway/src/global-trust-biometric-payment-execution.mjs
          node --check apps/api-gateway/test/global-trust-biometric-payment-runtime.test.mjs
          node --check apps/api-gateway/test/global-trust-biometric-payment-store.test.mjs
          node --check apps/api-gateway/test/global-trust-biometric-payment-execution.test.mjs

      - name: Execute contract tests
        run: node --test packages/contracts/test/global-trust-biometric-payment.test.mjs

      - name: Execute cryptographic runtime tests
        working-directory: apps/api-gateway
        run: node --test test/global-trust-biometric-payment-runtime.test.mjs

      - name: Execute persistent replay-store tests
        working-directory: apps/api-gateway
        run: node --test test/global-trust-biometric-payment-store.test.mjs

      - name: Execute idempotent execution tests
        working-directory: apps/api-gateway
        run: node --test test/global-trust-biometric-payment-execution.test.mjs
