name: API Gateway Runtime Publish Pinned

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: "Exact approved source SHA"
        required: true
        type: string
      approval:
        description: "Exact Igor approval token"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: api-gateway-runtime-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.inputs.approval == 'IGOR_APROVA_GATEWAY_RUNTIME_BRANCH_20260814'
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 20
    env:
      RUNTIME_BRANCH: deploy/hostinger-gateway-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Pin approved source
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.inputs.expected_source_sha }}
        run: |
          set -euo pipefail
          sha="${EXPECTED_SOURCE_SHA,,}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin main
          git cat-file -e "${sha}^{commit}"
          git merge-base --is-ancestor "$sha" origin/main
          git checkout --detach "$sha"
          test "$(git rev-parse HEAD)" = "$sha"
          echo "SOURCE_SHA=$sha" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build runtime
        shell: bash
        run: |
          set -euo pipefail
          node apps/api-gateway/scripts/build-managed-hosting-artifact.mjs
          node apps/api-gateway/scripts/apply-hostinger-fixed-entry-compat.mjs
          node apps/api-gateway/scripts/verify-managed-hosting-artifact.mjs
          artifact="apps/api-gateway/dist/api-gateway-managed"
          runtime="$RUNNER_TEMP/api-gateway-runtime-$SOURCE_SHA"
          rm -rf "$runtime"
          mkdir -p "$runtime"
          cp -R "$artifact/." "$runtime/"
          zip_path="$RUNNER_TEMP/api-gateway-runtime-$SOURCE_SHA.zip"
          (cd "$runtime" && /usr/bin/zip -X -q -r "$zip_path" . -x ".DS_Store" "__MACOSX/*")
          /usr/bin/unzip -t "$zip_path" >/dev/null
          echo "RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
          echo "RUNTIME_ZIP=$zip_path" >> "$GITHUB_ENV"
          echo "RUNTIME_ZIP_SHA256=$(shasum -a 256 "$zip_path" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "RUNTIME_ZIP_BYTES=$(stat -f '%z' "$zip_path")" >> "$GITHUB_ENV"

      - name: Publish exact runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "api-developers-runtime-publisher"
          git config user.email "runtime-publisher@users.noreply.github.com"
          git fetch origin "$RUNTIME_BRANCH:$RUNTIME_BRANCH"
          git switch "$RUNTIME_BRANCH"
          find . -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp -R "$RUNTIME_DIR/." .
          cp "$RUNTIME_ZIP" ./api-gateway-runtime.zip
          printf '%s\n' "$SOURCE_SHA" > SOURCE_SHA
          printf '%s\n' "$RUNTIME_ZIP_SHA256" > RUNTIME_ZIP_SHA256
          printf '%s\n' "$RUNTIME_ZIP_BYTES" > RUNTIME_ZIP_BYTES
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "deploy(gateway): runtime from $SOURCE_SHA"
          git push origin "HEAD:refs/heads/$RUNTIME_BRANCH"
          git fetch origin "$RUNTIME_BRANCH"
          git show "origin/$RUNTIME_BRANCH:SOURCE_SHA" | grep -Fx "$SOURCE_SHA"
