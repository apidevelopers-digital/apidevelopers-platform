name: Web Agent Clean Main Import Diagnostic CI

on:
  push:
    branches:
      - "feat/web-agent-clean-main-reanchor-20260816"
    paths:
      - "apps/api-gateway/src/web-agent-*.mjs"
      - ".github/workflows/web-agent-clean-main-import-diagnostic-ci.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Link current clean-main local packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p node_modules/@apidevelopers
          ln -sfn "$GITHUB_WORKSPACE/packages/contracts" node_modules/@apidevelopers/contracts
          ln -sfn "$GITHUB_WORKSPACE/packages/auth-core" node_modules/@apidevelopers/auth-core
          ln -sfn "$GITHUB_WORKSPACE/packages/apikey-core" node_modules/@apidevelopers/apikey-core
          ln -sfn "$GITHUB_WORKSPACE/packages/persistence-core" node_modules/@apidevelopers/persistence-core
          ln -sfn "$GITHUB_WORKSPACE/packages/saas-runtime" node_modules/@apidevelopers/saas-runtime

          mkdir -p "$GITHUB_WORKSPACE/packages/auth-core/node_modules/@apidevelopers"
          ln -sfn "$GITHUB_WORKSPACE/packages/apikey-core" "$GITHUB_WORKSPACE/packages/auth-core/node_modules/@apidevelopers/apikey-core"

          mkdir -p "$GITHUB_WORKSPACE/packages/apikey-core/node_modules/@apidevelopers"
          ln -sfn "$GITHUB_WORKSPACE/packages/persistence-core" "$GITHUB_WORKSPACE/packages/apikey-core/node_modules/@apidevelopers/persistence-core"

          mkdir -p "$GITHUB_WORKSPACE/packages/saas-runtime/node_modules/@apidevelopers"
          ln -sfn "$GITHUB_WORKSPACE/packages/contracts" "$GITHUB_WORKSPACE/packages/saas-runtime/node_modules/@apidevelopers/contracts"
          ln -sfn "$GITHUB_WORKSPACE/packages/auth-core" "$GITHUB_WORKSPACE/packages/saas-runtime/node_modules/@apidevelopers/auth-core"
          ln -sfn "$GITHUB_WORKSPACE/packages/persistence-core" "$GITHUB_WORKSPACE/packages/saas-runtime/node_modules/@apidevelopers/persistence-core"

      - name: Import Web Agent operational composition
        run: node -e 'await import("./src/web-agent-operational-composition.mjs")'

      - name: Import current operational server
        run: node -e 'await import("./src/operational-server.mjs")'

      - name: Import Web Agent operational startup adapter
        run: node -e 'await import("./src/web-agent-operational-startup.mjs")'
