name: Kernel Decision Contracts Import Diagnostic

on:
  pull_request:
    paths:
      - "packages/kernel-decision/**"
      - "packages/contracts/**"
      - ".github/workflows/kernel-decision-behavior-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts-import:
    runs-on:
      group: organization-macos-ci
      labels: [self-hosted, macOS, X64]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/kernel-decision
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Import canonical contracts exports
        run: |
          node --input-type=module -e 'import("@apidevelopers/contracts").then((m) => { for (const k of ["assertPlanningReportContract","assertDecisionReportContract","assertCognitiveHandoffContract","createCognitiveHandoff"]) { if (typeof m[k] !== "function") throw new Error(`missing export: ${k}`); } })'
