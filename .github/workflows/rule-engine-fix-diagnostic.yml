name: Rule Engine Fix Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - id: test
        continue-on-error: true
        run: |
          mkdir -p diagnostics
          set +e
          npm test --workspace @apidevelopers/architecture-rule-engine > diagnostics/rule-engine-fix.log 2>&1
          status=$?
          set -e
          printf "\nexit_code=%s\n" "$status" >> diagnostics/rule-engine-fix.log
          exit "$status"
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f diagnostics/rule-engine-fix.log
          git commit -m "chore(diagnostics): capture fix result [skip ci]"
          git push origin "HEAD:${GITHUB_REF#refs/heads/}"
      - if: steps.test.outcome == 'failure'
        run: exit 1
