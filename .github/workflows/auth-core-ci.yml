name: Auth Core CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "foundation/**"
      - "work/**"
    paths:
      - "packages/auth-core/**"
      - "apps/api-gateway/src/security.mjs"
      - ".github/workflows/auth-core-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "packages/auth-core/**"
      - "apps/api-gateway/src/security.mjs"
      - ".github/workflows/auth-core-ci.yml"

permissions:
  contents: read

concurrency:
  group: auth-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check auth-core
        run: npm --prefix packages/auth-core run check
      - name: Link Gateway Core workspaces
        shell: bash
        run: |
          set -euo pipefail
          scope_dir="$GITHUB_WORKSPACE/node_modules/@apidevelopers"
          mkdir -p "$scope_dir"
          for package in registry-core platform-core auth-core apikey-core portal-projector-http; do
            source_dir="$GITHUB_WORKSPACE/packages/$package"
            target="$scope_dir/$package"
            test -f "$source_dir/package.json"
            rm -rf "$target"
            ln -s "$source_dir" "$target"
            test -f "$target/package.json"
          done
      - name: Check Gateway integration
        run: npm --workspace @apidevelopers/api-gateway run check
