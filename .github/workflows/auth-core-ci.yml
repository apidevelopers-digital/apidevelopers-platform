name: Auth Core CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "foundation/**"
    paths:
      - "packages/auth-core/**"
      - ".github/workflows/auth-core-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "packages/auth-core/**"
      - ".github/workflows/auth-core-ci.yml"

permissions:
  contents: read

concurrency:
  group: auth-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check auth-core
        run: npm --prefix packages/auth-core run check
