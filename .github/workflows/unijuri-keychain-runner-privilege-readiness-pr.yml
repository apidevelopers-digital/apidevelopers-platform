name: UniJuri Keychain Runner Privilege Readiness PR

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/unijuri-keychain-runner-privilege-readiness-pr.yml"
      - ".github/RUNNER_POLICY.md"

permissions:
  contents: read

concurrency:
  group: unijuri-keychain-runner-privilege-readiness-pr
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on:
      - self-hosted
      - macOS
      - X64
      - unijuri-keychain
    timeout-minutes: 5
    steps:
      - name: Validate dedicated UniJuri Keychain runner
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RUNNER_NAME:-}" != "apidevelopers-mac-ci-05" ]]; then
            echo "::error title=Wrong UniJuri Keychain runner::expected=apidevelopers-mac-ci-05; actual=${RUNNER_NAME:-unset}"
            exit 5
          fi
          echo "::notice title=UniJuri Keychain runner::runnerName=${RUNNER_NAME}; route=dedicated"

      - name: Read-only privilege and session diagnostic
        shell: bash
        run: |
          set -euo pipefail

          runner_user="$(id -un)"
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          console_user="$(/usr/bin/stat -f '%Su' /dev/console 2>/dev/null || true)"

          same_console_user=false
          if [[ -n "$console_user" && "$console_user" == "$runner_user" ]]; then
            same_console_user=true
          fi

          target_dir="/usr/local/libexec/apidevelopers"
          target_state=absent
          target_writable=false
          if [[ -d "$target_dir" ]]; then
            target_state=present-directory
            if [[ -w "$target_dir" ]]; then
              target_writable=true
            fi
          elif [[ -e "$target_dir" ]]; then
            target_state=present-not-directory
          fi

          parent_dir="/usr/local/libexec"
          parent_state=absent
          parent_writable=false
          if [[ -d "$parent_dir" ]]; then
            parent_state=present-directory
            if [[ -w "$parent_dir" ]]; then
              parent_writable=true
            fi
          elif [[ -e "$parent_dir" ]]; then
            parent_state=present-not-directory
          fi

          set +e
          /usr/bin/sudo -n true >/dev/null 2>&1
          sudo_noninteractive_rc=$?
          /usr/bin/sudo -n -l /usr/bin/install >/dev/null 2>&1
          sudo_install_list_rc=$?
          set -e

          sudo_noninteractive=false
          [[ "$sudo_noninteractive_rc" -eq 0 ]] && sudo_noninteractive=true

          sudo_install_listable=false
          [[ "$sudo_install_list_rc" -eq 0 ]] && sudo_install_listable=true

          osascript_executable=false
          [[ -x /usr/bin/osascript ]] && osascript_executable=true

          echo "::notice title=UniJuri runner identity::user=${runner_user}; uid=${runner_uid}; gid=${runner_gid}; consoleUser=${console_user:-none}; sameConsoleUser=${same_console_user}"
          echo "::notice title=UniJuri install target::parentState=${parent_state}; parentWritable=${parent_writable}; targetState=${target_state}; targetWritable=${target_writable}"
          echo "::notice title=UniJuri privilege readiness::sudoNonInteractive=${sudo_noninteractive}; sudoInstallListable=${sudo_install_listable}; osascriptExecutable=${osascript_executable}"
          echo "::notice title=UniJuri diagnostic contract::mode=read-only; writesPerformed=false"

      - name: Read-only macOS management-plane discovery
        shell: bash
        run: |
          set -euo pipefail

          mdm_status=unknown
          dep_enrolled=unknown
          profiles_available=false
          [[ -x /usr/bin/profiles ]] && profiles_available=true

          tmp_status="${RUNNER_TEMP}/unijuri-profiles-enrollment.txt"
          rm -f "$tmp_status"
          trap 'rm -f "$tmp_status"' EXIT

          if [[ "$profiles_available" == true ]]; then
            set +e
            /usr/bin/profiles status -type enrollment >"$tmp_status" 2>&1
            profiles_rc=$?
            set -e

            if [[ "$profiles_rc" -eq 0 ]]; then
              if /usr/bin/grep -Eiq 'MDM enrollment:[[:space:]]*Yes' "$tmp_status"; then
                mdm_status=enrolled
              elif /usr/bin/grep -Eiq 'MDM enrollment:[[:space:]]*No' "$tmp_status"; then
                mdm_status=not-enrolled
              fi

              if /usr/bin/grep -Eiq 'Enrolled via DEP:[[:space:]]*Yes' "$tmp_status"; then
                dep_enrolled=true
              elif /usr/bin/grep -Eiq 'Enrolled via DEP:[[:space:]]*No' "$tmp_status"; then
                dep_enrolled=false
              fi
            else
              mdm_status=probe-failed
              dep_enrolled=probe-failed
            fi
          fi

          jamf_agent=false
          [[ -x /usr/local/jamf/bin/jamf ]] && jamf_agent=true

          kandji_agent=false
          if [[ -d /Library/Kandji || -x /usr/local/bin/kandji ]]; then
            kandji_agent=true
          fi

          mosyle_agent=false
          if [[ -d "/Library/Application Support/Mosyle" || -x /usr/local/bin/mosyle ]]; then
            mosyle_agent=true
          fi

          fleet_agent=false
          if [[ -d "/Library/Application Support/Fleet" || -x /usr/local/bin/orbit ]]; then
            fleet_agent=true
          fi

          root_runner_launchdaemon=false
          shopt -s nullglob
          for plist in /Library/LaunchDaemons/actions.runner*.plist; do
            if [[ -f "$plist" ]]; then
              owner="$("/usr/bin/stat" -f '%Su' "$plist" 2>/dev/null || true)"
              if [[ "$owner" == root ]]; then
                root_runner_launchdaemon=true
                break
              fi
            fi
          done

          echo "::notice title=UniJuri macOS management enrollment::profilesAvailable=${profiles_available}; mdmStatus=${mdm_status}; automatedDeviceEnrollment=${dep_enrolled}"
          echo "::notice title=UniJuri management agents::jamf=${jamf_agent}; kandji=${kandji_agent}; mosyle=${mosyle_agent}; fleet=${fleet_agent}"
          echo "::notice title=UniJuri runner service plane::rootOwnedActionsRunnerLaunchDaemon=${root_runner_launchdaemon}"
          echo "::notice title=UniJuri management-plane discovery contract::mode=read-only; rawProfileOutputEmitted=false; writesPerformed=false"
