name: API Gateway Wave 5 Diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/api-gateway/**"
      - ".github/workflows/api-gateway-wave5-diagnostics.yml"

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.number == 132
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Link local dependencies
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          mkdir -p "$root/apps/api-gateway/node_modules/@apidevelopers"
          for package in contracts auth-core apikey-core persistence-core; do
            ln -sfn "$root/packages/$package" "$root/apps/api-gateway/node_modules/@apidevelopers/$package"
          done
          mkdir -p "$root/packages/auth-core/node_modules/@apidevelopers"
          ln -sfn "$root/packages/apikey-core" "$root/packages/auth-core/node_modules/@apidevelopers/apikey-core"
          mkdir -p "$root/packages/apikey-core/node_modules/@apidevelopers"
          ln -sfn "$root/packages/persistence-core" "$root/packages/apikey-core/node_modules/@apidevelopers/persistence-core"

      - name: Persist sanitized npm check evidence
        shell: bash
        working-directory: apps/api-gateway
        run: |
          set +e
          mkdir -p diagnostics
          npm run check > diagnostics/api-gateway-wave5.log 2>&1
          code=$?
          {
            echo "exit_code=$code"
            echo "head_sha=$GITHUB_SHA"
          } >> diagnostics/api-gateway-wave5.log

          python3 - diagnostics/api-gateway-wave5.log <<'PY'
          import pathlib, re, sys
          path = pathlib.Path(sys.argv[1])
          text = path.read_text(errors="replace")
          for pattern in (
              r"gh[pousr]_[A-Za-z0-9_]{20,}",
              r"Bearer\s+[A-Za-z0-9._-]{12,}",
              r"(?:secret|vault)://[^\s\"']+",
          ):
              text = re.sub(pattern, "[REDACTED]", text, flags=re.IGNORECASE)
          path.write_text("\n".join(text.splitlines()[-240:]) + "\n")
          PY

          git config user.name "api-developers-diagnostics"
          git config user.email "diagnostics@apidevelopers.digital"
          git add diagnostics/api-gateway-wave5.log
          git commit -m "chore(diagnostics): persist Wave 5 npm check evidence" || true
          git push origin "HEAD:${GITHUB_HEAD_REF}"
          exit "$code"
