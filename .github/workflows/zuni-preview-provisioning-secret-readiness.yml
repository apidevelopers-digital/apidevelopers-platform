name: Zuni Preview Provisioning Secret Readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 5
    env:
      PROVISIONING_KEY: ${{ secrets.API_GATEWAY_PROVISIONING_KEY }}
      SUBJECT_REF: ${{ secrets.ZUNI_PREVIEW_SUBJECT_REF }}

    steps:
      - name: Emit sanitized secret readiness
        shell: bash
        run: |
          set -euo pipefail

          provisioning_present=false
          provisioning_length_ok=false
          subject_present=false
          subject_format_ok=false

          if [[ -n "${PROVISIONING_KEY:-}" ]]; then
            provisioning_present=true
          fi
          if [[ "${#PROVISIONING_KEY}" -ge 32 ]]; then
            provisioning_length_ok=true
          fi
          if [[ -n "${SUBJECT_REF:-}" ]]; then
            subject_present=true
          fi
          if [[ "$SUBJECT_REF" =~ ^[a-fA-F0-9]{64}$ ]]; then
            subject_format_ok=true
          fi

          printf '{"provisioningKeyPresent":%s,"provisioningKeyLengthOk":%s,"subjectRefPresent":%s,"subjectRefFormatOk":%s,"secretsExposed":false}\n' \
            "$provisioning_present" \
            "$provisioning_length_ok" \
            "$subject_present" \
            "$subject_format_ok"

          if [[ "$provisioning_present" != "true" ]]; then
            echo "::error title=zuni_secret_readiness::provisioning_key_missing"
          elif [[ "$provisioning_length_ok" != "true" ]]; then
            echo "::error title=zuni_secret_readiness::provisioning_key_length_invalid"
          fi

          if [[ "$subject_present" != "true" ]]; then
            echo "::error title=zuni_secret_readiness::subject_ref_missing"
          elif [[ "$subject_format_ok" != "true" ]]; then
            echo "::error title=zuni_secret_readiness::subject_ref_format_invalid"
          fi

          if [[ "$provisioning_length_ok" != "true" || "$subject_format_ok" != "true" ]]; then
            exit 1
          fi
