name: Evolution Governance Integration CI

on:
  push:
    branches:
      - main
      - "foundation/**"
    paths:
      - "packages/kernel-governance/**"
      - "packages/contracts/**"
      - "tests/integration/kernel-evolution-governance-contracts.test.mjs"
      - "tests/integration/kernel-evolution-governance-wrapper.mjs"
      - "tests/integration/cleanup-cognitive-links.mjs"
      - ".github/workflows/evolution-governance-integration-ci.yml"
  pull_request:
    paths:
      - "packages/kernel-governance/**"
      - "packages/contracts/**"
      - "tests/integration/kernel-evolution-governance-contracts.test.mjs"
      - "tests/integration/kernel-evolution-governance-wrapper.mjs"
      - "tests/integration/cleanup-cognitive-links.mjs"
      - ".github/workflows/evolution-governance-integration-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check adapter
        run: node --check packages/kernel-governance/src/governed.mjs
      - name: Test integration
        run: node --test tests/integration/kernel-evolution-governance-wrapper.mjs 
