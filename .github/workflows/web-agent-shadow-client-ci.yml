name: Web Agent Shadow Client CI

on:
  push:
    branches:
      - "feat/web-agent-shadow-client-20260815"
    paths:
      - "apps/api-gateway/src/web-agent-shadow-client.mjs"
      - "apps/api-gateway/src/web-agent-shadow-browser-composition.mjs"
      - "apps/api-gateway/test/web-agent-shadow-client.test.mjs"
      - "apps/api-gateway/test/web-agent-shadow-browser-composition.test.mjs"
      - ".github/workflows/web-agent-shadow-client-ci.yml"
  pull_request:
    paths:
      - "apps/api-gateway/src/web-agent-shadow-client.mjs"
      - "apps/api-gateway/src/web-agent-shadow-browser-composition.mjs"
      - "apps/api-gateway/test/web-agent-shadow-client.test.mjs"
      - "apps/api-gateway/test/web-agent-shadow-browser-composition.test.mjs"
      - ".github/workflows/web-agent-shadow-client-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api-gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Link local platform packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p node_modules/@apidevelopers
          ln -sfn "$GITHUB_WORKSPACE/packages/contracts" node_modules/@apidevelopers/contracts
          ln -sfn "$GITHUB_WORKSPACE/packages/auth-core" node_modules/@apidevelopers/auth-core
          ln -sfn "$GITHUB_WORKSPACE/packages/apikey-core" node_modules/@apidevelopers/apikey-core
          ln -sfn "$GITHUB_WORKSPACE/packages/persistence-core" node_modules/@apidevelopers/persistence-core
          ln -sfn "$GITHUB_WORKSPACE/packages/saas-runtime" node_modules/@apidevelopers/saas-runtime

          mkdir -p "$GITHUB_WORKSPACE/packages/auth-core/node_modules/@apidevelopers"
          ln -sfn "$GITHUB_WORKSPACE/packages/apikey-core" "$GITHUB_WORKSPACE/packages/auth-core/node_modules/@apidevelopers/apikey-core"

          mkdir -p "$GITHUB_WORKSPACE/packages/apikey-core/node_modules/@apidevelopers"
          ln -sfn "$GITHUB_WORKSPACE/packages/persistence-core" "$GITHUB_WORKSPACE/packages/apikey-core/node_modules/@apidevelopers/persistence-core"

          mkdir -p "$GITHUB_WORKSPACE/packages/saas-runtime/node_modules/@apidevelopers"
          ln -sfn "$GITHUB_WORKSPACE/packages/contracts" "$GITHUB_WORKSPACE/packages/saas-runtime/node_modules/@apidevelopers/contracts"
          ln -sfn "$GITHUB_WORKSPACE/packages/auth-core" "$GITHUB_WORKSPACE/packages/saas-runtime/node_modules/@apidevelopers/auth-core"
          ln -sfn "$GITHUB_WORKSPACE/packages/persistence-core" "$GITHUB_WORKSPACE/packages/saas-runtime/node_modules/@apidevelopers/persistence-core"

      - name: Syntax
        run: |
          node --check src/web-agent-shadow-client.mjs
          node --check src/web-agent-shadow-browser-composition.mjs
          node --check test/web-agent-shadow-client.test.mjs
          node --check test/web-agent-shadow-browser-composition.test.mjs

      - name: Shadow client contract
        run: |
          node --test            test/web-agent-shadow-client.test.mjs            test/web-agent-shadow-browser-composition.test.mjs 

      - name: Guard browser/runtime trust boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"x-unico-api-key"' src/web-agent-shadow-client.mjs
          grep -q 'web_agent_shadow_execution_invariant_failed' src/web-agent-shadow-client.mjs
          grep -q 'web_agent_shadow_proposal_invariant_failed' src/web-agent-shadow-client.mjs
          grep -q 'baseUrl must use https' src/web-agent-shadow-client.mjs
          ! grep -Eq 'process\.env\.[A-Z0-9_]*(KEY|TOKEN|SECRET).*=' src/web-agent-shadow-client.mjs
