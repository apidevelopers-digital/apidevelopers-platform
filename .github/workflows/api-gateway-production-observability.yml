name: API Gateway Production Observability

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  observe:
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 5
    steps:
      - name: Enforce anonymous Web Agent protection boundary
        shell: bash
        run: |
          set -euo pipefail
          http_status="$(
            curl \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out "%{http_code}" \
              --connect-timeout 10 \
              --max-time 20 \
              --header "content-type: application/json" \
              --data '{}' \
              "https://gateway.apidevelopers.digital/v1/web-agent/conversations"
          )"
          echo "http_status=$http_status" >> "$GITHUB_STEP_SUMMARY"
          test "$http_status" = "401"
