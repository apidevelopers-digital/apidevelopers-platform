name: Kernel Decision Source Import Diagnostic

on:
  pull_request:
    paths:
      - "packages/kernel-decision/**"
      - "packages/contracts/**"
      - ".github/workflows/kernel-decision-marker-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-import:
    runs-on:
      group: organization-macos-ci
      labels: [self-hosted, macOS, X64]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/kernel-decision
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Import kernel decision source
        run: |
          node --input-type=module -e 'import("./src/index.mjs").then((m) => { if (typeof m.createDecisionEngine !== "function") throw new Error("missing createDecisionEngine"); })'
