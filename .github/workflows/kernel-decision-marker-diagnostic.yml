name: Kernel Decision Syntax Diagnostic

on:
  pull_request:
    paths:
      - "packages/kernel-decision/**"
      - ".github/workflows/kernel-decision-marker-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on:
      group: organization-macos-ci
      labels: [self-hosted, macOS, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check source and test syntax only
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            echo "checking syntax: $file"
            node --check "$file"
          done < <(find packages/kernel-decision/src packages/kernel-decision/test -type f -name '*.mjs' | sort)
