name: Web Agent Clean Main Operational E2E CI

on:
  push:
    branches:
      - "feat/web-agent-clean-main-reanchor-20260816"
  pull_request:
    paths:
      - "packages/contracts/src/web-agent-*.mjs"
      - "packages/contracts/src/web-international-context.mjs"
      - "packages/contracts/src/index.mjs"
      - "apps/api-gateway/src/product-agent-policy.mjs"
      - "apps/api-gateway/src/web-agent-*.mjs"
      - "apps/api-gateway/test/web-agent-clean-main-operational-e2e.test.mjs"
      - ".github/workflows/web-agent-clean-main-operational-e2e-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Link required local packages
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          gateway="$root/apps/api-gateway/node_modules/@apidevelopers"
          mkdir -p "$gateway"
          for package in contracts auth-core apikey-core persistence-core saas-runtime trust-governance-runtime; do
            ln -sfn "$root/packages/$package" "$gateway/$package"
          done

          mkdir -p "$root/packages/auth-core/node_modules/@apidevelopers"
          ln -sfn "$root/packages/apikey-core" "$root/packages/auth-core/node_modules/@apidevelopers/apikey-core"

          mkdir -p "$root/packages/apikey-core/node_modules/@apidevelopers"
          ln -sfn "$root/packages/persistence-core" "$root/packages/apikey-core/node_modules/@apidevelopers/persistence-core"

          mkdir -p "$root/packages/saas-runtime/node_modules/@apidevelopers"
          ln -sfn "$root/packages/contracts" "$root/packages/saas-runtime/node_modules/@apidevelopers/contracts"
          ln -sfn "$root/packages/auth-core" "$root/packages/saas-runtime/node_modules/@apidevelopers/auth-core"
          ln -sfn "$root/packages/persistence-core" "$root/packages/saas-runtime/node_modules/@apidevelopers/persistence-core"

          governance="$root/packages/trust-governance-runtime/node_modules/@apidevelopers"
          mkdir -p "$governance"
          for package in contracts kernel-planning kernel-decision kernel-policy kernel-runtime kernel-evidence kernel-audit; do
            ln -sfn "$root/packages/$package" "$governance/$package"
          done

          for package in kernel-planning kernel-decision kernel-policy kernel-runtime kernel-evidence; do
            mkdir -p "$root/packages/$package/node_modules/@apidevelopers"
            ln -sfn "$root/packages/contracts" "$root/packages/$package/node_modules/@apidevelopers/contracts"
          done

          mkdir -p "$root/packages/kernel-audit/node_modules/@apidevelopers"
          ln -sfn "$root/packages/contracts" "$root/packages/kernel-audit/node_modules/@apidevelopers/contracts"
          ln -sfn "$root/packages/kernel-evidence" "$root/packages/kernel-audit/node_modules/@apidevelopers/kernel-evidence"

      - name: Syntax
        run: |
          node --check src/product-agent-policy.mjs
          node --check src/web-agent-product-binding.mjs
          node --check src/web-agent-surface-policy.mjs
          node --check src/web-international-context-resolver.mjs
          node --check src/web-agent-conversation-boundary.mjs
          node --check src/web-agent-conversation-http.mjs
          node --check src/web-agent-shadow-client.mjs
          node --check src/web-agent-shadow-memory-provider.mjs
          node --check src/web-agent-shadow-memory-readonly-service.mjs
          node --check src/web-agent-shadow-persistence-providers.mjs
          node --check src/web-agent-browser-composition.mjs
          node --check src/web-agent-operational-composition.mjs
          node --check src/web-agent-operational-startup.mjs
          node --check test/web-agent-clean-main-operational-e2e.test.mjs

      - name: Import clean operational modules
        run: |
          node -e 'await import("./src/web-agent-operational-composition.mjs"); await import("./src/web-agent-operational-startup.mjs")'

      - name: Clean main operational E2E
        run: node --test test/web-agent-clean-main-operational-e2e.test.mjs
