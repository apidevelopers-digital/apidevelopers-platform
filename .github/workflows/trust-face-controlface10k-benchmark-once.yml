name: Trust Face ControlFace10K Benchmark Once

on:
  push:
    branches:
      - ada/trust-face-sface-lab-inference-v1
    paths:
      - ".github/workflows/trust-face-controlface10k-benchmark-once.yml"

permissions:
  contents: write

jobs:
  benchmark:
    if: ${{ contains(github.event.head_commit.message, '[benchmark-controlface10k]') }}
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 120
    env:
      ARCHIVE_REL: ".cache/apidevelopers-digital/trust-face/controlface10k/controlface10k.zip"
      ARCHIVE_BYTES: "3137641968"
      ARCHIVE_SHA256: "d0ed28b3271a75ac5bb8e6799fdfe78ba3a91fb7eddecf19d960ed18fe00a108"
      YUNET_BYTES: "232589"
      YUNET_SHA256: "8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4"
      SFACE_BYTES: "38696353"
      SFACE_SHA256: "0ba9fbfa01b5270c96627c4ef784da859931e02f04419c829e83484087c34e79"
      ZOO_REV: "47534e27c9851bb1128ccc0102f1145e27f23f98"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight authorization and pinned archive
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/controlface-benchmark-stage"
          echo "preflight_started" > "$stage"
          auth="packages/trust-face-engine/docs/CONTROLFACE10K_BENCHMARK_AUTHORIZATION_V1.md"
          for line in \
            "benchmarkExecutionApproved: true" \
            "calibrationMutationAllowed: false" \
            "thresholdCalibrationAllowed: false" \
            "identityClaimAllowed: false" \
            "productionAllowed: false"; do
            grep -Fx "$line" "$auth"
          done
          [[ "${RUNNER_OS:-}" == "macOS" && "${RUNNER_ARCH:-}" == "X64" ]]
          if [[ "${RUNNER_NAME:-}" != "igor-mac-runner" ]]; then
            echo "::warning title=Trust Face runner drift::canonical=igor-mac-runner actual=${RUNNER_NAME:-unknown}"
          fi
          archive="$HOME/$ARCHIVE_REL"
          test -f "$archive"
          bytes="$(stat -f%z "$archive")"
          sha="$(shasum -a 256 "$archive" | awk '{print $1}')"
          [[ "$bytes" == "$ARCHIVE_BYTES" && "$sha" == "$ARCHIVE_SHA256" ]]
          echo "CONTROLFACE_ARCHIVE=$archive" >> "$GITHUB_ENV"
          echo "preflight_passed" > "$stage"

      - name: Prepare pinned runtime and models
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/controlface-benchmark-stage"
          echo "runtime_prepare_started" > "$stage"
          root="$HOME/.cache/apidevelopers-digital/trust-face/controlface10k-benchmark"
          venv="$root/venv"; models="$root/models"; mkdir -p "$models"
          [[ -x "$venv/bin/python" ]] || python3 -m venv "$venv"
          "$venv/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: "opencv-contrib-python-headless==4.13.0.92" >/dev/null
          "$venv/bin/python" -c 'import cv2; assert cv2.__version__=="4.13.0",cv2.__version__'
          echo "opencv_runtime_ready" > "$stage"

          ensure_model() {
            local path="$1" url="$2" bytes="$3" sha="$4"
            if [[ -f "$path" ]]; then
              local b h
              b="$(stat -f%z "$path")"; h="$(shasum -a 256 "$path" | awk '{print $1}')"
              [[ "$b" == "$bytes" && "$h" == "$sha" ]] && return 0
              rm -f "$path"
            fi
            curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 30 --output "$path.part" "$url"
            local b h
            b="$(stat -f%z "$path.part")"; h="$(shasum -a 256 "$path.part" | awk '{print $1}')"
            [[ "$b" == "$bytes" && "$h" == "$sha" ]]
            mv "$path.part" "$path"
          }

          yunet="$models/face_detection_yunet_2023mar.onnx"
          sface="$models/face_recognition_sface_2021dec.onnx"
          echo "yunet_prepare_started" > "$stage"
          ensure_model "$yunet" "https://media.githubusercontent.com/media/opencv/opencv_zoo/$ZOO_REV/models/face_detection_yunet/face_detection_yunet_2023mar.onnx" "$YUNET_BYTES" "$YUNET_SHA256"
          echo "yunet_ready" > "$stage"
          echo "sface_prepare_started" > "$stage"
          ensure_model "$sface" "https://media.githubusercontent.com/media/opencv/opencv_zoo/$ZOO_REV/models/face_recognition_sface/face_recognition_sface_2021dec.onnx" "$SFACE_BYTES" "$SFACE_SHA256"
          echo "sface_ready" > "$stage"
          "$venv/bin/python" -m py_compile packages/trust-face-engine/src/controlface10k-benchmark-v1.py
          echo "CONTROLFACE_VENV=$venv" >> "$GITHUB_ENV"
          echo "CONTROLFACE_YUNET=$yunet" >> "$GITHUB_ENV"
          echo "CONTROLFACE_SFACE=$sface" >> "$GITHUB_ENV"
          echo "runtime_prepare_passed" > "$stage"

      - name: Execute approved benchmark only
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/controlface-benchmark-stage"
          echo "benchmark_started" > "$stage"
          out="$RUNNER_TEMP/controlface10k-benchmark-result-v1.json"
          "$CONTROLFACE_VENV/bin/python" packages/trust-face-engine/src/controlface10k-benchmark-v1.py \
            --archive "$CONTROLFACE_ARCHIVE" \
            --yunet-model "$CONTROLFACE_YUNET" \
            --sface-model "$CONTROLFACE_SFACE" \
            --output "$out" \
            --archive-sha256 "$ARCHIVE_SHA256" \
            --yunet-sha256 "$YUNET_SHA256" \
            --sface-sha256 "$SFACE_SHA256" \
            --source-revision "$ZOO_REV"
          echo "CONTROLFACE_RESULT=$out" >> "$GITHUB_ENV"
          echo "benchmark_completed" > "$stage"

      - name: Validate sanitized result and persist aggregate only
        shell: bash
        run: |
          set -euo pipefail
          "$CONTROLFACE_VENV/bin/python" -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); assert d["benchmarkOnly"] and d["benchmarkExecuted"] and d["executionCompleted"]; assert d["subset"]["selectedIdentityCount"]==64 and d["subset"]["selectedImageCount"]==192; assert d["subset"]["selectedIdentityPathsStored"] is False; assert all(v is False for v in d["privacy"].values()); assert d["safety"]=={"bandFrozen":True,"biometricClaimReady":False,"calibrationMutationAllowed":False,"productionAuthorized":False,"productionReady":False}; f=d["scores"]["frozenBand"]; assert all(f[k] is False for k in ("thresholdApplied","matchedClaimed","identityClaimed","thresholdCalibrated","farFmrValidated","frrFnmrValidated"))' "$CONTROLFACE_RESULT"
          target="packages/trust-face-engine/docs/CONTROLFACE10K_BENCHMARK_RESULT_V1.json"
          cp "$CONTROLFACE_RESULT" "$target"
          git add "$target"
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(trust): record ControlFace10K benchmark aggregate"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Publish fail-closed stage
        if: failure()
        shell: bash
        run: |
          stage="$(cat "$RUNNER_TEMP/controlface-benchmark-stage" 2>/dev/null || echo unknown)"
          echo "::error title=ControlFace10K benchmark fail-closed::stage=$stage benchmarkExecuted=$([[ "$stage" == "benchmark_completed" ]] && echo true || echo false)"
