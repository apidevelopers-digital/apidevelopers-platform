name: Trust Face ControlFace10K Benchmark Once

on:
  push:
    branches:
      - ada/trust-face-sface-lab-inference-v1
    paths:
      - ".github/workflows/trust-face-controlface10k-benchmark-once.yml"

permissions:
  contents: write
jobs:
  benchmark:
    if: ${{ contains(github.event.head_commit.message, '[benchmark-controlface10k]') }}
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight OpenCV 4.13 source build without mutation
        shell: bash
        run: bash packages/trust-face-engine/scripts/diagnose-controlface10k-source-build.sh
