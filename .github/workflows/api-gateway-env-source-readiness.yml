name: API Gateway Env Source Readiness

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  readiness:
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 5
    env:
      DELEGATED_KEY: ${{ secrets.API_GATEWAY_DELEGATED_KEY }}
      BASE_URL: https://gateway.apidevelopers.digital
      SUBJECT_REF: e65b5439faf65ea9905025751e6a33010df6551d99b225bf032e163492969ec8
    steps:
      - name: Probe production delegated key
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DELEGATED_KEY:-}"
          body="$RUNNER_TEMP/gateway-delegated.json"
          code="$(curl -sS --connect-timeout 10 --max-time 25             -H "Authorization: Bearer ${DELEGATED_KEY}"             -H "X-Delegated-Subject-Ref: ${SUBJECT_REF}"             -o "$body" -w '%{http_code}'             "${BASE_URL}/v1/saas/access/delegated?productId=uni-juri")"
          BODY_FILE="$body" HTTP_CODE="$code" node <<'NODE'
          const fs = require("node:fs");
          const code = Number(process.env.HTTP_CODE || 0);
          let body = {};
          try { body = JSON.parse(fs.readFileSync(process.env.BODY_FILE, "utf8")); } catch {}
          const reason = typeof body.reason === "string" ? body.reason : "none";
          const allowed = body.allowed === true;
          const tenantPresent = !!(body.binding && body.binding.tenantId);
          const workspacePresent = !!(body.binding && body.binding.workspaceId);
          const proofPresent = !!(body.bindingProof && body.bindingProof.proof);
          console.log(`gateway_delegated_status=${code}`);
          console.log(`gateway_delegated_allowed=${allowed}`);
          console.log(`gateway_delegated_reason=${reason}`);
          console.log(`gateway_binding_tenant_present=${tenantPresent}`);
          console.log(`gateway_binding_workspace_present=${workspacePresent}`);
          console.log(`gateway_binding_proof_present=${proofPresent}`);
          if (code !== 200 || body.allowed !== true) {
            console.error(`::error title=gateway_delegated_key_probe::status=${code} reason=${reason} allowed=${allowed}`);
            process.exit(1);
          }
          NODE
