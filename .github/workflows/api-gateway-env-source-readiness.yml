name: API Gateway Env Source Readiness

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  readiness:
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 10
    env:
      GLOBAL_TRUST_EVALUATION_PORTAL_ENABLED: ${{ secrets.GLOBAL_TRUST_EVALUATION_PORTAL_ENABLED || vars.GLOBAL_TRUST_EVALUATION_PORTAL_ENABLED }}
      GLOBAL_TRUST_EVALUATION_ENABLED: ${{ secrets.GLOBAL_TRUST_EVALUATION_ENABLED || vars.GLOBAL_TRUST_EVALUATION_ENABLED }}
      API_GATEWAY_ADMIN_KEY: ${{ secrets.API_GATEWAY_ADMIN_KEY }}
      API_GATEWAY_STATE_FILE: ${{ secrets.API_GATEWAY_STATE_FILE || vars.API_GATEWAY_STATE_FILE }}
      API_GATEWAY_DELEGATED_TENANT_ID: ${{ secrets.API_GATEWAY_DELEGATED_TENANT_ID || vars.API_GATEWAY_DELEGATED_TENANT_ID }}
      API_GATEWAY_DELEGATED_KEY: ${{ secrets.API_GATEWAY_DELEGATED_KEY }}
      API_GATEWAY_PROVISIONING_KEY: ${{ secrets.API_GATEWAY_PROVISIONING_KEY }}
      UNI_CO_PREVIEW_IDENTITY_BACKEND_BASE_URL: ${{ secrets.UNI_CO_PREVIEW_IDENTITY_BACKEND_BASE_URL || vars.UNI_CO_PREVIEW_IDENTITY_BACKEND_BASE_URL }}
      WEB_AGENT_SHADOW_API_KEY: ${{ secrets.WEB_AGENT_SHADOW_API_KEY }}
      WEB_AGENT_SHADOW_BASE_URL: ${{ secrets.WEB_AGENT_SHADOW_BASE_URL || vars.WEB_AGENT_SHADOW_BASE_URL }}
      WEB_AGENT_SHADOW_ENABLED: ${{ secrets.WEB_AGENT_SHADOW_ENABLED || vars.WEB_AGENT_SHADOW_ENABLED }}
      API_GATEWAY_OPERATOR_KEY: ${{ secrets.API_GATEWAY_OPERATOR_KEY }}
      API_GATEWAY_OPERATOR_TENANT_ID: ${{ secrets.API_GATEWAY_OPERATOR_TENANT_ID || vars.API_GATEWAY_OPERATOR_TENANT_ID }}
    steps:
      - name: Check canonical environment source presence
        shell: bash
        run: |
          set -euo pipefail

          required=(
            GLOBAL_TRUST_EVALUATION_PORTAL_ENABLED
            GLOBAL_TRUST_EVALUATION_ENABLED
            API_GATEWAY_ADMIN_KEY
            API_GATEWAY_STATE_FILE
            API_GATEWAY_DELEGATED_TENANT_ID
            API_GATEWAY_DELEGATED_KEY
            API_GATEWAY_PROVISIONING_KEY
            UNI_CO_PREVIEW_IDENTITY_BACKEND_BASE_URL
            WEB_AGENT_SHADOW_API_KEY
            WEB_AGENT_SHADOW_BASE_URL
            WEB_AGENT_SHADOW_ENABLED
            API_GATEWAY_OPERATOR_KEY
            API_GATEWAY_OPERATOR_TENANT_ID
          )

          missing=0
          missing_names=()
          {
            echo "## API Gateway environment source readiness"
            echo
            echo "| Key | Source ready |"
            echo "| --- | --- |"
            for key in "${required[@]}"; do
              if [ -n "${!key:-}" ]; then
                echo "| \`$key\` | yes |"
              else
                echo "| \`$key\` | no |"
                missing=$((missing + 1))
                missing_names+=("$key")
              fi
            done
            echo
            echo "- valuesExposed: \`false\`"
            echo "- hostingerMutationPerformed: \`false\`"
            echo "- missingCount: \`$missing\`"
          } >> "$GITHUB_STEP_SUMMARY"

          missing_names_csv=""
          if [ "$missing" -ne 0 ]; then
            missing_names_csv="$(IFS=,; echo "${missing_names[*]}")"
          fi
          evidence_json="$(printf '{"missingCount":%s,"missingNames":"%s","valuesExposed":false,"hostingerMutationPerformed":false}' \
            "$missing" \
            "$missing_names_csv")"
          evidence_bytes="$(printf '%s' "$evidence_json" | wc -c | tr -d '[:space:]')"
          if [ "$evidence_bytes" -gt 512 ]; then
            echo "ADA_EVIDENCE exceeds 512 bytes" >&2
            exit 1
          fi
          printf '::notice title=ADA_EVIDENCE::%s\n' "$evidence_json"

          if [ "$missing" -ne 0 ]; then
            echo "Environment source is incomplete: $missing required keys are unavailable." >&2
            exit 1
          fi

          echo "Environment source is complete. No values were printed."

      - name: Inventory UniJuri production access context (read-only)
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          status="$(curl --silent --show-error --output "$tmp" --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 20 \
            --header "Authorization: Bearer $API_GATEWAY_OPERATOR_KEY" \
            "https://gateway.apidevelopers.digital/v1/saas/uni-juri/access/inventory")"

          node --input-type=module - "$tmp" "$status" <<'NODE'
          import fs from "node:fs";
          const [path, status] = process.argv.slice(2);
          let body = {};
          try { body = JSON.parse(fs.readFileSync(path, "utf8")); } catch {}
          const counts = Object.fromEntries(
            ["tenants","workspaces","subscriptions","entitlements","provisioningJobs","accessGrants","principals"]
              .map((key) => [key, Array.isArray(body[key]) ? body[key].length : null])
          );
          const evidence = {
            status: Number(status),
            ok: body.ok === true,
            productId: body.productId ?? null,
            revision: body.revision ?? null,
            counts,
            productionChanged: body.productionChanged === true,
            secretsExposed: body.secretsExposed === true
          };
          console.log(`::notice title=UNIJURI_INVENTORY::${JSON.stringify(evidence)}`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `\n## UniJuri production access inventory\n\n- HTTP: \`${status}\`\n- productId: \`${body.productId ?? "unknown"}\`\n- revision: \`${body.revision ?? "unknown"}\`\n- counts: \`${JSON.stringify(counts)}\`\n- productionChanged: \`${body.productionChanged === true}\`\n- secretsExposed: \`${body.secretsExposed === true}\`\n`
          );
          if (Number(status) !== 200 || body.ok !== true) process.exit(1);
          NODE
