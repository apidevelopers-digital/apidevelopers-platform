name: API Gateway Env Source Readiness

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  rotate-and-restore:
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 15
    env:
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
      GLOBAL_TRUST_EVALUATION_PORTAL_ENABLED: ${{ secrets.GLOBAL_TRUST_EVALUATION_PORTAL_ENABLED || vars.GLOBAL_TRUST_EVALUATION_PORTAL_ENABLED }}
      GLOBAL_TRUST_EVALUATION_ENABLED: ${{ secrets.GLOBAL_TRUST_EVALUATION_ENABLED || vars.GLOBAL_TRUST_EVALUATION_ENABLED }}
      API_GATEWAY_ADMIN_KEY: ${{ secrets.API_GATEWAY_ADMIN_KEY }}
      API_GATEWAY_STATE_FILE: ${{ secrets.API_GATEWAY_STATE_FILE || vars.API_GATEWAY_STATE_FILE }}
      API_GATEWAY_DELEGATED_TENANT_ID: ${{ secrets.API_GATEWAY_DELEGATED_TENANT_ID || vars.API_GATEWAY_DELEGATED_TENANT_ID }}
      API_GATEWAY_DELEGATED_KEY: ${{ secrets.API_GATEWAY_DELEGATED_KEY }}
      UNI_CO_PREVIEW_IDENTITY_BACKEND_BASE_URL: ${{ secrets.UNI_CO_PREVIEW_IDENTITY_BACKEND_BASE_URL || vars.UNI_CO_PREVIEW_IDENTITY_BACKEND_BASE_URL }}
      WEB_AGENT_SHADOW_API_KEY: ${{ secrets.WEB_AGENT_SHADOW_API_KEY }}
      WEB_AGENT_SHADOW_BASE_URL: ${{ secrets.WEB_AGENT_SHADOW_BASE_URL || vars.WEB_AGENT_SHADOW_BASE_URL }}
      WEB_AGENT_SHADOW_ENABLED: ${{ secrets.WEB_AGENT_SHADOW_ENABLED || vars.WEB_AGENT_SHADOW_ENABLED }}
      API_GATEWAY_OPERATOR_KEY: ${{ secrets.API_GATEWAY_OPERATOR_KEY }}
      API_GATEWAY_OPERATOR_TENANT_ID: ${{ secrets.API_GATEWAY_OPERATOR_TENANT_ID || vars.API_GATEWAY_OPERATOR_TENANT_ID }}
      HOSTINGER_URL: https://developers.hostinger.com/api/hosting/v1/accounts/u242521810/websites/gateway.apidevelopers.digital/nodejs/builds/settings/env
      GATEWAY_BASE_URL: https://gateway.apidevelopers.digital
      SUBJECT_REF: e65b5439faf65ea9905025751e6a33010df6551d99b225bf032e163492969ec8
    steps:
      - name: Validate approved canonical source
        shell: bash
        run: |
          set -euo pipefail
          required=(HOSTINGER_API_TOKEN GLOBAL_TRUST_EVALUATION_PORTAL_ENABLED GLOBAL_TRUST_EVALUATION_ENABLED API_GATEWAY_ADMIN_KEY API_GATEWAY_STATE_FILE API_GATEWAY_DELEGATED_TENANT_ID API_GATEWAY_DELEGATED_KEY UNI_CO_PREVIEW_IDENTITY_BACKEND_BASE_URL WEB_AGENT_SHADOW_API_KEY WEB_AGENT_SHADOW_BASE_URL WEB_AGENT_SHADOW_ENABLED API_GATEWAY_OPERATOR_KEY API_GATEWAY_OPERATOR_TENANT_ID)
          for key in "${required[@]}"; do test -n "${!key:-}" || { echo "::error title=missing_source::$key is unavailable"; exit 1; }; done
          echo "canonical_source_ready=true"
          echo "secret_values_exposed=false"

      - name: Rotate provisioning key in-memory and replace Hostinger environment
        shell: bash
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/gateway-env.json"
          response="$RUNNER_TEMP/gateway-env-response.json"
          trap 'rm -f "$payload" "$response"' EXIT
          # New cryptographically random provisioning key. It exists only in this job and Hostinger runtime.
          API_GATEWAY_PROVISIONING_KEY="$(openssl rand -hex 32)"
          export API_GATEWAY_PROVISIONING_KEY
          node <<'NODE' > "$payload"
          const keys=["GLOBAL_TRUST_EVALUATION_PORTAL_ENABLED","GLOBAL_TRUST_EVALUATION_ENABLED","API_GATEWAY_ADMIN_KEY","API_GATEWAY_STATE_FILE","API_GATEWAY_DELEGATED_TENANT_ID","API_GATEWAY_DELEGATED_KEY","API_GATEWAY_PROVISIONING_KEY","UNI_CO_PREVIEW_IDENTITY_BACKEND_BASE_URL","WEB_AGENT_SHADOW_API_KEY","WEB_AGENT_SHADOW_BASE_URL","WEB_AGENT_SHADOW_ENABLED","API_GATEWAY_OPERATOR_KEY","API_GATEWAY_OPERATOR_TENANT_ID"];
          const env_vars=keys.map(key=>({key,value:String(process.env[key]||"")}));
          if(env_vars.some(x=>!x.value)) process.exit(2);
          process.stdout.write(JSON.stringify({env_vars}));
          NODE
          code="$(curl -sS --connect-timeout 10 --max-time 40 -X PUT -H 'Accept: application/json' -H 'Content-Type: application/json' -H "Authorization: Bearer ${HOSTINGER_API_TOKEN}" --data-binary "@$payload" -o "$response" -w '%{http_code}' "$HOSTINGER_URL")"
          echo "hostinger_env_replace_status=$code"
          test "$code" = "200" || { echo "::error title=hostinger_env_replace::status=$code"; exit 1; }
          echo "provisioning_key_rotated=true"
          echo "hostinger_env_replace_applied=true"
          echo "env_count=13"
          echo "secret_values_exposed=false"

      - name: Wait for gateway readiness after automatic restart
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            code="$(curl -sS --connect-timeout 5 --max-time 10 -o "$RUNNER_TEMP/ready.json" -w '%{http_code}' "$GATEWAY_BASE_URL/ready" || true)"
            if [ "$code" = "200" ] && READY_FILE="$RUNNER_TEMP/ready.json" node -e 'const fs=require("node:fs");const b=JSON.parse(fs.readFileSync(process.env.READY_FILE,"utf8"));if(b.status!=="ready")process.exit(1);'; then
              echo "gateway_ready=true"
              exit 0
            fi
            sleep 3
          done
          echo "::error title=gateway_readiness::gateway did not become ready"
          exit 1

      - name: Verify canonical delegated key against production
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/delegated.json"
          code="$(curl -sS --connect-timeout 10 --max-time 25 -H "Authorization: Bearer ${API_GATEWAY_DELEGATED_KEY}" -H "X-Delegated-Subject-Ref: ${SUBJECT_REF}" -o "$body" -w '%{http_code}' "$GATEWAY_BASE_URL/v1/saas/access/delegated?productId=uni-juri")"
          BODY_FILE="$body" HTTP_CODE="$code" node <<'NODE'
          const fs=require("node:fs"); const code=Number(process.env.HTTP_CODE||0); let b={}; try{b=JSON.parse(fs.readFileSync(process.env.BODY_FILE,"utf8"));}catch{}
          const reason=typeof b.reason==="string"?b.reason:"none"; const allowed=b.allowed===true;
          console.log(`delegated_status=${code}`); console.log(`delegated_allowed=${allowed}`); console.log(`delegated_reason=${reason}`);
          console.log(`binding_present=${!!(b.binding&&b.binding.tenantId&&b.binding.workspaceId)}`); console.log(`proof_present=${!!(b.bindingProof&&b.bindingProof.proof)}`);
          if(code!==200||!allowed){console.error(`::error title=delegated_probe::status=${code} reason=${reason} allowed=${allowed}`);process.exit(1)}
          NODE
