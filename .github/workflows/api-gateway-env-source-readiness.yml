name: API Gateway Env Source Readiness
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  readiness:
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 5
    env:
      API_GATEWAY_OPERATOR_KEY: ${{ secrets.API_GATEWAY_OPERATOR_KEY }}
    steps:
      - name: Inspect UniJuri live grants safely
        shell: bash
        run: |
          set -euo pipefail
          test -n "${API_GATEWAY_OPERATOR_KEY:-}"
          out="$(mktemp)"
          trap 'rm -f "$out"' EXIT
          status="$(curl -sS -o "$out" -w '%{http_code}' -H "Authorization: Bearer ${API_GATEWAY_OPERATOR_KEY}" -H 'Accept: application/json' 'https://gateway.apidevelopers.digital/api/operator/v1/saas/access-grants')"
          node - "$status" "$out" <<'NODE'
          const fs=require('fs');
          const [status,file]=process.argv.slice(2);
          let data=null; try{data=JSON.parse(fs.readFileSync(file,'utf8'))}catch{}
          const text=JSON.stringify(data??{});
          const evidence={status:Number(status),json:Boolean(data),mentionsUniJuri:text.includes('uni-juri'),mentionsSubject:text.includes('e65b5439faf65ea9905025751e6a33010df6551d99b225bf032e163492969ec8'),valuesExposed:false,mutationPerformed:false};
          console.log(`::notice title=unijuri_live_grants::${JSON.stringify(evidence)}`);
          if(Number(status)>=500)process.exit(1);
          NODE
