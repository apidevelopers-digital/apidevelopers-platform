name: Gateway Key Provisioner Secret Writer Diagnostic

on:
  workflow_dispatch:
    inputs:
      approval:
        description: "Exact Igor approval token for secret-writer diagnostic"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gateway-key-provisioner-secret-writer-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.event.inputs.approval == 'IGOR_APROVA_GATEWAY_KEY_PROVISIONER_SECRET_WRITER_DIAGNOSTIC'
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GH_SECRET_WRITER_TOKEN }}
      REPOSITORY: ${{ github.repository }}

    steps:
      - name: Check gh CLI
        shell: bash
        run: |
          set -euo pipefail
          printf 'GATEWAY_KEY_PROVISIONER_SECRET_WRITER_DIAG_GH_CLI_PRESENT=%s\n' "$(command -v gh >/dev/null 2>&1 && echo true || echo false)"
          command -v gh >/dev/null 2>&1

      - name: Check dedicated token presence
        shell: bash
        run: |
          set -euo pipefail
          printf 'GATEWAY_KEY_PROVISIONER_SECRET_WRITER_DIAG_DEDICATED_TOKEN_PRESENT=%s\n' "${GH_TOKEN:+true}"
          test -n "${GH_TOKEN:-}"

      - name: Check gh auth status
        shell: bash
        run: |
          set -euo pipefail
          gh auth status >/dev/null 2>&1
          printf 'GATEWAY_KEY_PROVISIONER_SECRET_WRITER_DIAG_GH_AUTH_STATUS=ok\n'

      - name: Check repository Actions secrets public key read
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${REPOSITORY}/actions/secrets/public-key" >/dev/null
          printf 'GATEWAY_KEY_PROVISIONER_SECRET_WRITER_DIAG_ACTIONS_SECRET_PUBLIC_KEY_READ=true\n'

      - name: Check repository Actions secret write
        shell: bash
        run: |
          set -euo pipefail
          marker="preflight-$(date -u +%Y%m%dT%H%M%S))"
          printf '%s' "$marker" | gh secret set GATEWAY_KEY_PROVISIONER_WRITE_PREFLIGHT --repo "$REPOSITORY" --body-file -
          printf 'GATEWAY_KEY_PROVISIONER_SECRET_WRITER_DIAG_SECRET_WRITE_PREFLIGHT=true\n'

      - name: Secret writer diagnostic ready
        shell: bash
        run: |
          printf 'GATEWAY_KEY_PROVISIONER_SECRET_WRITER_DIAG_RESULT=dedicated_secret_writer_ready\n'
