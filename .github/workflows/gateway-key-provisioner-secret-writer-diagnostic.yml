name: Gateway Key Provisioner Secret Writer Diagnostic

on:
  workflow_dispatch:
    inputs:
      approval:
        description: "Exact Igor approval token for secret-writer diagnostic"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gateway-key-provisioner-secret-writer-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.event.inputs.approval == 'IGOR_APROVA_GATEWAY_KEY_PROVISIONER_SECRET_WRITER_DIAGNOSTIC'
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GH_SECRET_WRITER_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      ORG: apidevelopers-digital
      REPO_NAME: apidevelopers-platform

    steps:
      - name: Check gh CLI
        shell: bash
        run: |
          set -euo pipefail
          printf 'GATEWAY_KEY_PROVISIONER_SECRET_WRITER_DIAG_GH_CLI_PRESENT=%s\n' "$(command -v gh >/dev/null 2>&1 && echo true || echo false)"
          command -v gh >/dev/null 2>&1

      - name: Check dedicated token presence
        shell: bash
        run: |
          set -euo pipefail
          printf 'GATEWAY_KEY_PROVISIONER_SECRET_WRITER_DIAG_DEDICATED_TOKEN_PRESENT=%s\n' "${GH_TOKEN:+true}"
          test -n "${GH_TOKEN:-}"

      - name: Check GitHub API user authentication
        shell: bash
        run: |
          set -euo pipefail
          gh api user --jq '.login' >/tmp/gh-user-login.txt
          printf 'GATEWAY_KEY_PROVISIONER_SECRET_WRITER_DIAG_GH_API_USER_AUTH=ok\n'
          printf 'GATEWAY_KEY_PROVISIONER_SECRET_WRITER_DIAG_GH_API_USER_LOGIN_PRESENT=true\n'

      - name: Check repository metadata access
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${REPOSITORY}" --jq '.full_name' >/tmp/gh-repo-full-name.txt
          printf 'GATEWAY_KEY_PROVISIONER_SECRET_WRITER_DIAG_REPOSITORY_ACCESS=true\n'

      - name: Check organization Actions secrets public key read
        shell: bash
        run: |
          set -euo pipefail
          gh api "orgs/${ORG}/actions/secrets/public-key" --jq '.key_id' >/tmp/gh-org-secret-public-key-id.txt
          printf 'GATEWAY_KEY_PROVISIONER_SECRET_WRITER_DIAG_ORG_ACTIONS_SECRET_PUBLIC_KEY_READ=true\n'

      - name: Check organization Actions secret write for selected repository
        shell: bash
        run: |
          set -euo pipefail
          marker="preflight-$(date -u +%Y%m%dT%H%M%SZ)"
          printf '%s' "$marker" | gh secret set GATEWAY_KEY_PROVISIONER_WRITE_PREFLIGHT --org "$ORG" --repos "$REPO_NAME" --body-file -
          printf 'GATEWAY_KEY_PROVISIONER_SECRET_WRITER_DIAG_ORG_SECRET_WRITE_PREFLIGHT=true\n'

      - name: Secret writer diagnostic ready
        shell: bash
        run: |
          printf 'GATEWAY_KEY_PROVISIONER_SECRET_WRITER_DIAG_RESULT=dedicated_org_secret_writer_ready\n'
