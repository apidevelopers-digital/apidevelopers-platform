name: Gateway Key Provisioner Secret Writer Diagnostic

on:
  workflow_dispatch:
    inputs:
      approval:
        description: "Exact Igor approval token for secret-writer diagnostic"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gateway-key-provisioner-secret-writer-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.event.inputs.approval == 'IGOR_APROVA_GATEWAY_KEY_PROVISIONER_SECRET_WRITER_DIAGNOSTIC'
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GH_SECRET_WRITER_TOKEN }}
      REPOSITORY: ${{ github.repository }}

    steps:
      - name: Diagnose dedicated GitHub secret writer capability without issuing gateway key
        shell: bash
        run: |
          set -euo pipefail
          emit() { printf 'GATEWAY_KEY_PROVISIONER_SECRET_WRITER_DIAG_%s=%s\n' "$1" "$2"; }
          safe() { printf '%s' "${1:-unmapped}" | head -c 180 | sed -E 's/[^a-zA-Z0-9_.:-]/_/g'; }

          emit "GH_CLI_PRESENT" "$(command -v gh >/dev/null 2>&1 && echo true || echo false)"
          if ! command -v gh >/dev/null 2>&1; then emit "FAILURE" "gh_cli_missing"; exit 1; fi

          emit "DEDICATED_TOKEN_PRESENT" "${GH_TOKEN:+true}"
          if [ -z "${GH_TOKEN:-}" ]; then emit "FAILURE" "missing_secret_GH_SECRET_WRITER_TOKEN"; exit 1; fi

          if gh auth status >/tmp/gh-auth-status.txt 2>&1; then
            emit "GH_AUTH_STATUS" "ok"
          else
            emit "GH_AUTH_STATUS" "failed"
            emit "GH_AUTH_ERROR" "$(safe "$(cat /tmp/gh-auth-status.txt)")"
            exit 1
          fi

          if gh api "repos/${REPOSITORY}/actions/secrets/public-key" >/tmp/gh-secret-public-key.json 2>/tmp/gh-secret-public-key.err; then
            emit "ACTIONS_SECRET_PUBLIC_KEY_READ" "true"
          else
            emit "ACTIONS_SECRET_PUBLIC_KEY_READ" "false"
            emit "ACTIONS_SECRET_PUBLIC_KEY_ERROR" "$(safe "$(cat /tmp/gh-secret-public-key.err)")"
            exit 1
          fi

          marker="preflight-$(date -u +%Y%m%dT%H%M%SZ)"
          if printf '%s' "$marker" | gh secret set GATEWAY_KEY_PROVISIONER_WRITE_PREFLIGHT --repo "$REPOSITORY" --body-file - >/tmp/gh-secret-set.out 2>/tmp/gh-secret-set.err; then
            emit "SECRET_WRITE_PREFLIGHT" "true"
          else
            emit "SECRET_WRITE_PREFLIGHT" "false"
            emit "SECRET_WRITE_PREFLIGHT_ERROR" "$(safe "$(cat /tmp/gh-secret-set.err; cat /tmp/gh-secret-set.out)")"
            exit 1
          fi

          emit "RESULT" "dedicated_secret_writer_ready"
