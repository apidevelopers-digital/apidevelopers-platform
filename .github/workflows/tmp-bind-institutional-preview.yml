name: Temporary bind institutional Conta uni preview

on:
  push:
    branches:
      - ada/gateway-bind-institutional-preview-v1

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on:
      - self-hosted
      - macOS
      - X64
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ada/gateway-bind-institutional-preview-v1
      - name: Apply audited institutional binding
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/web-agent-preview-login-composition.mjs")
          s = p.read_text()
          a = 'const effectiveTenantSlug = slug(tenantSlug, "institution-preview");'
          b = 'const effectiveTenantSlug = slug(tenantSlug, "apidevelopers-digital");'
          c = 'const effectiveDisplayName = text(displayName) || "Institution Preview";'
          d = 'const effectiveDisplayName = text(displayName) || "API Developers.digital Preview";'
          if s.count(a) != 1: raise SystemExit("tenant default not found exactly once")
          if s.count(c) != 1: raise SystemExit("display default not found exactly once")
          p.write_text(s.replace(a,b,1).replace(c,d,1))
          PY
          node --check src/web-agent-preview-login-composition.mjs
          git diff --check
      - name: Commit audited patch and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/tmp-bind-institutional-preview.yml
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "fix(gateway): bind Conta uni preview to institutional tenant"
          git push origin HEAD:ada/gateway-bind-institutional-preview-v1
