name: UniJuri Keychain Helper Install

on:
  workflow_dispatch:
    inputs:
      example:
        description: Exact governed approval token for privileged helper installation
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: unijuri-keychain-helper-install
  cancel-in-progress: false

jobs:
  install:
    runs-on: [self-hosted, macOS, X64, unijuri-keychain]
    timeout-minutes: 15
    steps:
      - name: Preflight dedicated Keychain runner
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RUNNER_NAME:-}" == "apidevelopers-mac-ci-05" ]] || { echo "::error::Wrong UniJuri Keychain runner"; exit 5; }

      - name: Validate explicit approval
        shell: bash
        env:
          APPROVAL: ${{ inputs.example }}
        run: |
          set -euo pipefail
          [[ "$APPROVAL" == "IGOR_APROVA_UNIJURI_KEYCHAIN_HELPER_INSTALL" ]] || { echo "::error::Invalid approval"; exit 2; }

      - name: Checkout approved revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve Xcode
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for candidate in /Applications/Xcode.app/Contents/Developer /Applications/Xcode*.app/Contents/Developer; do
            if [[ -d "$candidate/Platforms/MacOSX.platform" ]]; then
              echo "DEVELOPER_DIR=$candidate" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "::error::No full Xcode macOS SDK found"
          exit 1

      - name: Build native Keychain helper
        shell: bash
        run: |
          set -euo pipefail
          DEVELOPER_DIR="$DEVELOPER_DIR" xcrun swift build             --package-path apps/api-gateway/native/operator-keychain-helper             --configuration release             --product operator-keychain-helper             --jobs 2
          BIN="$(find apps/api-gateway/native/operator-keychain-helper/.build -type f -path '*/release/operator-keychain-helper' -perm -111 | head -n 1)"
          [[ -n "$BIN" && -x "$BIN" ]] || { echo "::error::Built helper executable not found"; exit 1; }
          echo "HELPER_BIN=$BIN" >> "$GITHUB_ENV"
          shasum -a 256 "$BIN" | awk '{print "BUILT_SHA256="$1}' >> "$GITHUB_ENV"

      - name: Preflight governed root bootstrap
        shell: bash
        run: |
          set -euo pipefail
          BOOTSTRAP="/usr/local/libexec/apidevelopers/unijuri-keychain-helper-installer"
          [[ -x "$BOOTSTRAP" ]] || {
            echo "::error title=UniJuri root bootstrap unavailable::requiredBootstrap=$BOOTSTRAP; writesPerformed=false"
            exit 3
          }
          META="$(/usr/bin/stat -f '%Su:%Sg:%Lp' "$BOOTSTRAP")"
          [[ "$META" == "root:wheel:755" ]] || {
            echo "::error title=UniJuri root bootstrap metadata mismatch::expected=root:wheel:755; actual=$META; writesPerformed=false"
            exit 3
          }
          set +e
          /usr/bin/sudo -n "$BOOTSTRAP" --preflight >/dev/null 2>&1
          sudo_rc=$?
          set -e
          [[ "$sudo_rc" -eq 0 ]] || {
            echo "::error title=UniJuri root bootstrap not authorized::sudoNonInteractive=false; writesPerformed=false"
            exit 3
          }
          echo "::notice title=UniJuri root bootstrap readiness::bootstrapPresent=true; bootstrapMetadata=root:wheel:755; sudoNonInteractive=true; writesPerformed=false"

      - name: Install helper through governed root bootstrap
        shell: bash
        run: |
          set -euo pipefail
          BOOTSTRAP="/usr/local/libexec/apidevelopers/unijuri-keychain-helper-installer"
          TARGET="/usr/local/libexec/apidevelopers/operator-keychain-helper"

          /usr/bin/sudo -n "$BOOTSTRAP"             --source "$HELPER_BIN"             --expected-sha256 "$BUILT_SHA256"

          [[ -x "$TARGET" ]] || { echo "::error::Installed helper is not executable"; exit 4; }
          INSTALLED_SHA256="$(shasum -a 256 "$TARGET" | awk '{print $1}')"
          [[ "$INSTALLED_SHA256" == "$BUILT_SHA256" ]] || { echo "::error::Installed helper hash mismatch"; exit 4; }

          META="$(/usr/bin/stat -f '%Su:%Sg:%Lp' "$TARGET")"
          [[ "$META" == "root:wheel:755" ]] || {
            echo "::error title=Installed helper metadata mismatch::expected=root:wheel:755; actual=$META"
            exit 6
          }

          echo "::notice title=UniJuri helper install::installed=true; target=$TARGET; sha256=$INSTALLED_SHA256; ownerGroupMode=$META"

      - name: Verify executable
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/local/libexec/apidevelopers/operator-keychain-helper
          echo "::notice title=UniJuri helper readiness::helperExecutable=present-executable"
