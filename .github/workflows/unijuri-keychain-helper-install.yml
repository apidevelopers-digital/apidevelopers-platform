name: UniJuri Keychain Helper Install

on:
  workflow_dispatch:
    inputs:
      example:
        description: Exact governed approval token for privileged helper installation
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: unijuri-keychain-helper-install
  cancel-in-progress: false

jobs:
  install:
    runs-on: [self-hosted, macOS, X64, unijuri-keychain]
    timeout-minutes: 15
    steps:
      - name: Preflight dedicated Keychain runner
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RUNNER_NAME:-}" == "apidevelopers-mac-ci-05" ]] || { echo "::error::Wrong UniJuri Keychain runner"; exit 5; }

      - name: Validate explicit approval
        shell: bash
        env:
          APPROVAL: ${{ inputs.example }}
        run: |
          set -euo pipefail
          [[ "$APPROVAL" == "IGOR_APROVA_UNIJURI_KEYCHAIN_HELPER_INSTALL" ]] || { echo "::error::Invalid approval"; exit 2; }

      - name: Checkout approved revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve Xcode
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for candidate in /Applications/Xcode.app/Contents/Developer /Applications/Xcode*.app/Contents/Developer; do
            if [[ -d "$candidate/Platforms/MacOSX.platform" ]]; then
              echo "DEVELOPER_DIR=$candidate" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "::error::No full Xcode macOS SDK found"
          exit 1

      - name: Build native Keychain helper
        shell: bash
        run: |
          set -euo pipefail
          DEVELOPER_DIR="$DEVELOPER_DIR" xcrun swift build             --package-path apps/api-gateway/native/operator-keychain-helper             --configuration release             --product operator-keychain-helper             --jobs 2
          BIN="$(find apps/api-gateway/native/operator-keychain-helper/.build -type f -path '*/release/operator-keychain-helper' -perm -111 | head -n 1)"
          [[ -n "$BIN" && -x "$BIN" ]] || { echo "::error::Built helper executable not found"; exit 1; }
          echo "HELPER_BIN=$BIN" >> "$GITHUB_ENV"
          shasum -a 256 "$BIN" | awk '{print "BUILT_SHA256="$1}' >> "$GITHUB_ENV"

      - name: Preflight interactive privileged install
        shell: bash
        run: |
          set -euo pipefail
          runner_user="$(id -un)"
          console_user="$(/usr/bin/stat -f '%Su' /dev/console 2>/dev/null || true)"
          [[ -n "$console_user" && "$console_user" == "$runner_user" ]] || { echo "::error::Runner user must own active macOS console"; exit 3; }
          [[ -x /usr/bin/osascript ]] || { echo "::error::osascript unavailable"; exit 3; }
          [[ -x "$HELPER_BIN" ]] || exit 1
          echo "::notice title=Interactive privilege readiness::consoleUserMatchesRunner=true; osascriptExecutable=true"

      - name: Install helper with local macOS administrator prompt
        shell: bash
        run: |
          set -euo pipefail
          TARGET_DIR="/usr/local/libexec/apidevelopers"
          TARGET="$TARGET_DIR/operator-keychain-helper"
          ERR_FILE="$(mktemp -t unijuri-helper-install.XXXXXX)"
          cleanup() {
            rm -f "$ERR_FILE"
          }
          trap cleanup EXIT

          set +e
          /usr/bin/osascript - "$HELPER_BIN" "$TARGET_DIR" "$TARGET" 2>"$ERR_FILE" <<'APPLESCRIPT'
          on run argv
            set helperBin to item 1 of argv
            set targetDir to item 2 of argv
            set targetPath to item 3 of argv
            set commandText to "/usr/bin/install -d -o root -g wheel -m 0755 " & quoted form of targetDir & " && /usr/bin/install -o root -g wheel -m 0755 " & quoted form of helperBin & " " & quoted form of targetPath
            do shell script commandText with administrator privileges
          end run
          APPLESCRIPT
          osascript_rc=$?
          set -e

          if [[ "$osascript_rc" -ne 0 ]]; then
            error_category="osascript-error"
            if grep -Eqi 'user canceled|\(-128\)' "$ERR_FILE"; then
              error_category="user-canceled"
            elif grep -Eqi 'not authorized|authorization denied|not permitted|privilege violation|administrator privileges' "$ERR_FILE"; then
              error_category="authorization-denied"
            elif grep -Eqi 'execution error|script error' "$ERR_FILE"; then
              error_category="applescript-execution-error"
            fi

            target_dir_present=false
            helper_present=false
            helper_executable=false
            helper_matches_built_hash=false

            [[ -d "$TARGET_DIR" ]] && target_dir_present=true
            [[ -e "$TARGET" ]] && helper_present=true
            [[ -x "$TARGET" ]] && helper_executable=true

            if [[ -f "$TARGET" ]]; then
              installed_hash="$(shasum -a 256 "$TARGET" | awk '{print $1}')"
              [[ "$installed_hash" == "$BUILT_SHA256" ]] && helper_matches_built_hash=true
            fi

            echo "::error title=UniJuri helper install failed::osascriptExitCode=$osascript_rc; category=$error_category; targetDirPresentAfterFailure=$target_dir_present; helperPresentAfterFailure=$helper_present; helperExecutableAfterFailure=$helper_executable; helperMatchesBuiltHashAfterFailure=$helper_matches_built_hash"
            exit "$osascript_rc"
          fi

          INSTALLED_SHA256="$(shasum -a 256 "$TARGET" | awk '{print $1}')"
          [[ "$INSTALLED_SHA256" == "$BUILT_SHA256" ]] || { echo "::error::Installed helper hash mismatch"; exit 4; }

          META="$(/usr/bin/stat -f '%Su:%Sg:%Lp' "$TARGET")"
          [[ "$META" == "root:wheel:755" ]] || { echo "::error title=Installed helper metadata mismatch::expected=root:wheel:755; actual=$META"; exit 6; }

          echo "::notice title=UniJuri helper install::installed=true; target=$TARGET; sha256=$INSTALLED_SHA256; ownerGroupMode=$META"

      - name: Verify executable
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/local/libexec/apidevelopers/operator-keychain-helper
          echo "::notice title=UniJuri helper readiness::helperExecutable=present-executable"
