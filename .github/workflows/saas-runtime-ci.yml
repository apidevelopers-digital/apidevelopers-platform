name: SaaS Runtime CI

on:
  pull_request:
    paths:
      - "packages/saas-runtime/**"
      - "packages/contracts/src/saas-*.mjs"
      - "packages/persistence-core/**"
      - ".github/workflows/saas-runtime-ci.yml"
  push:
    branches: [main]
    paths:
      - "packages/saas-runtime/**"
      - "packages/contracts/src/saas-*.mjs"
      - "packages/persistence-core/**"
      - ".github/workflows/saas-runtime-ci.yml"

jobs:
  saas-runtime:
    name: SaaS runtime gate
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check SaaS runtime
        working-directory: packages/saas-runtime
        shell: bash
        run: |
          set +e
          npm run check 2>&1 | tee /tmp/saas-runtime-check.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            module_error="(grep -Eim 1 'Cannot find (module|package)|ERR_MODULE_NOT_FOUND' /tmp/saas-runtime-check.log | tr '\n\r' '  ' | sed 's/%/%25/g')"
            message="$(tail -n 60 /tmp/saas-runtime-check.log | tr '\n\r' '  ' | sed 's/%/%25/g')"
            echo "::error title=SaaS runtime module error::${module_error:-no module line captured}"
            echo "::error title=SaaS runtime failure::$message"
            exit "$status"
          fi
