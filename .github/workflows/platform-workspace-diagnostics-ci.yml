name: Platform Workspace Diagnostics

on:
  push:
    paths:
      - "scripts/diagnose-workspace-tests.mjs"
      - ".github/workflows/platform-workspace-diagnostics-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspaces
        id: install
        continue-on-error: true
        run: |
          mkdir -p diagnostics
          set +e
          npm install > diagnostics/npm-install-r4.log 2>&1
          status=$?
          set -e
          printf "\nexit_code=%s\n" "$status" >> diagnostics/npm-install-r4.log
          exit "$status"

      - name: Diagnose workspaces
        id: diagnose
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          node scripts/diagnose-workspace-tests.mjs --report=diagnostics/workspace-tests-r4.json > diagnostics/workspace-diagnostics-r4.log 2>&1
          status=$?
          set -e
          printf "\nexit_code=%s\n" "$status" >> diagnostics/workspace-diagnostics-r4.log
          exit "$status"

      - name: Persist reports
        if: always() && github.ref_type == 'branch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f diagnostics/npm-install-r4.log
          git add -f diagnostics/workspace-diagnostics-r4.log
          if [ -f diagnostics/workspace-tests-r4.json ]; then git add -f diagnostics/workspace-tests-r4.json; fi
          git commit -m "chor(diagnostics): record install and test logs [skip ci]"
          git push origin "HEAD:${GITHUB_REF#refs/heads/}"

      - name: Fail after report
        if: steps.install.outcome == 'failure' || steps.diagnose.outcome == 'failure'
        run: exit 1
