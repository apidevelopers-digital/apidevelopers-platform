# CI segmentada, somente leitura, sem release ou deploy.
name: Portal Projector CI

on:
  push:
    paths:
      - "packages/portal-projector/**"
      - ".github/workflows/portal-projector-ci.yml"
  pull_request:
    paths:
      - "packages/portal-projector/**"
      - ".github/workflows/portal-projector-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-projector-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run portal-projector tests
        working-directory: packages/portal-projector
        shell: bash
        run: |
          set -o pipefail
          node --test --test-reporter=tap 2>&1 | tee /tmp/portal-projector-tests.tap
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            summary=$(tail -n 40 /tmp/portal-projector-tests.tap | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error title=Portal Projector tests failed::$summary"
            exit "$status"
          fi
