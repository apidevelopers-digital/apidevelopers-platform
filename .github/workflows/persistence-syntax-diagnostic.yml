name: Persistence Syntax Diagnostic

on:
  push:
    branches:
      - "foundation/diagnostic-persistence-core-20260720"
    paths:
      - "packages/persistence-core/**"
      - ".github/workflows/persistence-syntax-diagnostic.yml"

permissions:
  contents: read

concurrency:
  group: persistence-syntax-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: check-${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: model
            file: packages/persistence-core/src/model.mjs
          - label: transaction-context
            file: packages/persistence-core/src/transaction-context.mjs
          - label: file-store
            file: packages/persistence-core/src/file-store.mjs
          - label: repository
            file: packages/persistence-core/src/repository.mjs
          - label: index
            file: packages/persistence-core/src/index.mjs
          - label: tests
            file: packages/persistence-core/test/index.test.mjs
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check ${{ matrix.label }}
        run: |
          node --version
          node --check "${{ matrix.file }}"
