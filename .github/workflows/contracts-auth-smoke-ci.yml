name: Contracts Auth Smoke CI

on:
  push:
    branches:
      - "foundation/**"
    paths:
      - "packages/contracts/**"
      - ".github/workflows/contracts-auth-smoke-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check auth contract syntax
        run: node --check packages/contracts/src/auth-context.mjs
