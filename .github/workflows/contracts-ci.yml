name: Contracts CI

on:
  pull_request:
    paths:
      - "packages/contracts/**"
      - ".github/workflows/contracts-ci.yml"
  push:
    branches:
      - main
    paths:
      - "packages/contracts/**"
      - ".github/workflows/contracts-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contracts-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts gate
    runs-on:
      group: organization-macos-ci
      labels: [self-hosted, macOS, X64]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Runtime versions
        run: |
          node --version
          npm --version

      - name: Validate contracts
        run: npm run check
