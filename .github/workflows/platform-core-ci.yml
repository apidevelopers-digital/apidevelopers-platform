name: Platform Core CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "foundation/**"
    paths:
      - "packages/platform-core/**"
      - "apps/api-gateway/src/app.mjs"
      - "apps/api-gateway/src/server.mjs"
      - ".github/workflows/platform-core-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "packages/platform-core/**"
      - "apps/api-gateway/src/app.mjs"
      - "apps/api-gateway/src/server.mjs"
      - ".github/workflows/platform-core-ci.yml"

permissions:
  contents: read

concurrency:
  group: platform-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check platform-core
        run: npm --prefix packages/platform-core run check
      - name: Link Gateway Core workspaces
        shell: bash
        run: |
          set -euo pipefail
          scope_dir="$GITHUB_WORKSPACE/node_modules/@apidevelopers"
          mkdir -p "$scope_dir"
          for package in registry-core platform-core auth-core apikey-core; do
            source_dir="$GITHUB_WORKSPACE/packages/$package"
            target="$scope_dir/$package"
            test -f "$source_dir/package.json"
            rm -rf "$target"
            ln -s "$source_dir" "$target"
            test -f "$target/package.json"
          done
      - name: Check Gateway integration
        run: npm --workspace @apidevelopers/api-gateway run check
