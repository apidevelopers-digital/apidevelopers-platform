name: Site Factory Hostinger Datacenter API Evidence

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-evidence:
    name: Publish Hostinger datacenter evidence through GitHub API
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 15

    steps:
      - name: Assert dispatch is anchored to main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"

      - name: Checkout exact source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Site Factory
        working-directory: apps/site-factory
        run: |
          npm install --no-audit --no-fund
          npm run check

      - name: Prepare sanitized preflight path
        shell: bash
        run: |
          set -euo pipefail
          echo "PREFLIGHT_OUTPUT_PATH=$RUNNER_TEMP/hostinger-business-preview-preflight.json" >> "$GITHUB_ENV"

      - name: Assert required Hostinger secrets are available
        shell: bash
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          HOSTINGER_HOSTING_ORDER_ID: ${{ secrets.HOSTINGER_AGENCY_ORDER_ID }}
        run: |
          set -euo pipefail
          test -n "$HOSTINGER_API_TOKEN"
          test -n "$HOSTINGER_HOSTING_ORDER_ID"

      - name: Run live Hostinger Business API read-only preflight
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          HOSTINGER_HOSTING_ORDER_ID: ${{ secrets.HOSTINGER_AGENCY_ORDER_ID }}
        run: node apps/site-factory/src/run-hostinger-agency-preflight.mjs

      - name: Publish sanitized evidence through GitHub REST API
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node apps/site-factory/src/run-publish-hostinger-datacenter-evidence.mjs
