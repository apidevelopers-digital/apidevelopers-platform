name: Kernel Governance CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "foundation/**"
    paths:
      - "packages/kernel-governance/**"
      - "packages/contracts/**"
      - "tests/integration/kernel-evolution-governance-contracts.test.mjs"
      - "tests/integration/kernel-evolution-governance-wrapper.mjs"
      - "tests/integration/cleanup-cognitive-links.mjs"
      - ".github/workflows/kernel-governance-ci.yml"
  pull_request:
    paths:
      - "packages/kernel-governance/**"
      - "packages/contracts/**"
      - "tests/integration/kernel-evolution-governance-contracts.test.mjs"
      - "tests/integration/kernel-evolution-governance-wrapper.mjs"
      - "tests/integration/cleanup-cognitive-links.mjs"
      - ".github/workflows/kernel-governance-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
     - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check contract
        run: node --check packages/contracts/src/evolution-governance.mjs
      - name: Test contract
        run: node --test packages/contracts/test/evolution-governance.test.mjs
