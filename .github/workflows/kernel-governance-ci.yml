name: Kernel Governance CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "foundation/**"
    paths:
      - "packages/kernel-governance/**"
      - "packages/contracts/**"
      - "tests/integration/kernel-evolution-governance-contracts.test.mjs"
      - "tests/integration/kernel-evolution-governance-wrapper.mjs"
      - "tests/integration/cleanup-cognitive-links.mjs"
      - ".github/workflows/kernel-governance-ci.yml"
  pull_request:
    paths:
      - "packages/kernel-governance/**"
      - "packages/contracts/**"
      - "tests/integration/kernel-evolution-governance-contracts.test.mjs"
      - "tests/integration/kernel-evolution-governance-wrapper.mjs"
      - "tests/integration/cleanup-cognitive-links.mjs"
      - ".github/workflows/kernel-governance-ci.yml"

permissions:
  contents: read

concurrency:
  group: kernel-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check syntax
        run: |
          node --check packages/kernel-governance/src/index.mjs
          node --check packages/kernel-governance/src/governed.mjs
          node --check packages/contracts/src/evolution-governance.mjs
          node --check tests/integration/kernel-evolution-governance-contracts.test.mjs
          node --check tests/integration/kernel-evolution-governance-wrapper.mjs
      - name: Test contracts
        run: npm --prefix packages/contracts test
      - name: Test kernel-governance
        run: npm --prefix packages/kernel-governance test
      - name: Test evolution-governance integration
        run: node --test tests/integration/kernel-evolution-governance-wrapper.mjs
