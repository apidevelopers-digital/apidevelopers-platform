name: MCP API bootstrap rebuild

on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: "Literal confirmation. Required: IGOR_APROVA_R4_MCP_API_BOOTSTRAP_REBUILD"
        required: true
        type: string
      dry_run:
        description: "Plan only when true. Real rebuild when false with confirmation."
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

concurrency:
  group: mcp-api-bootstrap-rebuild
  cancel-in-progress: false

jobs:
  bootstrap-rebuild:
    name: MCP API bootstrap rebuild
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 30

    env:
      CONFIRMACAO: ${{ github.event.inputs.confirmacao }}
      DRY_RUN: ${{ github.event.inputs.dry_run }}
      MCP_VPS_IPV4: "179.236.235.179"

    steps:
      - name: Guardrails
        shell: bash
        run: |
          set -euo pipefail
          echo "dry_run=${DRY_RUN}"
          echo "confirmacao=[redacted]"

          if [ "$CONFIRMACAO" != "IGOR_APROVA_R4_MCP_API_BOOTSTRAP_REBUILD" ]; then
            echo "::error::Invalid confirmation."
            exit 1
          fi

          if [ -z "${{ secrets.MCP_VPS_SSH_USER }}" ]; then
            echo "::error::Missing secret MCP_VPS_SSH_USER."
            exit 1
          fi

          if [ -z "${{ secrets.MCP_VPS_SSH_KEY }}" ]; then
            echo "::error::Missing secret MCP_VPS_SSH_KEY."
            exit 1
          fi

      - name: Print plan dry-run
        if: ${{ env.DRY_RUN == 'true' }}
        shell: bash
        run: |
          cat <<'EOF'
          PLAN ONLY:

          Target host: fixed IPv4 target for the registered VPS
          Target user: secret MCP_VPS_SSH_USER not printed

          Action:
            1. Write temporary SSH key from repository secret
            2. Derive public key/fingerprint locally without printing private key
            3. SSH IPv4 diagnostic probe using explicit -i identity and IdentitiesOnly=yes
            4. Remote compose config with required env-files
            5. docker compose build --no-cache mcp-api
            6. stop/rm existing fixed-name mcp-api container if present
            7. docker compose up -d --no-deps mcp-api
            8. post-check public /health and /mcp/tools with retry

          Env files used remotely:
            /opt/api-dev-brain/config/mcp-runtime.env
            /opt/api-dev-brain/config/mcp-secrets.env
            /opt/api-dev-brain/config/reels-upload.env
            /opt/api-dev-brain/config/materializador-auth.env

          No PostgreSQL restart.
          No DNS change.
          No frontend change.
          No clinical write enablement.
          EOF

      - name: Install temporary SSH key and print safe fingerprint
        if: ${{ env.DRY_RUN == 'false' }}
        shell: bash
        run: |
          set -euo pipefail

          SSH_DIR="${RUNNER_TEMP:-/tmp}/mcp-ssh"
          SSH_KEY_PATH="${SSH_DIR}/mcp_vps_key"
          rm -rf "$SSH_DIR"
          mkdir -p "$SSH_DIR"
          chmod 700 "$SSH_DIR"

          cat > "$SSH_KEY_PATH" <<'KEY'
          ${{ secrets.MCP_VPS_SSH_KEY }}
          KEY

          # Remove YAML/heredoc indentation, normalize CRLF, and trim blank lines.
          perl -0pi -e 's/\r\n/\n/g; s/^\s+(?=-----BEGIN OPENSSH PRIVATE KEY-----)//; s/\n\s+(?=[A-Za-z0-9+\/=]{10,}|-----END OPENSSH PRIVATE KEY-----)/\n/g; s/^\n+//; s/\n+\z/\n/' "$SSH_KEY_PATH"
          chmod 600 "$SSH_KEY_PATH"

          echo "SSH key file path: [redacted]"
          echo "SSH key byte count: $(wc -c < "$SSH_KEY_PATH")"
          echo "SSH key first line: $(head -1 "$SSH_KEY_PATH" | sed 's/./*/g')"
          echo "SSH key last line: $(tail -1 "$SSH_KEY_PATH" | sed 's/./*/g')"

          if ! grep -q -- '^-----BEGIN OPENSSH PRIVATE KEY-----$' "$SSH_KEY_PATH"; then
            echo "::error::Secret MCP_VPS_SSH_KEY does not start with a valid OPENSSH private key header."
            exit 1
          fi

          if ! tail -1 "$SSH_KEY_PATH" | grep -q -- '^-----END OPENSSH PRIVATE KEY-----$'; then
            echo "::error::Secret MCP_VPS_SSH_KEY does not end with a valid OPENSSH private key footer."
            exit 1
          fi

          if ! ssh-keygen -y -f "$SSH_KEY_PATH" > "${SSH_KEY_PATH}.pub" 2>"${SSH_KEY_PATH}.keygen.err"; then
            echo "::error::ssh-keygen could not derive a public key from MCP_VPS_SSH_KEY."
            sed -E 's/[A-Za-z0-9+\/=]{20,}/[redacted]/g' "${SSH_KEY_PATH}.keygen.err" || true
            exit 1
          fi

          echo "Derived public key fingerprint from GitHub secret:"
          ssh-keygen -lf "${SSH_KEY_PATH}.pub" -E sha256

          {
            echo "SSH_KEY_PATH=$SSH_KEY_PATH"
            echo "SSH_DIR=$SSH_DIR"
          } >> "$GITHUB_ENV"

      - name: SSH diagnostic probe
        if: ${{ env.DRY_RUN == 'false' }}
        shell: bash
        run: |
          set -euo pipefail

          SSH_HOST="$MCP_VPS_IPV4"
          SSH_USER="${{ secrets.MCP_VPS_SSH_USER }}"

          if [ -z "${SSH_KEY_PATH:-}" ] || [ ! -f "$SSH_KEY_PATH" ]; then
            echo "::error::SSH_KEY_PATH is missing or not a file."
            exit 1
          fi

          echo "Using explicit SSH identity file: [redacted]"
          ssh-keygen -lf "${SSH_KEY_PATH}.pub" -E sha256

          SSH_OPTS=(
            -4
            -vvv
            -F /dev/null
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=3
            -o StrictHostKeyChecking=accept-new
            -i "$SSH_KEY_PATH"
          )

          LOG_FILE="${RUNNER_TEMP:-/tmp}/mcp-ssh-probe.log"
          set +e
          ssh "${SSH_OPTS[@]}" "${SSH_USER}@${SSH_HOST}" 'echo ssh_ok ; hostname ; whoami' >"$LOG_FILE" 2>&1
          STATUS=$?
          set -e

          sed -E \
            -e 's#'"$SSH_KEY_PATH"'#[ssh-key-path]#g' \
            -e 's/(identity file ).*/\1[redacted]/g' \
            -e 's/(Offering public key: ).*/\1[redacted]/g' \
            -e 's/[A-Za-z0-9+\/=]{80,}/[base64-redacted]/g' \
            "$LOG_FILE"

          if [ "$STATUS" -ne 0 ]; then
            echo "::error::SSH diagnostic probe failed with exit code ${STATUS}."
            exit "$STATUS"
          fi

      - name: Rebuild and healthcheck mcp-api
        if: ${{ env.DRY_RUN == 'false' }}
        shell: bash
        run: |
          set -euo pipefail

          SSH_HOST="$MCP_VPS_IPV4"
          SSH_USER="${{ secrets.MCP_VPS_SSH_USER }}"

          if [ -z "${SSH_KEY_PATH:-}" ] || [ ! -f "$SSH_KEY_PATH" ]; then
            echo "::error::SSH_KEY_PATH is missing or not a file."
            exit 1
          fi

          SSH_OPTS=(
            -4
            -F /dev/null
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=3
            -o StrictHostKeyChecking=accept-new
            -i "$SSH_KEY_PATH"
          )

          echo "1. Remote docker preflight..."
          ssh "${SSH_OPTS[@]}" "${SSH_USER}@${SSH_HOST}" 'docker --version ; docker compose version ; test -d /opt/api-dev-brain/apps/mcp-brain-v1 ; test -f /opt/api-dev-brain/apps/mcp-brain-v1/docker-compose.yml'

          echo "2. Rebuild and recreate mcp-api via remote SSH..."
          ssh "${SSH_OPTS[@]}" "${SSH_USER}@${SSH_HOST}" 'bash -s' <<'REMOTE'
            set -euo pipefail

            cd /opt/api-dev-brain/apps/mcp-brain-v1

            ENV_FILES=(
              --env-file /opt/api-dev-brain/config/mcp-runtime.env
              --env-file /opt/api-dev-brain/config/mcp-secrets.env
              --env-file /opt/api-dev-brain/config/reels-upload.env
              --env-file /opt/api-dev-brain/config/materializador-auth.env
            )

            echo "2.1 Compose config preflight..."
            docker compose "${ENV_FILES[@]}" config >/tmp/mcp-compose-check.yml

            echo "2.2 Build no-cache mcp-api..."
            docker compose "${ENV_FILES[@]}" build --no-cache mcp-api

            echo "2.3 Stop and remove fixed-name mcp-api container if present..."
            if docker ps -a --format '{{.Names}}' | grep -qx 'mcp-api'; then
              docker stop mcp-api || true
              docker rm mcp-api || true
            fi

            echo "2.4 Start mcp-api..."
            docker compose "${ENV_FILES[@]}" up -d --no-deps mcp-api

            echo "2.5 Container status..."
            docker ps --filter name=mcp-api

            echo "2.6 Verify image contains Juri DataJud bridge markers..."
            docker exec mcp-api sh -lc 'grep -n "juri.datajud.request" /app/app/main.py | head -5'
          REMOTE

          retry_check() {
            local name="$1"
            local cmd="$2"
            local attempts="${3:-30}"
            local sleep_seconds="${4:-5}"

            echo "$name..."
            for i in $(seq 1 "$attempts"); do
              if bash -lc "$cmd"; then
                echo "$name OK on attempt $i/$attempts"
                return 0
              fi
              echo "$name not ready yet ($i/$attempts). Sleeping ${sleep_seconds}s..."
              sleep "$sleep_seconds"
            done

            echo "::error::$name failed after ${attempts} attempts."
            return 1
          }

          retry_check "2.7 Public health" \
            "curl -fsS https://mcp.apidevelopers.digital/health | grep -F '\"ok\":true'" \
            36 5

          retry_check "2.8 Public tool catalog marker" \
            "curl -fsS 'https://mcp.apidevelopers.digital/mcp/tools?full=true' | grep -F 'juri.datajud.request'" \
            24 5

          echo "MCP API bootstrap rebuild complete."
