name: MCP API bootstrap rebuild

on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: "Literal confirmation. Required: IGOR_APROVA_R4_MCP_API_BOOTSTRAP_REBUILD"
        required: true
        type: string
      dry_run:
        description: "Plan only when true. Real rebuild when false with confirmation."
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

concurrency:
  group: mcp-api-bootstrap-rebuild
  cancel-in-progress: false

jobs:
  bootstrap-rebuild:
    name: MCP API bootstrap rebuild
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 30

    env:
      CONFIRMACAO: ${{ github.event.inputs.confirmacao }}
      DRY_RUN: ${{ github.event.inputs.dry_run }}
      MCP_VPS_IPV4: "179.236.235.179"

    steps:
      - name: Guardrails
        shell: bash
        run: |
          set -euo pipefail
          echo "dry_run=${DRY_RUN}"
          echo "confirmacao=[redacted]"

          if [ "$CONFIRMACAO" != "IGOR_APROVA_R4_MCP_API_BOOTSTRAP_REBUILD" ]; then
            echo "::error::Invalid confirmation."
            exit 1
          fi

          if [ -z "${{ secrets.MCP_VPS_SSH_USER }}" ]; then
            echo "::error::Missing secret MCP_VPS_SSH_USER."
            exit 1
          fi

          if [ -z "${{ secrets.MCP_VPS_SSH_KEY }}" ]; then
            echo "::error::Missing secret MCP_VPS_SSH_KEY."
            exit 1
          fi

      - name: Print plan dry-run
        if: ${{ env.DRY_RUN == 'true' }}
        shell: bash
        run: |
          cat <<'EOF'
          PLAN ONLY:

          Target host: fixed IPv4 target for the registered VPS
          Target user: secret MCP_VPS_SSH_USER not printed
          Action:
            1. SSH IPv4 probe
            2. Remote compose config with required env-files
            3. docker compose build --no-cache mcp-api
            4. stop/rm existing fixed-name mcp-api container if present
            5. docker compose up -d --no-deps mcp-api
            6. post-check public /health and public /mcp/tools

          Env files used remotely:
            /opt/api-dev-brain/config/mcp-runtime.env
            /opt/api-dev-brain/config/mcp-secrets.env
            /opt/api-dev-brain/config/reels-upload.env
            /opt/api-dev-brain/config/materializador-auth.env

          No PostgreSQL restart.
          No DNS change.
          No frontend change.
          No clinical write enablement.
          EOF

      - name: Install temporary SSH key
        if: ${{ env.DRY_RUN == 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          SSH_DIR="${RUNNER_TEMP}/mcp-ssh"
          SSH_KEY_PATH="${SSH_DIR}/mcp_vps_key"
          mkdir -p "$SSH_DIR"
          chmod 700 "$SSH_DIR"
          trap 'rm -rf "$SSH_DIR"' EXIT

          cat > "$SSH_KEY_PATH" <<'KEY'
          ${{ secrets.MCP_VPS_SSH_KEY }}
          KEY
          chmod 600 "$SSH_KEY_PATH"
          echo "SSH_KEY_PATH=$SSH_KEY_PATH" >> "$GITHUB_ENV"

      - name: Rebuild and healthcheck mcp-api
        if: ${{ env.DRY_RUN == 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          SSH_HOST="$MCP_VPS_IPV4"
          SSH_USER="${{ secrets.MCP_VPS_SSH_USER }}"

          SSH_OPTS=(
            -4
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=3
            -o StrictHostKeyChecking=accept-new
            -i "$SSH_KEY_PATH"
          )

          echo "1. SSH IPv4 probe..."
          ssh "${SSH_OPTS[@]}" "${SSH_USER}@${SSH_HOST}" 'echo ssh_ok ; hostname ; whoami'

          echo "2. Remote docker preflight..."
          ssh "${SSH_OPTS[@]}" "${SSH_USER}@${SSH_HOST}" 'docker --version ; docker compose version ; test -d /opt/api-dev-brain/apps/mcp-brain-v1 ; test -f /opt/api-dev-brain/apps/mcp-brain-v1/docker-compose.yml'

          echo "3. Rebuild and recreate mcp-api via remote SSH..."
          ssh "${SSH_OPTS[@]}" "${SSH_USER}@${SSH_HOST}" 'bash -s' <<'REMOTE'
            set -euo pipefail

            cd /opt/api-dev-brain/apps/mcp-brain-v1

            ENV_FILES=(
              --env-file /opt/api-dev-brain/config/mcp-runtime.env
              --env-file /opt/api-dev-brain/config/mcp-secrets.env
              --env-file /opt/api-dev-brain/config/reels-upload.env
              --env-file /opt/api-dev-brain/config/materializador-auth.env
            )

            echo "3.1 Compose config preflight..."
            docker compose "${ENV_FILES[@]}" config >/tmp/mcp-compose-check.yml

            echo "3.2 Build no-cache mcp-api..."
            docker compose "${ENV_FILES[@]}" build --no-cache mcp-api

            echo "3.3 Stop and remove fixed-name mcp-api container if present..."
            if docker ps -a --format '{{.Names}}' | grep -qx 'mcp-api'; then
              docker stop mcp-api || true
              docker rm mcp-api || true
            fi

            echo "3.4 Start mcp-api..."
            docker compose "${ENV_FILES[@]}" up -d --no-deps mcp-api

            echo "3.5 Container status..."
            docker ps --filter name=mcp-api

            echo "3.6 Verify image contains Juri DataJud bridge markers..."
            docker exec mcp-api sh -lc 'grep -n "juri.datajud.request" /app/app/main.py | head -5'

            echo "3.7 Public health..."
            curl -fsS https://mcp.apidevelopers.digital/health | grep -F '"ok":true'

            echo "3.8 Public tool catalog..."
            curl -fsS "https://mcp.apidevelopers.digital/mcp/tools?full=true" | grep -F "juri.datajud.request"

            echo "MCP API bootstrap rebuild complete."
          REMOTE
