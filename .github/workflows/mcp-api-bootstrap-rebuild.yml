name: MCP API bootstrap rebuild

on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: "Literal confirmation. Required: IGOR_APROVA_R4_MCP_API_BOOTSTRAP_REBUILD"
        required: true
        type: string
      dry_run:
        description: "Plan only when true. Real rebuild when false with confirmation."
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

concurrency:
  group: mcp-api-bootstrap-rebuild
  cancel-in-progress: false

jobs:
  bootstrap-rebuild:
    name: MCP API bootstrap rebuild
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 25

    env:
      CONFIRMACAO: ${{ github.event.inputs.confirmacao }}
      DRY_RUN: ${{ github.event.inputs.dry_run }}
      MCP_VPS_IPv4: "179.236.235.179"

    steps:
      - name: Guardrails
        shell: bash
        run: |
          set -euo pipefail
          echo "dry_run=${DRY_RUN}"
          echo "confirmacao=[redacted]"


          if [ "$CONFIRMACAO" != "IGOR_APROVA_R4_MCP_API_BOOTSTRAP_REBUILD" ]; then
            echo "::error::Invalid confirmation."
            exit 1
          fi

          if [ -z "${{ secrets.MCP_VPS_SSH_HOST }}" ]; then
            echo "::error::Missing secret MCP_VPS_SSH_HOST."
            exit 1
          fi

          if [ -z "${{ secrets.MCP_VPS_SSH_USER }}" ]; then
            echo "::error::Missing secret MCP_VPS_SSH_USER."
            exit 1
          fi

          if [ -z "${{ secrets.MCP_VPS_SSH_KEY }}" ]; then
            echo "::error::Missing secret MCP_VPS_SSH_KEY."
            exit 1
          fi

      - name: Print plan dry-run
        if: ${{ env.DRY_RUN == 'true' }}
        shell: bash
        run: |
          cat <<'EOF'
          PLAN ONLY:

          Target host: secret MCP_VPS_SSH_HOST not printed
         Normalized SSH target: forced IPv4 to registered VPS IP
          Target user: secret MCP_VPS_SSH_USER not printed
          Action: cd /opt/api-dev-brain/apps/mcp-brain-v1 && docker compose build --no-cache mcp-api && docker compose up -d --force-recreate --no-deps mcp-api
          Post-check: ssh probe, docker exec mcp-api docker --version, public health, public tool catalog

          No PostgreS restart.
          No DNS change.
          No clinical write enablement.
          EOF

      - name: Install temporary SSH key
        if: ${{ env.DRY_RUN == 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          SSH_DIR="${RUNNER_TEMP}/mcp-ssh"
          SSH_KEY_PATH="{SSH_DIR}/mcp_vps_key"
          SSH_KEY_PATH="${SSH_DIR}/mcp_vps_key"
          mkdir -p "$SSH_DIR"
          chmod 700 "$SSH_DIR"
          trap 'rm -rf "$SSH_DIR"' EXIT

          cat > "$SSH_KEY_PATH" <<'KEY'
          ${{ secrets.MCP_VPS_SSH_KEY }}
          KEY
          chmod 600 "$SSH_KEY_PATH"
          echo "SSH_KEY_PATH=$SSH_KEY_PATH" >> "$GITHUB_ENV"

      - name: Rebuild and healthcheck mcp-api
        if: ${{ env.DRY_RUN == 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          SSH_HOST="$MCP_VPS_IPv4"
          SSH_USER="${{ secrets.MCP_VPS_SSH_USER }}"

          echo "1. SSH ipv4 probe..."
          ssh -4 -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new -i "$SSH_KEY_PATH" "$SSH_USER@$SSH_HOST" 'echo ssh_ok ; hostname ; whoami'

          echo "2. Remote docker preflight..."
          ssh -4 -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new -i "$SSH_KEY_PATH" "$SSH_USER@$SSH_HOST" 'docker --version ; docker compose version'

          echo "3. Rebuilding via remote ssh..."
          ssh -4 -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new -i "$SSH_KEY_PATH" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
            set -euo pipefail
            cd /opt/api-dev-brain/apps/mcp-brain-v1

            echo "1. Forcing no-cache build of mcp-api..."
            docker compose build --no-cache mcp-api

            echo "2. Recreating mcp-api only..."
            docker compose up -d --force-recreate --no-deps mcp-api

            echo "3. Containers..."
            docker ps

            echo "4. Verify Docker CLI inside mcp-api..."
            docker exec mcp-api docker --version

            echo "5. Public health..."
            curl -fs https://mcp.apidevelopers.digital/health | grep -F "ok"

            echo "6. Public tool catalog..."
            curl -fs https://mcp.apidevelopers.digital/mcp/tools | grep -F "imuni.practitioner.upsert_IGOR_REAL"

            echo "MCP API bootstrap rebuild complete."
          REMOTE
