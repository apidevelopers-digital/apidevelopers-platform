name: API Gateway MVP CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "foundation/**"
    paths:
      - "apps/api-gateway/**"
      - "apps/developer-portal/**"
      - "packages/registry-core/**"
      - "packages/platform-core/**"
      - "packages/auth-core/**"
      - "packages/apikey-core/**"
      - "docs/mvp/API_PLATFORM_MVP.md"
      - "docs/REANCORAGEM_MVP_FASE2_PLATFORM_CORE.md"
      - "package.json"
      - ".github/workflows/api-gateway-mvp-ci.yml"
  pull_request:
    paths:
      - "apps/api-gateway/**"
      - "apps/developer-portal/**"
      - "packages/registry-core/**"
      - "packages/platform-core/**"
      - "packages/auth-core/**"
      - "packages/apikey-core/**"
      - "docs/mvp/API_PLATFORM_MVP.md"
      - "docs/REANCORAGEM_MVP_FASE2_PLATFORM_CORE.md"
      - "package.json"
      - ".github/workflows/api-gateway-mvp-ci.yml"

permissions:
  contents: read

concurrency:
  group: api-gateway-mvp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install workspace links
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Check Platform Core packages
        run: |
          npm --workspace @apidevelopers/registry-core run check
          npm --workspace @apidevelopers/platform-core run check
          npm --workspace @apidevelopers/auth-core run check
          npm --workspace @apidevelopers/apikey-core run check
      - name: Check API gateway
        run: npm --workspace @apidevelopers/api-gateway run check
      - name: Check developer portal
        run: npm --prefix apps/developer-portal run check
      - name: Validate no committed API keys
        run: |
          if grep -RInE 'apid_[A-Za-z0-9_-]{20,}' apps packages docs --exclude='*.test.mjs'; then
            echo "Potential API key committed"
            exit 1
          fi
