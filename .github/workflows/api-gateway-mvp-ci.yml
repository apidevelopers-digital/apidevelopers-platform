name: API Gateway MVP CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "foundation/**"
    paths:
      - "apps/api-gateway/**"
      - "package.json"
      - ".github/workflows/api-gateway-mvp-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/api-gateway/**"
      - "package.json"
      - ".github/workflows/api-gateway-mvp-ci.yml"

permissions:
  contents: read

concurrency:
  group: api-gateway-mvp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Link Gateway Core workspaces
        shell: bash
        run: |
          set -euo pipefail
          scope_dir="$GITHUB_WORKSPACE/node_modules/@apidevelopers"
          mkdir -p "$scope_dir"
          for package in registry-core platform-core auth-core apikey-core; do
            source_dir="$GITHUB_WORKSPACE/packages/$package"
            target="$scope_dir/$package"
            test -f "$source_dir/package.json"
            rm -rf "$target"
            ln -s "$source_dir" "$target"
            test -f "$target/package.json"
          done
      - name: Check API Gateway
        run: npm --workspace @apidevelopers/api-gateway run check
      - name: Validate no committed API keys
        run: |
          if grep -RInE 'apid_[A-Za-z0-9_-]{20,}' apps/api-gateway --exclude='*.test.mjs'; then
            echo "Potential API key committed"
            exit 1
          fi
