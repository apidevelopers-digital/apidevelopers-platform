name: API Gateway MVP CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "foundation/**"
    paths:
      - "apps/api-gateway/**"
      - "package.json"
      - ".github/workflows/api-gateway-mvp-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/api-gateway/**"
      - "package.json"
      - ".github/workflows/api-gateway-mvp-ci.yml"

permissions:
  contents: read

concurrency:
  group: api-gateway-mvp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Link Gateway Core workspaces
        run: |
          mkdir -p node_modules/@apidevelopers
          ln -s ../../packages/registry-core node_modules/@apidevelopers/registry-core
          ln -s ../../packages/platform-core node_modules/@apidevelopers/platform-core
          ln -s ../../packages/auth-core node_modules/@apidevelopers/auth-core
          ln -s ../../packages/apikey-core node_modules/@apidevelopers/apikey-core
      - name: Check API Gateway
        run: npm --workspace @apidevelopers/api-gateway run check
      - name: Validate no committed API keys
        run: |
          if grep -RInE 'apid_[A-Za-z0-9_-]{20,}' apps/api-gateway --exclude='*.test.mjs'; then
            echo "Potential API key committed"
            exit 1
          fi
