name: ADA Asset Engine dry-run

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/asset-engine/**'
      - 'packages/asset-engine/**'
      - 'apps/asset-api/**'
      - 'apps/asset-worker/**'
      - 'media/catalogs/**'
      - 'media/sources/**'
      - 'templates/asset-engine/**'
      - 'scripts/asset-engine-*.mjs'

permissions:
  contents: read

jobs:
  hiddenarquives-greys-dry-run:
    runs-on:
      - self-hosted
      - macOS
      - X64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Hidden Arquives Greys dry-run manifest
        run: node scripts/asset-engine-dry-run-greys.mjs

      - name: Render Hidden Arquives Greys dry-run HTML
        run: node scripts/asset-engine-render-greys.mjs

      - name: Verify dry-run outputs
        run: |
          test -f artifacts/asset-engine/dry-run/hiddenarquives-greys-dry-run-manifest.json
          test -f artifacts/asset-engine/dry-run/hiddenarquives-greys-index.html
          if grep -q 'ha-https://' artifacts/asset-engine/dry-run/hiddenarquives-greys-index.html; then
            echo "Rendered HTML contains broken ha-https URL."
            exit 1
          fi

      - name: Upload dry-run artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hiddenarquives-greys-asset-engine-dry-run
          path: |
            artifacts/asset-engine/dry-run/hiddenarquives-greys-dry-run-manifest.json
            artifacts/asset-engine/dry-run/hiddenarquives-greys-index.html
