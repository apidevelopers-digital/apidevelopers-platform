name: Uni.co Staging Node Build Bridge

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uni-co-staging-node-build-bridge
  cancel-in-progress: false

jobs:
  execute-staging-node-build:
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 20
    env:
      SSH_USER: u242521810
      SSH_HOST: 147.79.84.117
      STAGING_ROOT: /home/u242521810/domains/sitedauni.com/public_html/apps/uni-co-staging
      SOURCE_SHA: 81f94c57dbc3445dae65e3c6a76d4d11329e3f6c
      HOSTINGER_USERNAME: u242521810
      HOSTINGER_DOMAIN: unico-staging.sitedauni.com
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Confirm institutional Hostinger credential
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$HOSTINGER_API_TOKEN"

      - name: Discover institutional staging SSH#identity
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_KEY="$(find /Users -maxdepth 8 -type f -path '*/.ssh/uni_janela_staging' -print -quit 2>/dev/null || true)"
          KNOWN_HOSTS="$(find /Users -maxdepth 8 -type f \( -path '*/.ssh/known_hosts' -o -path '*/.ssh/known_hosts_uni_janela' \) -size +0c -print -quit 2>/dev/null || true)"
          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"
          test "$(stat -f '%Lp' "$SSH_KEY")" = "600"
          echo "SSH_KEY=$SSH_KEY" >> "$GITHUB_ENV"
          echo "SSH_KNOWN_HOSTS=$KNOWN_HOSTS" >> "$GITHUB_ENV"

      - name: Resolve authorized SSH transport
        shell: bash
        run: |
          set -Eeuo pipefail
          SELECTED_PORT=""
          for port in 65002 22; do
            if nc -z -w 3 "$SSH_HOST" "$port" >/dev/null 2>&1; then
              if ssh -i "$SSH_KEY" -p "$port" \
                -o BatchMode=yes \
                -o ConnectTimeout=5 \
                -o StrictHostKeyChecking=yes \
                -o UserKnownHostsFile="$SSH_KNOWN_HOSTS" \
                "$SSH_USER@$SSH_HOST" \
                "test -f '$STAGING_ROOT/uni-co-runtime-$SOURCE_SHA.zip' && printf ready" 2>/dev/null | grep -qx ready; then
                SELECTED_PORT="$port"
                break
              fi
            fi
          done
          test -n "$SELECTED_PORT"
          echo "SSH_PORT=$SELECTED_PORT" >> "$GITHUB_ENV"

      - name: Download exact sanitized staging archive
        shell: bash
        run: |
          set -Eeuo pipefail
          ARCHIVE_PATH="$RUNNER_TEMP/uni-co-runtime-$SOURCE_SHA.zip"
          SCP_OPTS=(-i "$SSH_KEY" -P "$SSH_PORT" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_KNOWN_HOSTS")
          scp "${SCP_OPTS[@]}" "$SSH_USER@$SSH_HOST:$STAGING_ROOT/uni-co-runtime-$SOURCE_SHA.zip" "$ARCHIVE_PATH"
          test -s "$ARCHIVE_PATH"
          test "$(stat -f '%z' "$ARCHIVE_PATH")" -le 52428800
          SSH_OPTS=(-i "$SSH_KEY" -p "$SSH_PORT" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_KNOWN_HOSTS")
          REMOTE_SHA="$(ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" "sha256sum '$STAGING_ROOT/uni-co-runtime-$SOURCE_SHA.zip' | awk '{print \$1}'")"
          LOCAL_SHA="$(shasum -a 256 "$ARCHIVE_PATH" | awk '{print $1}')"
          test "$REMOTE_SHA" = "$LOCAL_SHA"
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"

      - name: Attempt Hostinger Node build from archive
        id: hostinger_build
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { createNodeBuildFromArchive, sanitizeEvidence } from "./apps/site-factory/src/hostinger-node-build-api-only.mjs";

          const out = process.env.GITHUB_OUTPUT;
          try {
            const result = await createNodeBuildFromArchive({
              token: process.env.HOSTINGER_API_TOKEN,
              username: process.env.HOSTINGER_USERNAME,
              domain: process.env.HOSTINGER_DOMAIN,
              archivePath: process.env.ARCHIVE_PATH,
              transport: "multipart",
              nodeVersion: 22,
              appType: "express",
              entryFile: "server.js",
              packageManager: "npm",
            });
            fs.appendFileSync(out, `ok=true\nstatus=${result.response?.status ?? 0}\nuuid=${result.uuid}\nstate=${result.state}\n`);
          } catch (error) {
            const evidence = sanitizeEvidence(error?.evidence ?? { message: error?.message ?? String(error) }, process.env.HOSTINGER_API_TOKEN);
            const status = evidence?.response?.status ?? evidence?.status ?? 0;
            const payload = evidence?.response?.payload ?? evidence?.payload ?? {};
            const message = payload?.message ?? error?.message ?? "unknown";
            const normalized = String(message).replaceAll("\n", " ").slice(0, 180);
            fs.appendFileSync(out, `ok=false\nstatus=${status}\nmessage=${normalized}\n`);
          }
          NODE

      - name: Hostinger build accepted
        if: steps.hostinger_build.outputs.ok == 'true'
        shell: bash
        run: |
          echo "hostinger_build_created=true" >> "$GITHUB_STEP_SUMMARY"
          echo "build_uuid=${{ steps.hostinger_build.outputs.uuid }}" >> "$GITHUB_STEP_SUMMARY"
          echo "initial_state=${{ steps.hostinger_build.outputs.state }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnostic - Hostinger authentication rejected
        if: steps.hostinger_build.outputs.ok == 'false' && (steps.hostinger_build.outputs.status == '401' || steps.hostinger_build.outputs.status == '403')
        run: echo "classified=authentication_or_scope" >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnostic - Hostinger staging website not found
        if: steps.hostinger_build.outputs.ok == 'false' && steps.hostinger_build.outputs.status == '404'
        run: echo "classified=staging_website_not_found" >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnostic - Hostinger archive or build payload rejected
        if: steps.hostinger_build.outputs.ok == 'false' && steps.hostinger_build.outputs.status == '422'
        run: echo "classified=archive_or_build_payload_rejected" >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnostic - Hostinger rate limited
        if: steps.hostinger_build.outputs.ok == 'false' && steps.hostinger_build.outputs.status == '429'
        run: echo "classified=rate_limited" >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnostic - Hostinger server error
        if: steps.hostinger_build.outputs.ok == 'false' && startsWith(steps.hostinger_build.outputs.status, '5')
        run: echo "classified=hostinger_server_error" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if Hostinger build was not accepted
        if: steps.hostinger_build.outputs.ok != 'true'
        shell: bash
        run: |
          echo "hostinger_status=${{ steps.hostinger_build.outputs.status }}" >> "$GITHUB_STEP_SUMMARY"

          exit 1
