name: Uni.co Staging Node Build Bridge

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uni-co-staging-node-build-bridge
  cancel-in-progress: false

jobs:
  execute-staging-node-build:
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 20
    env:
      SSH_USER: u242521810
      SSH_HOST: 147.79.84.117
      STAGING_ROOT: /home/u242521810/domains/sitedauni.com/public_html/apps/uni-co-staging
      SOURCE_SHA: c316a3171a76a0f4c824e62bc0ee8ae87e10150e
      HOSTINGER_USERNAME: u242521810
      HOSTINGER_DOMAIN: unico-staging.sitedauni.com
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Confirm institutional Hostinger credential
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$HOSTINGER_API_TOKEN"
          echo "hostinger_api_credential_available=true" >> "$GITHUB_STEP_SUMMARY"

      - name: Discover institutional staging SSH identity
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_KEY="$(find /Users -maxdepth 8 -type f -path '*/.ssh/uni_janela_staging' -print -quit 2>/dev/null || true)"
          KNOWN_HOSTS="$(find /Users -maxdepth 8 -type f \( -path '*/.ssh/known_hosts' -o -path '*/.ssh/known_hosts_uni_janela' \) -size +0c -print -quit 2>/dev/null || true)"
          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"
          test "$(stat -f '%Lp' "$SSH_KEY")" = "600"
          echo "SSH_KEY=$SSH_KEY" >> "$GITHUB_ENV"
          echo "SSH_KNOWN_HOSTS=$KNOWN_HOSTS" >> "$GITHUB_ENV"

      - name: Resolve authorized SSH transport
        shell: bash
        run: |
          set -Eeuo pipefail
          SELECTED_PORT=""
          for port in 65002 22; do
            if nc -z -w 3 "$SSH_HOST" "$port" >/dev/null 2>&1; then
              if ssh -i "$SSH_KEY" -p "$port" \
                -o BatchMode=yes \
                -o ConnectTimeout=5 \
                -o StrictHostKeyChecking=yes \
                -o UserKnownHostsFile="$SSH_KNOWN_HOSTS" \
                "$SSH_USER@$SSH_HOST" \
                "test -f '$STAGING_ROOT/uni-co-runtime-$SOURCE_SHA.zip' && printf ready" 2>/dev/null | grep -qx ready; then
                SELECTED_PORT="$port"
                break
              fi
            fi
          done
          test -n "$SELECTED_PORT"
          echo "SSH_PORT=$SELECTED_PORT" >> "$GITHUB_ENV"

      - name: Download exact sanitized staging archive
        shell: bash
        run: |
          set -Eeuo pipefail
          ARCHIVE_PATH="$RUNNER_TEMP/uni-co-runtime-$SOURCE_SHA.zip"
          SCP_OPTS=(-i "$SSH_KEY" -P "$SSH_PORT" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_KNOWN_HOSTS")
          scp "${SCP_OPTS[@]}" "$SSH_USER@$SSH_HOST:$STAGING_ROOT/uni-co-runtime-$SOURCE_SHA.zip" "$ARCHIVE_PATH"
          test -s "$ARCHIVE_PATH"
          test "$(stat -f '%z' "$ARCHIVE_PATH")" -le 52428800
          SSH_OPTS=(-i "$SSH_KEY" -p "$SSH_PORT" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_KNOWN_HOSTS")
          REMOTE_SHA="$(ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" "sha256sum '$STAGING_ROOT/uni-co-runtime-$SOURCE_SHA.zip' | awk '{print \$1}'")"
          LOCAL_SHA="$(shasum -a 256 "$ARCHIVE_PATH" | awk '{print $1}')"
          test "$REMOTE_SHA" = "$LOCAL_SHA"
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"
          echo "archive_transport_verified=true" >> "$GITHUB_STEP_SUMMARY"

      - name: Create Hostinger Node build from archive
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { createNodeBuildFromArchive, sanitizeEvidence } from "./apps/site-factory/src/hostinger-node-build-api-only.mjs";

          try {
            const result = await createNodeBuildFromArchive({
              token: process.env.HOSTINGER_API_TOKEN,j              username: process.env.HOSTINGER_USERNAME,
              domain: process.env.HOSTINGER_DOMAIN,
              archivePath: process.env.ARCHIVE_PATH,
              transport: "multipart",
              nodeVersion: 22,
              appType: "express",
              entryFile: "server.js",
              packageManager: "npm",
            });

            const safe = {
              ok: true,
              uuid: result.uuid,
              state: result.state,
              responseStatus: result.response?.status ?? null,
            };
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "```json\n" + JSON.stringify(safe, null, 2) + "\n```\n");
            console.log(JSON.stringify(safe));
          } catch (error) {
            const evidence = sanitizeEvidence(
              error?.evidence ?? { message: error?.message ?? String(error) },
              process.env.HOSTINGER_API_TOKEN,
            );
            const safe = { ok: false, evidence };
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "```json\n" + JSON.stringify(safe, null, 2) + "\n```\n");
            console.error(JSON.stringify(safe));
            process.exit(1);
          }
          NODE
