name: SaaS Billing Mercado Pago Auth Probe

on:
  workflow_dispatch:
    inputs:
      expected_test_user_id:
        description: "Mercado Pago test user ID expected for account binding"
        required: true
        type: string
      confirmation:
        description: "Type TESTE_READ_ONLY_MERCADO_PAGO to allow the read-only probe"
        required: true
        type: string

permissions:
  contents: read

jobs:
  mercadopago_auth_probe:
    name: Mercado Pago credential read-only probe
    if: ${{ inputs.confirmation == 'TESTE_READ_ONLY_MERCADO_PAGO' }}
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate read-only regression tests
        shell: bash
        run: node --test packages/saas-billing/test/mercadopago-auth-probe.test.mjs

      - name: Run authenticated read-only probe
        shell: bash
        env:
          APD_BILLING_MODE: test
          APD_BILLING_LIVE_ENABLED: "false"
          MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
          MP_EXPECTED_TEST_USER_ID: ${{ inputs.expected_test_user_id }}
        run: |
          set -euo pipefail
          test -n "${MP_ACCESS_TOKEN:-}"
          test -n "${MP_EXPECTED_TEST_USER_ID:-}"
          node scripts/mercadopago-auth-probe.mjs
