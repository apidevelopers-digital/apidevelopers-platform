name: Site Factory CI
on:
  push:
    branches: [main, "feat/site-factory-*", "ops/site-factory-*"]
    paths: ["apps/site-factory/**", "packages/hostinger-adapter/**", "packages/uni-operator-hostinger-adapter/**", "packages/wordpress-adapter/**", ".github/workflows/site-factory-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["apps/site-factory/**", "packages/hostinger-adapter/**", "packages/uni-operator-hostinger-adapter/**", "packages/wordpress-adapter/**", ".github/workflows/site-factory-ci.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on:
      group: organization-macos-ci
      labels: [self-hosted, macOS, X64]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test Hostinger read-only adapter
        run: npm run check --prefix packages/hostinger-adapter
      - name: Test uni. Operador Hostinger bridge adapter
        run: npm run check --prefix packages/uni-operator-hostinger-adapter
      - name: Test WordPress read-only adapter
        run: npm run check --prefix packages/wordpress-adapter
      - name: Install local Site Factory dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --prefix apps/site-factory
      - name: Validate Site Factory
        shell: bash
        run: |
          set +e
          log="$RUNNER_TEMP/site-factory-validation.log"
          npm run check --prefix apps/site-factory > "$log" 2>&1
          result=$?
          if [ "$result" -ne 0 ]; then
            echo "Site Factory validation failed; extracting failure diagnostics."
            grep -n -B 3 -A 14 -E '^not ok |^# (fail|error)|ERR_|Error:|error:' "$log" | head -n 110 || true
            tail -n 30 "$log"
            excerpt="$( { grep -n -B 2 -A 10 -E '^not ok |^# (fail|error)|ERR_|Error:|error:' "$log" | head -n 80; tail -n 15 "$log"; } | head -c 5500 )"
            excerpt="${excerpt//'%'/'%25'}"
            excerpt="${excerpt//$'\r'/'%0D'}"
            excerpt="${excerpt//$'\n'/'%0A'}"
            printf '::error title=Site Factory validation failure::%s\n' "$excerpt"
          else
            tail -n 15 "$log"
          fi
          exit "$result"
      - name: Generate manifest-only dry-run report
        run: |
          node apps/site-factory/src/cli.mjs \
            --manifest apps/site-factory/manifests/apidevelopers-institution.json \
            --manifest-only \
            --output "$RUNNER_TEMP/site-factory-manifest-report.json"
      - name: Upload dry-run report
        uses: actions/upload-artifact@v4
        with:
          name: site-factory-manifest-${{ github.sha }}
          path: ${{ runner.temp }}/site-factory-manifest-report.json
          if-no-files-found: error
          retention-days: 7
