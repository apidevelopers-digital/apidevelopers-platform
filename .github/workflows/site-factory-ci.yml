name: Site Factory CI

on:
  push:
    branches:
      - "feat/site-factory-*"
    paths:
      - "apps/site-factory/**"
      - "packages/uni-operator-hostinger-adapter/**"
      - ".github/workflows/site-factory-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-app:
    runs-on:
      group: organization-macos-ci
      labels: [self-hosted, macOS, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit --no-fund --prefix apps/site-factory
      - run: npm run check --prefix apps/site-factory
