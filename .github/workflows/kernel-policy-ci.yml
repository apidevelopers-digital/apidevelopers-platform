name: Kernel Policy CI

on:
  pull_request:
    paths:
      - "packages/kernel-policy/**"
      - "packages/contracts/**"
      - ".github/workflows/kernel-policy-ci.yml"
  push:
    branches: [main]
    paths:
      - "packages/kernel-policy/**"
      - "packages/contracts/**"
      - ".github/workflows/kernel-policy-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-policy-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Kernel Policy gate
    runs-on:
      group: organization-macos-ci
      labels: [self-hosted, macOS, X64]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/kernel-policy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install local dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Diagnose syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            echo "checking syntax: $file"
            node --check "$file"
          done < <(find src test -type f -name '*.mjs' | sort)
      - name: Validate kernel policy
        shell: bash
        run: |
          set -euo pipefail
          npm run check | tee kernel-policy-gate.log
          grep -Fq "KERNEL_POLICY_GATE_OK" kernel-policy-gate.log
