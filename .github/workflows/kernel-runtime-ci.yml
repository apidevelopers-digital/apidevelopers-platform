name: Kernel Runtime CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "foundation/**"
    paths:
      - "packages/kernel-runtime/**"
      - "packages/kernel-policy/**"
      - "packages/contracts/**"
      - "tests/integration/kernel-policy-runtime-contracts.test.mjs"
      - "tests/integration/kernel-policy-runtime-wrapper.mjs"
      - "tests/integration/cleanup-cognitive-links.mjs"
      - ".github/workflows/kernel-runtime-ci.yml"
  pull_request:
    paths:
      - "packages/kernel-runtime/**"
      - "packages/kernel-policy/**"
      - "packages/contracts/**"
      - "tests/integration/kernel-policy-runtime-contracts.test.mjs"
      - "tests/integration/kernel-policy-runtime-wrapper.mjs"
      - "tests/integration/cleanup-cognitive-links.mjs"
      - ".github/workflows/kernel-runtime-ci.yml"

permissions:
  contents: read

concurrency:
  group: kernel-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check syntax
        run: |
          node --check packages/kernel-runtime/src/index.mjs
          node --check packages/kernel-runtime/src/governed.mjs
          node --check packages/contracts/src/policy-runtime.mjs
          node --check tests/integration/kernel-policy-runtime-contracts.test.mjs
          node --check tests/integration/kernel-policy-runtime-wrapper.mjs

      - name: Test contracts
        run: npm --prefix packages/contracts test

      - name: Test kernel-runtime
        run: npm --prefix packages/kernel-runtime test

      - name: Test policy-runtime integration
        run: node --test tests/integration/kernel-policy-runtime-wrapper.mjs
