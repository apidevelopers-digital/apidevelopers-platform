name: API Gateway Managed Hosting Package CI

on:
  pull_request:
    paths:
      - "apps/api-gateway/**"
      - ".github/workflows/api-gateway-managed-hosting-package-ci.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build, adapt and verify managed runtime
        shell: bash
        run: |
          set -euo pipefail
          node apps/api-gateway/scripts/build-managed-hosting-artifact.mjs
          node apps/api-gateway/scripts/apply-hostinger-fixed-entry-compat.mjs
          node apps/api-gateway/scripts/verify-managed-hosting-artifact.mjs

      - name: Build package evidence
        shell: bash
        run: |
          set -euo pipefail
          artifact="apps/api-gateway/dist/api-gateway-managed"
          zip_path="$RUNNER_TEMP/api-gateway-runtime-$GITHUB_SHA.zip"
          rm -f "$zip_path"
          (
            cd "$artifact"
            /usr/bin/zip -X -q -r "$zip_path" . -x ".DS_Store" "__MACOSX/*"
          )
          /usr/bin/unzip -t "$zip_path" >/dev/null
          sha256="$(shasum -a 256 "$zip_path" | awk '{print $1}')"
          bytes="$(stat -f '%z' "$zip_path")"
          manifest_sha256="$(shasum -a 256 "$artifact/release-manifest.json" | awk '{print $1}')"
          evidence="$RUNNER_TEMP/api-gateway-runtime-evidence.json"
          node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const evidence = {
              sourceRevision: process.env.GITHUB_SHA,
              zipSha256: process.argv[2],
              zipBytes: Number(process.argv[3]),
              releaseManifestSha256: process.argv[4],
              manifestSourceRevision: manifest.sourceRevision ?? null,
              entrypoint: "src/operational-server.mjs",
              promoted: false
            };
            fs.writeFileSync(process.argv[5], JSON.stringify(evidence, null, 2) + "\n");
          ' "$artifact/release-manifest.json" "$sha256" "$bytes" "$manifest_sha256" "$evidence"
          echo "RUNTIME_ZIP=$zip_path" >> "$GITHUB_ENV"
          echo "RUNTIME_EVIDENCE=$evidence" >> "$GITHUB_ENV"
          echo "ZIP_SHA256=$sha256" >> "$GITHUB_ENV"
          echo "ZIP_BYTES=$bytes" >> "$GITHUB_ENV"
          echo "MANIFEST_SHA256=$manifest_sha256" >> "$GITHUB_ENV"

      - name: Show package evidence
        shell: bash
        run: |
          set -euo pipefail
          cat "$RUNTIME_EVIDENCE"

      - name: Publish package evidence summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Managed Hosting package evidence"
            echo
            echo "- sourceRevision: \`$GITHUB_SHA\"
            echo "- zipSha256: \`$ZIP_SHA256\`"
            echo "- zipBytes: \`$ZIP_BYTES\`"
            echo "- releaseManifestSha256: \`$MANIFEST_SHA256\`"
            echo "- entrypoint: \`src/operational-server.mjs\`"
            echo "- promoted: \`false\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload package evidence only
        uses: actions/upload-artifact@v4
        with:
          name: api-gateway-managed-hosting-package-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ env.RUNTIME_ZIP }}
            ${{ env.RUNTIME_EVIDENCE }}
          if-no-files-found: error
          retention-days: 7
