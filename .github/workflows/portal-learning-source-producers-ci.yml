name: Portal Learning Capability Validation Producer CI

on:
  push:
    branches:
      - "work/portal-learning-integrated-cycle-*"
    paths:
      - "capabilities/**"
      - "contracts/**"
      - "policies/**"
      - "scripts/check-capability-registry.mjs"
      - ".github/workflows/portal-learning-source-producers-ci.yml"
  pull_request:
    paths:
      - "capabilities/**"
      - "contracts/**"
      - "policies/**"
      - "scripts/check-capability-registry.mjs"
      - ".github/workflows/portal-learning-source-producers-ci.yml"

permissions:
  contents: read

jobs:
  validate-capabilities:
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
     - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate capability validation
        shell: bash
        run: |
          set +e
          node scripts/check-capability-registry.mjs
          validation_exit=$?
          set -e
          test -s generated/capabilities.validation.json
          echo "capability_validation_exit=$validation_exit"
