name: Portal Learning Capability Validation Producer CI

on:
  push:
    branches:
      - "work/portal-learning-integrated-cycle-*"
    paths:
      - "scripts/check-capability-registry.mjs"
      - ".github/workflows/portal-learning-source-producers-ci.yml"
  pull_request:
    paths:
      - "scripts/check-capability-registry.mjs"
      - ".github/workflows/portal-learning-source-producers-ci.yml"

permissions:
  contents: read

jobs:
  validate-capabilities:
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate capability validation
        run: node scripts/check-capability-registry.mjs || test -s generated/capabilities.validation.json
      - name: Verify capability validation artifact
        run: test -s generated/capabilities.validation.json
