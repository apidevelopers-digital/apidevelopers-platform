name: Web Agent Shadow Persistence Providers CI

on:
  push:
    branches:
      - "feat/web-agent-shadow-persistence-providers-20260815"
    paths:
      - "apps/api-gateway/src/web-agent-shadow-persistence-providers.mjs"
      - "apps/api-gateway/test/web-agent-shadow-persistence-providers.test.mjs"
      - ".github/workflows/web-agent-shadow-persistence-providers-ci.yml"
  pull_request:
    paths:
      - "apps/api-gateway/src/web-agent-shadow-persistence-providers.mjs"
      - "apps/api-gateway/test/web-agent-shadow-persistence-providers.test.mjs"
      - ".github/workflows/web-agent-shadow-persistence-providers-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/api-gateway
    steps:
      - uses: "actions/checkout\u0040v4"
      - uses: "actions/setup-node\u0040v4"
        with:
          node-version: "22"

      - name: Link persistence core
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p node_modules/@apidevelopers
          rm -rf node_modules/@apidevelopers/persistence-core
          ln -s "$GITHUB_WORKSPACE/packages/persistence-core" node_modules/@apidevelopers/persistence-core
          test -e node_modules/@apidevelopers/persistence-core/src/index.mjs

      - name: Syntax
        run: |
          node --check src/web-agent-shadow-persistence-providers.mjs
          node --check test/web-agent-shadow-persistence-providers.test.mjs

      - name: Import graph
        run: node -e "import('./src/web-agent-shadow-persistence-providers.mjs').then(() => console.log('import_ok'))"

      - name: Contract
        run: node --test test/web-agent-shadow-persistence-providers.test.mjs
