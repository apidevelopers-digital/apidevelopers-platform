name: ADA Create API_STORAGE Root

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "MCP Brain job id"
        required: true
        type: string
      tenant:
        description: "Tenant requesting the job"
        required: true
        type: choice
        options:
          - apidevelopers-digital
      expected_hostname:
        description: "Expected hostname/local host name"
        required: true
        type: string
      expected_user:
        description: "Expected macOS user"
        required: true
        type: string
      root:
        description: "Storage root path"
        required: true
        type: string
      backend_initial_limit_gb:
        description: "Initial conservative backend capacity limit"
        required: true
        type: string
      hard_stop_free_space_gb:
        description: "Hard stop if technical free space is below this value"
        required: true
        type: string

permissions:
  contents: write

env:
  AUDIT_BRANCH: audit/storage-create

concurrency:
  group: ada-create-api-storage-${{ inputs.job_id }}-${{ inputs.expected_hostname }}
  cancel-in-progress: false

jobs:
  create:
    name: Create API_STORAGE root
    runs-on:
      - self-hosted
      - macOS
      - X64
      - apidevelopers
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Validate target and inputs
        shell: bash
        run: |
          set -euo pipefail

          test "${{ inputs.tenant }}" = "apidevelopers-digital"
          test "${{ inputs.expected_user }}" = "uniimporteexport"
          test "${{ inputs.expected_hostname }}" = "Homosapi-iMac.local"
          test "${{ inputs.root }}" = "/Users/uniimporteexport/API_STORAGE"

          actual_hostname="$(hostname || true)"
          actual_computer="$(scutil --get ComputerName 2>/dev/null || true)"
          actual_local="$(scutil --get LocalHostName 2>/dev/null || true)"
          actual_user="$(whoami)"

          echo "job_id=${{ inputs.job_id }}"
          echo "expected_hostname=${{ inputs.expected_hostname }}"
          echo "expected_user=${{ inputs.expected_user }}"
          echo "actual_hostname=$actual_hostname"
          echo "actual_computer=$actual_computer"
          echo "actual_local=$actual_local"
          echo "actual_user=$actual_user"
          echo "runner_name=${{ runner.name }}"

          if [ "$actual_user" != "${{ inputs.expected_user }}" ]; then
            echo "Wrong user. Expected ${{ inputs.expected_user }}, got $actual_user"
            exit 42
          fi

          case "${{ inputs.expected_hostname }}" in
            "$actual_hostname"|"$actual_computer"|"$actual_local")
              echo "Host validated."
              ;;
            *)
              echo "Wrong host. Expected ${{ inputs.expected_hostname }}, got hostname=$actual_hostname computer=$actual_computer local=$actual_local"
              exit 43
              ;;
          esac

          min_free_gb="${{ inputs.hard_stop_free_space_gb }}"
          available_kb="$(df -Pk /Users/uniimporteexport | awk 'NR==2 {print $4}')"
          available_gib="$(( available_kb / 1024 / 1024 ))"

          echo "available_gib=$available_gib"
          echo "hard_stop_free_space_gb=$min_free_gb"

          if [ "$available_gib" -lt "$min_free_gb" ]; then
            echo "Free space below hard stop. Refusing to create storage root."
            exit 44
          fi

      - name: Create storage root and minimal manifests
        shell: bash
        run: |
          set -euo pipefail

          root="${{ inputs.root }}"
          test "$root" = "/Users/uniimporteexport/API_STORAGE"

          mkdir -p \
            "$root/books/raw" \
            "$root/books/processed" \
            "$root/books/metadata" \
            "$root/documents/public" \
            "$root/documents/institutional" \
            "$root/documents/private" \
            "$root/datasets/raw" \
            "$root/datasets/normalized" \
            "$root/embeddings/indexes" \
            "$root/embeddings/manifests" \
            "$root/uploads/inbox" \
            "$root/uploads/quarantine" \
            "$root/uploads/accepted" \
            "$root/exports" \
            "$root/backups" \
            "$root/registry"

          cat > "$root/README.md" <<'EOF'
          # API_STORAGE

          Raiz local controlada de storage institucional da API Developers.digital.

          Status inicial:
          - criado por workflow R4 aprovado;
          - sem ingestão de documentos;
          - sem indexação;
          - sem exposição pública;
          - iCloud permitido somente como backup frio/cópia auxiliar;
          - backend ativo deve usar SSD local e limites conservadores.

          Estrutura:
          - books/
          - documents/
          - datasets/
          - embeddings/
          - uploads/
          - exports/
          - backups/
          - registry/
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import json
          from datetime import datetime, timezone

          root = Path("/Users/uniimporteexport/API_STORAGE")
          manifest = {
              "storage_id": "mac-storage-primary-01",
              "status": "created",
              "role": "primary_initial",
              "tenant": "apidevelopers-digital",
              "host": "Homosapi-iMac.local",
              "user": "uniimporteexport",
              "root": str(root),
              "created_at_utc": datetime.now(timezone.utc).isoformat(),
              "created_by": "ADA",
              "approval": "IGOR_APROVA_R4",
              "ui_available_gb_observed": 772.49,
              "apfs_available_gb_observed": 374.6,
              "df_available_gib_observed": 349,
              "backend_initial_limit_gb": 200,
              "hard_stop_free_space_gb": 150,
              "icloud_policy": "cold_backup_or_auxiliary_copy_only",
              "backend_policy": "local_ssd_only",
              "ingestion_enabled": False,
              "indexing_enabled": False,
              "public_exposure_enabled": False,
              "classification_required_before_private_ingest": True,
              "directories": [
                  "books/raw",
                  "books/processed",
                  "books/metadata",
                  "documents/public",
                  "documents/institutional",
                  "documents/private",
                  "datasets/raw",
                  "datasets/normalized",
                  "embeddings/indexes",
                  "embeddings/manifests",
                  "uploads/inbox",
                  "uploads/quarantine",
                  "uploads/accepted",
                  "exports",
                  "backups",
                  "registry",
              ],
          }
          (root / "registry" / "storage_manifest.json").write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n"
          )
          (root / "registry" / "checksums.json").write_text(
              json.dumps({"version": 1, "items": []}, indent=2) + "\n"
          )
          (root / "registry" / "inventory_latest.json").write_text(
              json.dumps({"version": 1, "items": [], "generated_at_utc": None}, indent=2) + "\n"
          )
          PY

      - name: Verify creation and build report
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p audit-output
          root="${{ inputs.root }}"
          report="audit-output/api-storage-create-report.md"

          {
            echo "# API_STORAGE creation report"
            echo
            echo "- job_id: ${{ inputs.job_id }}"
            echo "- tenant: ${{ inputs.tenant }}"
            echo "- expected_hostname: ${{ inputs.expected_hostname }}"
            echo "- expected_user: ${{ inputs.expected_user }}"
            echo "- runner_name: ${{ runner.name }}"
            echo "- root: $root"
            echo "- backend_initial_limit_gb: ${{ inputs.backend_initial_limit_gb }}"
            echo "- hard_stop_free_space_gb: ${{ inputs.hard_stop_free_space_gb }}"
            echo "- created_at_utc: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo
            echo "## Safety"
            echo
            echo "Created only empty directory structure and initial manifest files. No document ingestion, indexing, cleanup, deletion, or public exposure was performed."
            echo
            echo "## Host identity"
            echo
            echo '```text'
            hostname || true
            scutil --get ComputerName 2>/dev/null || true
            scutil --get LocalHostName 2>/dev/null || true
            whoami
            echo '```'
            echo
            echo "## Disk status"
            echo
            echo '```text'
            df -h /Users/uniimporteexport || true
            echo '```'
            echo
            echo "## Created tree"
            echo
            echo '```text'
            find "$root" -maxdepth 3 -print | sort
            echo '```'
            echo
            echo "## Manifest"
            echo
            echo '```json'
            cat "$root/registry/storage_manifest.json"
            echo '```'
            echo
            echo "## Root size"
            echo
            echo '```text'
            du -sh "$root" || true
            echo '```'
          } > "$report"

      - name: Upload creation report artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-storage-create-${{ inputs.job_id }}-${{ runner.name }}
          path: audit-output/
          if-no-files-found: error

      - name: Persist report to audit branch
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "ada-storage-create-bot"
          git config user.email "ada-storage-create-bot@users.noreply.github.com"

          out_dir="audits/storage-create/${{ inputs.job_id }}/${{ runner.name }}"
          report_src="audit-output/api-storage-create-report.md"

          git fetch origin "$AUDIT_BRANCH" || true

          if git show-ref --quiet "refs/remotes/origin/$AUDIT_BRANCH"; then
            git checkout "$AUDIT_BRANCH"
            git pull --ff-only origin "$AUDIT_BRANCH" || true
          else
            git checkout --orphan "$AUDIT_BRANCH"
            git rm -rf . >/dev/null 2>&1 || true
          fi

          mkdir -p "$out_dir"
          cp "$report_src" "$out_dir/api-storage-create-report.md"

          git add "$out_dir/api-storage-create-report.md"

          if git diff --cached --quiet; then
            echo "No create report changes to commit."
          else
            git commit -m "Add API_STORAGE create report for ${{ inputs.job_id }} / ${{ runner.name }}"
            git push origin "$AUDIT_BRANCH"
          fi
