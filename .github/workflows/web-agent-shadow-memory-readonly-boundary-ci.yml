name: Web Agent Shadow Memory Read Only Boundary CI

on:
  push:
    branches:
      - "feat/web-agent-shadow-memory-readonly-boundary-20260815"
    paths:
      - "apps/api-gateway/src/web-agent-shadow-memory-readonly-service.mjs"
      - "apps/api-gateway/test/web-agent-shadow-memory-readonly-boundary.test.mjs"
      - ".github/workflows/web-agent-shadow-memory-readonly-boundary-ci.yml"
  pull_request:
    paths:
      - "apps/api-gateway/src/web-agent-shadow-memory-readonly-service.mjs"
      - "apps/api-gateway/test/web-agent-shadow-memory-readonly-boundary.test.mjs"
      - ".github/workflows/web-agent-shadow-memory-readonly-boundary-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/api-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Link contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p node_modules/@apidevelopers
          ln -sfn "$GITHUB_WORKSPACE/packages/contracts" node_modules/@apidevelopers/contracts
      - name: Syntax
        run: |
          node --check src/web-agent-shadow-memory-readonly-service.mjs
          node --check test/web-agent-shadow-memory-readonly-boundary.test.mjs
      - name: Read-only memory boundary
        run: node --test test/web-agent-shadow-memory-readonly-boundary.test.mjs
