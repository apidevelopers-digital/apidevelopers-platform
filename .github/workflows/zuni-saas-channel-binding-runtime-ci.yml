name: Zuni SaaS Channel Binding Runtime CI

on:
  push:
    paths:
      - "packages/contracts/src/saas-channel-binding.mjs"
      - "packages/contracts/src/index.mjs"
      - "packages/saas-runtime/src/runtime.mjs"
      - "packages/saas-runtime/test/zuni-channel-binding-runtime.test.mjs"
      - ".github/workflows/zuni-saas-channel-binding-runtime-ci.yml"
  pull_request:
    paths:
      - "packages/contracts/src/saas-channel-binding.mjs"
      - "packages/contracts/src/index.mjs"
      - "packages/saas-runtime/src/runtime.mjs"
      - "packages/saas-runtime/test/zuni-channel-binding-runtime.test.mjs"
      - ".github/workflows/zuni-saas-channel-binding-runtime-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate syntax
        run: |
          set -euo pipefail
          node --check packages/contracts/src/saas-channel-binding.mjs
          node --check packages/saas-runtime/src/runtime.mjs
          node --check packages/saas-runtime/test/zuni-channel-binding-runtime.test.mjs

      - name: Validate channel binding runtime
        run: |
          set -euo pipefail
          node --test packages/saas-runtime/test/zuni-channel-binding-runtime.test.mjs

      - name: Guard against secret material
        run: |
          set -euo pipefail
          ! grep -Eq 'accessToken[[:space:]]*:|access_token[[:space:]]*:|appSecret[[:space:]]*:|credentialValue[[:space:]]*:'             packages/saas-runtime/src/runtime.mjs
          grep -Fq 'credentialRef' packages/contracts/src/saas-channel-binding.mjs
