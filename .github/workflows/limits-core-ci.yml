name: Limits Core CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "foundation/**"
    paths:
      - "packages/limits-core/**"
      - ".github/workflows/limits-core-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "packages/limits-core/**"
      - ".github/workflows/limits-core-ci.yml"

permissions:
  contents: read

concurrency:
  group: limits-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check limits-core
        run: npm --prefix packages/limits-core run check
      - name: Check domain boundaries
        run: |
          node --check packages/usage-core/src/index.mjs
          node --check packages/project-core/src/index.mjs
          node --check packages/tenant-core/src/index.mjs
