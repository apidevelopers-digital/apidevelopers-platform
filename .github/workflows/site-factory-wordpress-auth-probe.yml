name: Site Factory WordPress Auth Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wordpress-auth-probe:
    name: Mercado Pago access token presence preflight
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 10
    steps:
      - name: Check MP_ACCESS_TOKEN binding without revealing value
        shell: bash
        env:
          MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${MP_ACCESS_TOKEN:-}"
