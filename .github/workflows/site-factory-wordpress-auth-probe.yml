name: Site Factory WordPress Auth Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wordpress-auth-probe:
    name: Mercado Pago secret bindings preflight
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 10
    steps:
      - name: Check Mercado Pago secret bindings without revealing values
        shell: bash
        env:
          MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
          MP_EXPECTED_TEST_USER_ID: ${{ secrets.MP_EXPECTED_TEST_USER_ID }}
        run: |
          set -euo pipefail
          test -n "${MP_ACCESS_TOKEN:-}"
          test -n "${MP_EXPECTED_TEST_USER_ID:-}"
          echo "mercadopago-secret-bindings=ok"
