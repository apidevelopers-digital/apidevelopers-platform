name: Site Factory WordPress Auth Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wordpress-auth-probe:
    name: Mercado Pago authenticated read-only credential probe
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 10
    steps:
       - name: Check Mercado Pago credential with GET users me
        shell: bash
        env:
          MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${MP_ACCESS_TOKEN:-}"
          node --input-type=module <<'NODE'
          const token = process.env.MP_ACCESS_TOKEN;
          const response = await fetch("https://api.mercadolibre.com/users/me", {
            method: "GET",
            headers: {
              accept: "application/json",
              authorization: `Bearer ${token}`,
            },
          });
          if (!response.ok) process.exit(2);
          const payload = await response.json();
          if (payload?.id === undefined || payload?.id === null || String(payload.id).trim() === "") process.exit(3);
          console.log("mercadopago-authenticated-readonly=ok");
          NODE
