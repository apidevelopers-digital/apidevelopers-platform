name: UniJuri Production Browser Handoff Contract CI

on:
  push:
    paths:
      - "apps/api-gateway/src/browser-session-handoff-production-composition.mjs"
      - "apps/api-gateway/test/browser-session-handoff-production-composition.test.mjs"
      - ".github/workflows/unijuri-production-browser-handoff-contract.yml"
  pull_request:
    paths:
      - "apps/api-gateway/src/browser-session-handoff-production-composition.mjs"
      - "apps/api-gateway/test/browser-session-handoff-production-composition.test.mjs"
      - ".github/workflows/unijuri-production-browser-handoff-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Link local security dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/api-gateway/node_modules/@apidevelopers
          ln -sfn "$GITHUB_WORKSPACE/packages/auth-core" \
            "$GITHUB_WORKSPACE/apps/api-gateway/node_modules/@apidevelopers/auth-core"
          ln -sfn "$GITHUB_WORKSPACE/packages/persistence-core" \
            "$GITHUB_WORKSPACE/apps/api-gateway/node_modules/@apidevelopers/persistence-core"

          mkdir -p packages/auth-core/node_modules/@apidevelopers
          ln -sfn "$GITHUB_WORKSPACE/packages/apikey-core" \
            "$GITHUB_WORKSPACE/packages/auth-core/node_modules/@apidevelopers/apikey-core"

      - name: Validate dormant production handoff contract
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/api-gateway/src/browser-session-handoff-production-composition.mjs
          node --check apps/api-gateway/test/browser-session-handoff-production-composition.test.mjs
          node --test apps/api-gateway/test/browser-session-handoff-production-composition.test.mjs

      - name: Enforce no runtime auto-wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'runtimeAutoWiring: false' \
            apps/api-gateway/src/browser-session-handoff-production-composition.mjs
          grep -Fq 'https://unijuri.sitedauni.com' \
            apps/api-gateway/src/browser-session-handoff-production-composition.mjs
          ! grep -Fq 'browser-session-handoff-production-composition' \
            apps/api-gateway/src/operational-runtime.mjs
          ! grep -Eq 'process\.env|API_GATEWAY_.*KEY|SECRET|TOKEN' \
            apps/api-gateway/src/browser-session-handoff-production-composition.mjs
