name: Operator Keychain Helper Test CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/api-gateway/native/operator-keychain-helper/**"
      - ".github/workflows/operator-keychain-helper-ci.yml"
      - ".github/workflows/operator-keychain-helper-build-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm Swift toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(xcrun swift --version | tr '\n' ' ')"
          echo "::notice title=Swift toolchain::$toolchain"

      - name: Test fail-closed native Keychain helper
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/operator-keychain-helper-test.log"

          set +e
          xcrun swift test             --package-path apps/api-gateway/native/operator-keychain-helper             >"$log_file" 2>&1
          status=$?
          set -e

          if [[ "$status" -ne 0 ]]; then
            summary="$(
              tail -n 80 "$log_file" |
                sed -e 's/%/%25/g' -e 's/\r/%0D/g' |
                paste -sd ' ' - |
                cut -c1-3500
            )"
            echo "::error title=Swift test failed::$summary"
            exit "$status"
          fi
