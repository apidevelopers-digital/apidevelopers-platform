name: Operator Keychain Helper Test CI

"on":
  pull_request:
    branches:
      - main
    paths:
      - "apps/api-gateway/native/operator-keychain-helper/**"
      - ".github/workflows/operator-keychain-helper-ci.yml"
      - ".github/workflows/operator-keychain-helper-build-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve full Xcode developer directory
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          selected=""
          candidates=(
            "/Applications/Xcode.app/Contents/Developer"
          )

          for app in /Applications/Xcode*.app; do
            candidates+=("$app/Contents/Developer")
          done

          for candidate in "${candidates[@]}"; do
            if [[ -d "$candidate/Platforms/MacOSX.platform" ]]; then
              selected="$candidate"
              break
            fi
          done

          if [[ -z "$selected" ]]; then
            echo "::error title=Full Xcode unavailable::The runner only exposes CommandLineTools; SwiftPM cannot resolve MacOSX PlatformPath. Install/select a full Xcode bundle before validating the native helper."
            exit 1
          fi

          echo "DEVELOPER_DIR=$selected" >> "$GITHUB_ENV"
          echo "::notice title=Developer directory::$selected"
          DEVELOPER_DIR="$selected" xcrun --sdk macosx --show-sdk-platform-path
          DEVELOPER_DIR="$selected" xcrun swift --version

      - name: Test fail-closed native Keychain helper
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/operator-keychain-helper-test.log"

          set +e
          xcrun swift test \
            --package-path apps/api-gateway/native/operator-keychain-helper \
            >"$log_file" 2>&1
          status=$?
          set -e

          if [[ "$status" -ne 0 ]]; then
            summary="$(
              tail -n 80 "$log_file" |
                sed -e 's/%/%25/g' -e 's/\r/%0D/g' |
                paste -sd ' ' - |
                cut -c1-3500
            )"
            echo "::error title=Swift test failed::$summary"
            exit "$status"
          fi
