name: Operator Keychain Helper CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/api-gateway/native/operator-keychain-helper/**"
      - ".github/workflows/operator-keychain-helper-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test native Keychain helper
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path apps/api-gateway/native/operator-keychain-helper

      - name: Build fail-closed native Keychain helper
        shell: bash
        run: |
          set -euo pipefail
          swift build \
            --package-path apps/api-gateway/native/operator-keychain-helper \
            --configuration release \
            --product operator-keychain-helper
