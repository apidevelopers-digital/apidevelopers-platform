name: Operator Keychain Helper Test CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/api-gateway/native/operator-keychain-helper/**"
      - ".github/workflows/operator-keychain-helper-ci.yml"
      - ".github/workflows/operator-keychain-helper-build-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm Swift toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcrun --find swift
          xcrun swift --version

      - name: Test fail-closed native Keychain helper
        shell: bash
        run: |
          set -euo pipefail
          xcrun swift test --package-path apps/api-gateway/native/operator-keychain-helper
