name: API Gateway Uni Account Preview Runtime Publish

on:
  workflow_dispatch:
    inputs:
      example:
        description: "Exact Igor approval token for Conta uni. preview runtime"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: api-gateway-runtime-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.ref == 'refs/heads/ada/uni-saas-customer-account-media-e2e-v1' &&
      github.event.inputs.example == 'IGOR_APROVA_CONTA_UNI_PREVIEW_20260912'
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 20
    env:
      RUNTIME_BRANCH: deploy/hostinger-gateway-runtime
    steps:
      - name: Checkout exact preview source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build and verify managed runtime artifact
        shell: bash
        run: |
          set -euo pipefail
          node apps/api-gateway/scripts/build-managed-hosting-artifact.mjs
          node apps/api-gateway/scripts/apply-hostinger-fixed-entry-compat.mjs
          node apps/api-gateway/scripts/verify-managed-hosting-artifact.mjs
          artifact="apps/api-gateway/dist/api-gateway-managed"
          runtime="$RUNNER_TEMP/api-gateway-runtime-$GITHUB_SHA"
          rm -rf "$runtime"
          mkdir -p "$runtime"
          cp -R "$artifact/." "$runtime/"
          test -f "$runtime/src/uni-account-preview-operational-server.mjs"
          mv "$runtime/src/operational-server.mjs" "$runtime/src/operational-server-base.mjs"
          sed 's#"\./operational-server\.mjs"#"./operational-server-base.mjs"#' \
            "$runtime/src/uni-account-preview-operational-server.mjs" \
            > "$runtime/src/operational-server.mjs"
          node --check "$runtime/src/operational-server.mjs"
          node --check "$runtime/src/operational-server-base.mjs"
          echo "RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"

      - name: Publish deploy-only branch from approved preview source
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$GITHUB_SHA"
          git config user.name "api-developers-runtime-publisher"
          git config user.email "runtime-publisher@users.noreply.github.com"
          git fetch origin "$RUNTIME_BRANCH:$RUNTIME_BRANCH"
          git switch "$RUNTIME_BRANCH"
          find . -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp -R "$RUNTIME_DIR/." .
          printf '%s\n' "$source_sha" > SOURCE_SHA
          git add -A
          if git diff --cached --quiet; then
            echo "Runtime branch already matches source $source_sha."
            exit 0
          fi
          git commit -m "deploy(gateway): Conta uni preview runtime from $source_sha"
          git push origin "HEAD:refs/heads/$RUNTIME_BRANCH"
          git fetch origin "$RUNTIME_BRANCH"
          git show "origin/$RUNTIME_BRANCH:SOURCE_SHA" | grep -Fx "$source_sha"
