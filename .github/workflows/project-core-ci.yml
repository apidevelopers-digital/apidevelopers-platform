name: Project Core CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "foundation/**"
    paths:
      - "packages/project-core/**"
      - ".github/workflows/project-core-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "packages/project-core/**"
      - ".github/workflows/project-core-ci.yml"

permissions:
  contents: read

concurrency:
  group: project-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install workspace dependencies
        run: npm install --ignore-scripts
      - name: Run project-core full validation
        run: npm --prefix packages/project-core run check
      - name: Check tenant boundaries
        run: |
          node --check packages/tenant-core/src/index.mjs
          node --check packages/tenancy/src/index.mjs
