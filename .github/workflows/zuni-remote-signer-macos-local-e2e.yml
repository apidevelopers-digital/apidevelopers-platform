name: Zuni Remote Signer macOS Local E2E Test

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main SHA approved for the local reversible E2E test
        required: true
        type: string
      confirmation:
        description: Exact approval phrase for the local reversible E2E test
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: zuni-remote-signer-macos-local-e2e
  cancel-in-progress: false

jobs:
  local-e2e:
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 15
    steps:
      - name: Validate frozen revision and explicit approval
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "IGOR_APROVA_ZUNI_REMOTE_SIGNER_MAC_LOCAL_E2E_REVERSIVEL"
          test "$GITHUB_SHA" = "$EXPECTED_SHA"

      - name: Checkout frozen revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Revalidate local bootstrap and preflight contracts
        shell: bash
        working-directory: apps/api-gateway
        run: |
          set -euo pipefail
          node --test \
            test/saas-delegated-binding-remote-signer-macos-bootstrap.test.mjs \
            test/saas-delegated-binding-remote-signer-macos-preflight.test.mjs

      - name: Execute reversible Keychain + launchd + loopback signature E2E
        shell: bash
        working-directory: apps/api-gateway
        env:
          ZUNI_LOCAL_E2E_CONFIRMATION: IGOR_APROVA_ZUNI_REMOTE_SIGNER_MAC_LOCAL_E2E_REVERSIVEL
        run: |
          set -euo pipefail

          SERVICE="digital.apidevelopers.zuni-remote-signer"
          ACCOUNT="delegated-binding-private-key"
          LABEL="digital.apidevelopers.zuni-remote-signer.test"
          KEY_ID="zuni-local-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          PORT="18765"
          GUI_DOMAIN="gui/$(id -u)"
          WORK_ROOT="$(mktemp -d "${RUNNER_TEMP:-/tmp}/zuni-remote-signer-e2e.XXXXXX")"
          PRIVATE_KEY="$WORK_ROOT/private.pem"
          PUBLIC_KEY="$WORK_ROOT/public.pem"
          PLIST="$WORK_ROOT/${LABEL}.plist"
          STDOUT_LOG="$WORK_ROOT/stdout.log"
          STDERR_LOG="$WORK_ROOT/stderr.log"
          ITEM_CREATED=0
          SERVICE_BOOTSTRAPPED=0

          cleanup() {
            set +e
            if [ "$SERVICE_BOOTSTRAPPED" -eq 1 ]; then
              /bin/launchctl bootout "$GUI_DOMAIN/$LABEL" >/dev/null 2>&1 || true
            fi
            if [ "$ITEM_CREATED" -eq 1 ]; then
              /usr/bin/security delete-generic-password -s "$SERVICE" -a "$ACCOUNT" >/dev/null 2>&1 || true
            fi
            rm -rf "$WORK_ROOT"
          }
          trap cleanup EXIT INT TERM

          test "$ZUNI_LOCAL_E2E_CONFIRMATION" = "IGOR_APROVA_ZUNI_REMOTE_SIGNER_MAC_LOCAL_E2E_REVERSIVEL"

          if /usr/bin/security find-generic-password -s "$SERVICE" -a "$ACCOUNT" >/dev/null 2>&1; then
            echo "Refusing to overwrite an existing RemoteSigner Keychain item."
            exit 20
          fi

          if /bin/launchctl print "$GUI_DOMAIN/$LABEL" >/dev/null 2>&1; then
            echo "Refusing to reuse an already-loaded RemoteSigner launchd service."
            exit 21
          fi

          if /usr/sbin/lsof -nP -iTCP:"$PORT" -sTCP:LISTEN >/dev/null 2>&1; then
            echo "Refusing to reuse occupied loopback test port $PORT."
            exit 22
          fi

          /usr/bin/openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$PRIVATE_KEY" >/dev/null 2>&1
          /usr/bin/openssl pkey -in "$PRIVATE_KEY" -pubout -out "$PUBLIC_KEY" >/dev/null 2>&1
          chmod 600 "$PRIVATE_KEY" "$PUBLIC_KEY"

          PRIVATE_KEY_VALUE="$(cat "$PRIVATE_KEY")"
          /usr/bin/security add-generic-password -s "$SERVICE" -a "$ACCOUNT" -w "$PRIVATE_KEY_VALUE" >/dev/null
          unset PRIVATE_KEY_VALUE
          ITEM_CREATED=1

          export NODE_PATH="$(command -v node)"
          export ENTRYPOINT="$(pwd)/scripts/start-zuni-remote-signer-macos-test.mjs"
          export CWD="$(pwd)"
          export KEY_ID PORT STDOUT_LOG STDERR_LOG

          node --input-type=module <<'NODE' > "$PLIST"
          import { renderZuniRemoteSignerTestLaunchdPlist } from "./src/saas-delegated-binding-remote-signer-launchd.mjs";

          const required = (name) => {
            const value = process.env[name];
            if (!value) throw new Error(`${name} is required`);
            return value;
          };

          process.stdout.write(renderZuniRemoteSignerTestLaunchdPlist({
            nodePath: required("NODE_PATH"),
            entrypointPath: required("ENTRYPOINT"),
            workingDirectory: required("CWD"),
            keyId: required("KEY_ID"),
            port: Number(required("PORT")),
            stdoutPath: required("STDOUT_LOG"),
            stderrPath: required("STDERR_LOG"),
          }));
          NODE

          /bin/launchctl bootstrap "$GUI_DOMAIN" "$PLIST"
          SERVICE_BOOTSTRAPPED=1

          ready=0
          for _ in $(seq 1 30); do
            if /usr/bin/curl --silent --show-error --fail "http://127.0.0.1:${PORT}/healthz" >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1

          export PUBLIC_KEY GITHUB_RUN_ID GITHUB_RUN_ATTEMPT
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { constants as cryptoConstants, createPublicKey, verify } from "node:crypto";

          const port = Number(process.env.PORT);
          const keyId = process.env.KEY_ID;
          const publicKey = createPublicKey(fs.readFileSync(process.env.PUBLIC_KEY, "utf8"));
          const issuedAt = new Date();
          const expiresAt = new Date(issuedAt.getTime() + 60_000);

          const request = {
            version: "zuni-remote-signer/v1",
            operation: "sign-zuni-delegated-binding",
            keyId,
            algorithm: "RSA-PSS-SHA256",
            audience: "unico-api-platform:zuni-documents",
            payload: {
              version: "zuni-delegated-binding/v1",
              audience: "unico-api-platform:zuni-documents",
              tenantId: "tenant.local-e2e",
              workspaceId: "workspace.local-e2e",
              accessGrantId: "grant.local-e2e",
              productId: "zuni",
              principalId: "principal.local-e2e",
              issuedAt: issuedAt.toISOString(),
              expiresAt: expiresAt.toISOString(),
              nonce: `nonce-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`,
            },
            timeoutMs: 1800,
          };

          const response = await fetch(`http://127.0.0.1:${port}/v1/sign`, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify(request),
          });
          if (response.status !== 200) throw new Error(`remote_signer_e2e_http_${response.status}`);

          const signed = await response.json();
          if (signed.keyId !== keyId || signed.algorithm !== "RSA-PSS-SHA256") {
            throw new Error("remote_signer_e2e_response_contract_mismatch");
          }

          const [payloadB64u, signatureB64u] = String(signed.proof ?? "").split(".");
          if (!payloadB64u || !signatureB64u) throw new Error("remote_signer_e2e_invalid_proof");

          const ok = verify(
            "sha256",
            Buffer.from(payloadB64u, "utf8"),
            {
              key: publicKey,
              padding: cryptoConstants.RSA_PKCS1_PSS_PADDING,
              saltLength: 32,
            },
            Buffer.from(signatureB64u, "base64url"),
          );

          if (!ok) throw new Error("remote_signer_e2e_signature_verification_failed");

          process.stdout.write(JSON.stringify({
            mode: "local-e2e-reversible",
            keyId: signed.keyId,
            algorithm: signed.algorithm,
            host: "127.0.0.1",
            port,
            signatureVerified: true,
            productionActivated: false,
          }) + "\n");
          NODE

      - name: Verify cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          SERVICE="digital.apidevelopers.zuni-remote-signer"
          ACCOUNT="delegated-binding-private-key"
          LABEL="digital.apidevelopers.zuni-remote-signer.test"
          GUI_DOMAIN="gui/$(id -u)"

          if /usr/bin/security find-generic-password -s "$SERVICE" -a "$ACCOUNT" >/dev/null 2>&1; then
            echo "Temporary RemoteSigner Keychain item still exists after test."
            exit 30
          fi

          if /bin/launchctl print "$GUI_DOMAIN/$LABEL" >/dev/null 2>&1; then
            echo "Temporary RemoteSigner launchd service still exists after test."
            exit 31
          fi

          echo "Cleanup verified: no temporary Keychain item or launchd service remains."
