name: Zuni Remote Signer macOS Local E2E Test

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main SHA approved for the local reversible E2E test
        required: true
        type: string
      confirmation:
        description: Exact approval phrase for the local reversible E2E test
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: zuni-remote-signer-macos-local-e2e
  cancel-in-progress: false

jobs:
  local-e2e:
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 15
    steps:
      - name: Validate frozen revision and explicit approval
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "IGOR_APROVA_ZUNI_REMOTE_SIGNER_MAC_LOCAL_E2E_REVERSIVEL"
          test "$GITHUB_SHA" = "$EXPECTED_SHA"

      - name: Checkout frozen revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Revalidate local bootstrap and isolated-keychain contracts
        shell: bash
        working-directory: apps/api-gateway
        run: |
          set -euo pipefail
          node --test \
            test/saas-delegated-binding-remote-signer-macos-bootstrap.test.mjs \
            test/saas-delegated-binding-remote-signer-macos-preflight.test.mjs \
            test/saas-delegated-binding-remote-signer-macos-keychain-path.test.mjs

      - name: Execute reversible isolated-Keychain + launchd + loopback signature E2E
        shell: bash
        working-directory: apps/api-gateway
        env:
          ZUNI_LOCAL_E2E_CONFIRMATION: IGOR_APROVA_ZUNI_REMOTE_SIGNER_MAC_LOCAL_E2E_REVERSIVEL
        run: bash scripts/run-zuni-remote-signer-macos-local-e2e.sh
