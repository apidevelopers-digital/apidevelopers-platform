name: Workspace Diagnostics CI

on:
  push:
    paths:
      - "scripts/diagnose-workspace-tests.mjs"
      - ".github/workflows/workspace-diagnostics-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preflight manifests
        run: node scripts/reanchor-preflight.mjs

      - name: Install workspaces
        run: npm install

      - name: Diagnose architecture rule engine
        id: diagnose
        continue-on-error: true
        run: |
          mkdir -p diagnostics
          node scripts/diagnose-workspace-tests.mjs \
            --workspace=@apidevelopers/architecture-rule-engine \
            --report=diagnostics/architecture-rule-engine.json

      - name: Persist diagnostic report
        if: always() && github.ref_type == 'branch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/architecture-rule-engine.json
          git diff --quiet && git diff --cached --quiet || {
            git commit -m "chor(diagnostics): record architecture rule engine failure [skip ci]"
            git push origin "HEAD:${GITHUB_REF#slash}"
          }

      - name: Fail after report persistence
        if: steps.diagnose.outcome == 'failure'
        run: exit 1
