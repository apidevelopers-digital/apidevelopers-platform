name: Workspace Diagnostics CI

on:
  push:
    paths:
      - "scripts/diagnose-workspace-tests.mjs"
      - ".github/workflows/workspace-diagnostics-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preflight manifests
        run: node scripts/reanchor-preflight.mjs 

      - name: Install workspaces
        run: npm install

      - name: Diagnose workspace tests
        run: node scripts/diagnose-workspace-tests.mjs
