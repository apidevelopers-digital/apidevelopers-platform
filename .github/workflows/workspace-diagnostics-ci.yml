name: Workspace Diagnostics CI

on:
  push:
    paths:
      - ".github/workflows/workspace-diagnostics-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspaces
        run: npm install

      - name: Capture rule engine test log
        id: test
        continue-on-error: true
        run: |
          mkdir -p diagnostics
          set +oe
          npm test --workspace @apidevelopers/architecture-rule-engine > diagnostics/architecture-rule-engine.log 2>&1
          status=$?
          set -e
          printf "\n\nexit_code=%s\n" "$status" >> diagnostics/architecture-rule-engine.log
          exit "$status"

      - name: Persist raw log
        if: always() && github.ref_type == 'branch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/architecture-rule-engine.log
          git commit -m "chor(diagnostics): capture rule engine test log [skip ci]"
          git push origin "HEAD:${GITHUB_REF#slash}"

      - name: Fail after log persistence
        if: steps.test.outcome == 'failure'
        run: exit 1
