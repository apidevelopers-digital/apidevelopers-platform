name: Portal Learning Integrated Cycle CI

on:
  push:
    branches:
      - "work/portal-learning-integrated-cycle-*"
    paths:
      - "apps/portal-learning-worker/**"
      - "apps/api-gateway/src/learning-snapshot-repository.mjs"
      - "apps/developer-portal/public/learning.html"
      - "capabilities/**"
      - "packages/kernel-memory/**"
      - "packages/kernel-reflection/**"
      - "packages/kernel-evolution/**"
      - "scripts/apid.mjs"
      - "scripts/check-capability-registry.mjs"
      - "scripts/institutional-audit/**"
      - "scripts/lib/institutional-knowledge-graph.mjs"
      - ".github/workflows/portal-learning-integrated-cycle-ci.yml"
  pull_request:
    paths:
      - "apps/portal-learning-worker/**"
      - "apps/api-gateway/src/learning-snapshot-repository.mjs"
      - "apps/developer-portal/public/learning.html"
      - "capabilities/**"
      - "packages/kernel-memory/**"
      - "packages/kernel-reflection/**"
      - "packages/kernel-evolution/**"
      - "scripts/apid.mjs"
      - "scripts/check-capability-registry.mjs"
      - "scripts/institutional-audit/**"
      - "scripts/lib/institutional-knowledge-graph.mjs"
      - ".github/workflows/portal-learning-integrated-cycle-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Link learning kernel workspaces
        shell: bash
        run: |
          set -euo pipefail
          scope_dir="$GITHUB_WORKSPACE/node_modules/@apidevelopers"
          mkdir -p "$scope_dir"
          for package in kernel-memory kernel-reflection kernel-evolution; do
            source_dir="$GITHUB_WORKSPACE/packages/$package"
            target="$scope_dir/$package"
            test -f "$source_dir/package.json"
            rm -rf "$target"
            ln -s "$source_dir" "$target"
          done
      - name: Check integrated learning cycle
        run: npm --workspace @apidevelopers/portal-learning-worker run check
      - name: Run real repository learning cycle
        shell: bash
        env:
          PORTAL_LEARNING_MEMORY_PATH: ${{ runner.temp }}/portal-learning/memory.json
          PORTAL_LEARNING_GRAPH_PATH: ${{ runner.temp }}/portal-learning/graph.json
          PORTAL_LEARNING_AUDIT_PATH: ${{ runner.temp }}/portal-learning/audit.json
          PORTAL_LEARNING_SNAPSHOT_PATH: ${{ runner.temp }}/portal-learning/snapshot.json
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/portal-learning-receipt.json"
          node scripts/apid.mjs learning > "$receipt"
          node --input-type=module - "$receipt" <<'NODE'
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";

          const receiptPath = process.argv[2];
          const receipt = JSON.parse(await readFile(receiptPath, "utf8"));

          assert.equal(receipt.status, "completed");
          assert.equal(receipt.readOnly, true);
          assert.equal(receipt.endpoint.status, 200);
          assert.equal(receipt.endpoint.cacheControl, "no-store");
          assert.equal(receipt.gates.humanApprovalRequired, true);
          assert.equal(receipt.gates.mutationAllowed, false);
          assert.equal(receipt.gates.executionAllowed, false);
          assert.equal(receipt.gates.automaticApprovalAllowed, false);
          assert.ok(receipt.sources.capabilities > 0);
          NODE
