name: Trust Face ControlFace10K Materialize Once

on:
  push:
    branches: [ada/trust-face-sface-lab-inference-v1]
    paths: [".github/workflows/trust-face-controlface10k-materialize-once.yml"]

permissions:
  contents: read

jobs:
  materialize:
    if: ${{ contains(github.event.head_commit.message, '[materialize-controlface10k]') }}
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 180
    env:
      URL: "https://huggingface.co/datasets/HuMInGameLab/ControlFace10K/resolve/main/controlface10k.zip?download=true"
      BYTES: "3137641968"
      SHA: "d0ed28b3271a75ac5bb8e6799fdfe78ba3a91fb7eddecf19d960ed18fe00a108"
    steps:
      - name: Preflight
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RUNNER_OS:-}" == "macOS" && "${RUNNER_ARCH:-}" == "X64" ]] || {
            echo "::error title=ControlFace10K preflight::unexpected_platform ${RUNNER_OS:-unknown}/${RUNNER_ARCH:-unknown}"
            exit 1
          }
          if [[ "${RUNNER_NAME:-}" != "igor-mac-runner" ]]; then
            echo "::warning title=ControlFace10K runner drift::canonical=igor-mac-runner actual=${RUNNER_NAME:-unknown}"
          fi

          d="$HOME/.cache/apidevelopers-digital/trust-face/controlface10k"
          f="$d/controlface10k.zip"
          p="$f.part"
          mkdir -p "$d"

          if [[ -f "$f" ]]; then
            s="$(stat -f%z "$f")"
            h="$(shasum -a 256 "$f" | awk '{print $1}')"
            if [[ "$s" == "$BYTES" && "$h" == "$SHA" ]]; then
              echo "::notice title=ControlFace10K preflight::existing_verified=true bytes=$s sha256=$h"
              exit 0
            fi
            echo "::error title=ControlFace10K preflight::existing_final_integrity_mismatch bytes=$s sha256=$h"
            exit 1
          fi

          ps=0
          if [[ -e "$p" ]]; then
            [[ -f "$p" ]] || { echo "::error title=ControlFace10K preflight::partial_not_regular_file"; exit 1; }
            ps="$(stat -f%z "$p")"
            (( ps <= BYTES )) || { echo "::error title=ControlFace10K preflight::partial_too_large bytes=$ps"; exit 1; }
          fi

          k="$(df -Pk "$d" | awk 'END {print $4}')"
          [[ "$k" =~ ^[0-9]+$ ]] || { echo "::error title=ControlFace10K preflight::disk_probe_failed"; exit 1; }
          a=$(( k * 1024 ))
          r=$(( BYTES - ps + 1073741824 ))
          echo "::notice title=ControlFace10K disk::partial_bytes=$ps available_bytes=$a required_bytes=$r"
          (( a >= r )) || { echo "::error title=ControlFace10K preflight::insufficient_disk available_bytes=$a required_bytes=$r"; exit 1; }
          echo "::notice title=ControlFace10K preflight::passed=true"

      - name: Materialize and verify only
        shell: bash
        run: |
          set -euo pipefail
          d="$HOME/.cache/apidevelopers-digital/trust-face/controlface10k"
          f="$d/controlface10k.zip"
          p="$f.part"
          e="$d/controlface10k.verified.txt"
          mkdir -p "$d"

          if [[ -f "$f" ]]; then
            s="$(stat -f%z "$f")"
            h="$(shasum -a 256 "$f" | awk '{print $1}')"
            [[ "$s" == "$BYTES" && "$h" == "$SHA" ]] || exit 1
          else
            curl --fail --location --retry 6 --retry-all-errors --retry-delay 5               --connect-timeout 30 --continue-at - --progress-bar --output "$p" "$URL"
            s="$(stat -f%z "$p")"
            [[ "$s" == "$BYTES" ]] || { echo "::error title=ControlFace10K verification::byte_size_mismatch expected=$BYTES got=$s"; exit 1; }
            h="$(shasum -a 256 "$p" | awk '{print $1}')"
            [[ "$h" == "$SHA" ]] || { echo "::error title=ControlFace10K verification::sha256_mismatch expected=$SHA got=$h"; exit 1; }
            mv "$p" "$f"
          fi

          printf '%s\n'             "MATERIALIZATION_VERIFIED=true"             "ARCHIVE_BYTES=$s"             "ARCHIVE_SHA256=$h"             "ARCHIVE_EXTRACTED=false"             "BENCHMARK_EXECUTED=false"             "CALIBRATION_MUTATED=false" > "$e"
          echo "::notice title=ControlFace10K verification::materialization_verified=true bytes=$s sha256=$h benchmark_executed=false"
