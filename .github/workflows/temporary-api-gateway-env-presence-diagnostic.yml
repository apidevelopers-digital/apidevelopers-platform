name: Temporary API Gateway Env Presence Diagnostic

on:
  push:
    branches:
      - ops/gateway-env-presence-diagnostic-20260911
    paths:
      - ".github/workflows/temporary-api-gateway-env-presence-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on:
      - self-hosted
      - macOS
      - X64
    env:
      GLOBAL_TRUST_EVALUATION_PORTAL_ENABLED: ${{ secrets.GLOBAL_TRUST_EVALUATION_PORTAL_ENABLED || vars.GLOBAL_TRUST_EVALUATION_PORTAL_ENABLED }}
      GLOBAL_TRUST_EVALUATION_ENABLED: ${{ secrets.GLOBAL_TRUST_EVALUATION_ENABLED || vars.GLOBAL_TRUST_EVALUATION_ENABLED }}
      API_GATEWAY_ADMIN_KEY: ${{ secrets.API_GATEWAY_ADMIN_KEY }}
      API_GATEWAY_STATE_FILE: ${{ secrets.API_GATEWAY_STATE_FILE || vars.API_GATEWAY_STATE_FILE }}
      API_GATEWAY_DELEGATED_TENANT_ID: ${{ secrets.API_GATEWAY_DELEGATED_TENANT_ID || vars.API_GATEWAY_DELEGATED_TENANT_ID }}
      API_GATEWAY_DELEGATED_KEY: ${{ secrets.API_GATEWAY_DELEGATED_KEY }}
      API_GATEWAY_PROVISIONING_KEY: ${{ secrets.API_GATEWAY_PROVISIONING_KEY }}
      UNI_CO_PREVIEW_IDENTITY_BACKEND_BASE_URL: ${{ secrets.UNI_CO_PREVIEW_IDENTITY_BACKEND_BASE_URL || vars.UNI_CO_PREVIEW_IDENTITY_BACKEND_BASE_URL }}
      WEB_AGENT_SHADOW_API_KEY: ${{ secrets.WEB_AGENT_SHADOW_API_KEY }}
      WEB_AGENT_SHADOW_BASE_URL: ${{ secrets.WEB_AGENT_SHADOW_BASE_URL || vars.WEB_AGENT_SHADOW_BASE_URL }}
      WEB_AGENT_SHADOW_ENABLED: ${{ secrets.WEB_AGENT_SHADOW_ENABLED || vars.WEB_AGENT_SHADOW_ENABLED }}
      API_GATEWAY_OPERATOR_KEY: ${{ secrets.API_GATEWAY_OPERATOR_KEY }}
      API_GATEWAY_OPERATOR_TENANT_ID: ${{ secrets.API_GATEWAY_OPERATOR_TENANT_ID || vars.API_GATEWAY_OPERATOR_TENANT_ID }}
    steps:
      - name: Presence-only diagnostic
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for name in             GLOBAL_TRUST_EVALUATION_PORTAL_ENABLED             GLOBAL_TRUST_EVALUATION_ENABLED             API_GATEWAY_ADMIN_KEY             API_GATEWAY_STATE_FILE             API_GATEWAY_DELEGATED_TENANT_ID             API_GATEWAY_DELEGATED_KEY             API_GATEWAY_PROVISIONING_KEY             UNI_CO_PREVIEW_IDENTITY_BACKEND_BASE_URL             WEB_AGENT_SHADOW_API_KEY             WEB_AGENT_SHADOW_BASE_URL             WEB_AGENT_SHADOW_ENABLED             API_GATEWAY_OPERATOR_KEY             API_GATEWAY_OPERATOR_TENANT_ID
          do
            value="${!name-}"
            if [ -n "$value" ]; then
              echo "::notice title=$name::present"
            else
              echo "::error title=$name::missing"
              failed=1
            fi
          done
          exit "$failed"
