name: Global Trust Evaluation Portal CI

on:
  push:
    branches:
      - main
      - "feat/trust-evaluation-tenant-20260814"
      - "feat/trust-evaluation-portal-runtime-20260815"
    paths:
      - "apps/api-gateway/src/global-trust-evaluation-portal-session.mjs"
      - "apps/api-gateway/src/global-trust-evaluation-portal-session-core.mjs"
      - "apps/api-gateway/src/global-trust-evaluation-portal-inbox.mjs"
      - "apps/api-gateway/src/global-trust-evaluation-portal-http.mjs"
      - "apps/api-gateway/src/global-trust-evaluation-recipient-key-proof.mjs"
      - "apps/api-gateway/src/global-trust-evaluation-credential-envelope.mjs"
      - "apps/api-gateway/src/global-trust-evaluation-approved-onboarding.mjs"
      - "apps/api-gateway/src/operational-trust-evaluation-portal-composition.mjs"
      - "apps/api-gateway/src/operational-trust-evaluation-composition.mjs"
      - "apps/api-gateway/src/operational-server.mjs"
      - "apps/api-gateway/test/global-trust-evaluation-portal.test.mjs"
      - "apps/api-gateway/test/global-trust-evaluation-portal-http.test.mjs"
      - "apps/api-gateway/test/operational-trust-evaluation-portal-composition.test.mjs"
      - "apps/api-gateway/test/operational-trust-evaluation-portal-feature-flag.test.mjs"
      - ".github/workflows/global-trust-evaluation-portal-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/api-gateway/src/global-trust-evaluation-portal-session.mjs"
      - "apps/api-gateway/src/global-trust-evaluation-portal-session-core.mjs"
      - "apps/api-gateway/src/global-trust-evaluation-portal-inbox.mjs"
      - "apps/api-gateway/src/global-trust-evaluation-portal-http.mjs"
      - "apps/api-gateway/src/global-trust-evaluation-recipient-key-proof.mjs"
      - "apps/api-gateway/src/global-trust-evaluation-credential-envelope.mjs"
      - "apps/api-gateway/src/global-trust-evaluation-approved-onboarding.mjs"
      - "apps/api-gateway/src/operational-trust-evaluation-portal-composition.mjs"
      - "apps/api-gateway/src/operational-trust-evaluation-composition.mjs"
      - "apps/api-gateway/src/operational-server.mjs"
      - "apps/api-gateway/test/global-trust-evaluation-portal.test.mjs"
      - "apps/api-gateway/test/global-trust-evaluation-portal-http.test.mjs"
      - "apps/api-gateway/test/operational-trust-evaluation-portal-composition.test.mjs"
      - "apps/api-gateway/test/operational-trust-evaluation-portal-feature-flag.test.mjs"
      - ".github/workflows/global-trust-evaluation-portal-ci.yml"

permissions:
  contents: read

jobs:
  portal:
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 10
    env:
      GLOBAL_TRUST_PAYMENT_MODE: dry-run
      GLOBAL_TRUST_PAYMENT_EGRESS: blocked
      GLOBAL_TRUST_REAL_MONEY: disabled
      GLOBAL_TRUST_EVALUATION_PORTAL_EGRESS: blocked

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Bind local platform packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p node_modules/@apidevelopers
          for dir in packages/*; do
            if [ -f "$dir/package.json" ]; then
              pkg="$(basename "$dir")"
              ln -s "$GITHUB_WORKSPACE/$dir" "$GITHUB_WORKSPACE/node_modules/@apidevelopers/$pkg"
            fi
          done

      - name: Validate syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/api-gateway/src/global-trust-evaluation-portal-session.mjs
          node --check apps/api-gateway/src/global-trust-evaluation-portal-session-core.mjs
          node --check apps/api-gateway/src/global-trust-evaluation-portal-inbox.mjs
          node --check apps/api-gateway/src/global-trust-evaluation-portal-http.mjs
          node --check apps/api-gateway/src/global-trust-evaluation-approved-onboarding.mjs
          node --check apps/api-gateway/src/operational-trust-evaluation-portal-composition.mjs
          node --check apps/api-gateway/src/operational-server.mjs
          node --check apps/api-gateway/test/global-trust-evaluation-portal.test.mjs
          node --check apps/api-gateway/test/global-trust-evaluation-portal-http.test.mjs
          node --check apps/api-gateway/test/operational-trust-evaluation-portal-composition.test.mjs
          node --check apps/api-gateway/test/operational-trust-evaluation-portal-feature-flag.test.mjs

      - name: Execute portal session inbox HTTP runtime and in-product onboarding tests
        working-directory: apps/api-gateway
        shell: bash
        run: |
          set +e
          node --test \
            test/global-trust-evaluation-portal.test.mjs \
            test/global-trust-evaluation-portal-http.test.mjs \
            test/operational-trust-evaluation-portal-composition.test.mjs \
            test/operational-trust-evaluation-portal-feature-flag.test.mjs \
            2>&1 | tee /tmp/trust-evaluation-portal.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            message="$(tail -n 160 /tmp/trust-evaluation-portal.log \
              | sed -E 's/trust_session_[A-Za-z0-9_.-]+/[REDACTED_SESSION_TOKEN]/g' \
              | sed -E 's/trust_eval_[A-Za-z0-9_-]+/[REDACTED_EVALUATION_SECRET]/g' \
              | sed -E 's/[A-Za-z0-9_-]{120,}/[REDACTED_LONG_VALUE]/g' \
              | tr '\n\r' '  ' \
              | sed 's/%/%25/g')"
            echo "::error title=Trust Evaluation portal E2E failure::$message"
            exit "$status"
          fi
