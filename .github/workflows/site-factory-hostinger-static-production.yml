name: Site Factory Hostinger Static Production Deployment

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preflight validates only; apply overwrites production website files"
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - apply
      approved_sha:
        description: "Required for apply; must exactly match the workflow commit SHA"
        required: false
        type: string
      approval:
        description: "Required for apply: IGOR_APROVA_HOSTINGER_STATIC_PRODUCTION_DEPLOY"
        required: false
        type: string
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/site-factory-hostinger-static-production.yml"
      - "apps/site-factory/**"

permissions:
  contents: read

concurrency:
  group: site-factory-hostinger-static-production-apidevelopers
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build static output and call official Hostinger MCP
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 30
    env:
      RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'preflight' }}
      TARGET_DOMAIN: apidevelopers.digital
      EXPECTED_TEXT: API Developers.digital

    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout4

      - name: Validate explicit production apply authorization
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'apply' }}
        shell: bash
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
          APPROVAL: ${{ inputs.approval }}
        run: |
          set -euo pipefail
          test "$APPROVED_SHA" = "$GITHUB_SHA"
          test "$APPROVAL" = "IGOR_APROVA_HOSTINGER_STATIC_PRODUCTION_DEPLOY"
          test -n "$HOSTINGER_API_TOKEN"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate Site Factory
        working-directory: apps/site-factory
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check

      - name: Generate, test and build production static site
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT_ROOT="$RUNNER_TEMP/site-factory-static-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMP}"
          PROJECT_DIR="$OUTPUT_ROOT/apidevelopers"
          ARCHIVE_PATH="$RUNNER_TEMP/apidevelopers-static-${GITHUB_SHA}.zip"
          EVIDENCE_PATH="$RUNNER_TEMP/hostinger-static-deploy-evidence-${GITHUB_RUN_ID}.json"

          rm -rf "$OUTPUT_ROOT"
          rm -f "$ARCHIVE_PATH" "$EVIDENCE_PATH"
          mkdir -p "$OUTPUT_ROOT"

          (
            cd apps/site-factory
            npm run project:generate -- \
              --app apidevelopers \
              --domain apidevelopers.digital \
              --title "API Developers.digital" \
              --output "$OUTPUT_ROOT"
          )

          (
            cd "$PROJECT_DIR"
            npm install --no-audit --no-fund
            npm test
            npm run build
            test -f dist/index.html
            grep -q "API Developers.digital" dist/index.html
            (
              cd dist
              zip -q -r "$ARCHIVE_PATH" .
            )
          )

          test -s "$ARCHIVE_PATH"
          unzip -Z1 "$ARCHIVE_PATH" | grep -qx "index.html"

          cat > "$EVIDENCE_PATH" <<JSON
          {
            "schemaVersion": "1.0",
            "kind": "site-factory-hostinger-static-deployment-bootstrap",
            "status": "executor_not_started",
            "mode": "$RUN_MODE",
            "sourceSha": "$GITHUB_SHA",
            "runId": "$GITHUB_RUN_ID",
            "targetDomain": "$TARGET_DOMAIN",
            "writeExecuted": false
          }
          JSON

          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"
          echo "EVIDENCE_PATH=$EVIDENCE_PATH" >> "$GITHUB_ENV"

      - name: Install pinned official Hostinger MCP client dependencies
        shell: bash
        run: |
          set -euo pipefail

          MCP_WORKDIR="$RUNNER_TEMP/hostinger-mcp-1.26.0-${GITHUB_RUN_ID}"
          rm -rf "$MCP_WORKDIR"
          mkdir -p "$MCP_WORKDIR"
          cp apps/site-factory/src/run-hostinger-static-deploy-mcp.mjs "$MCP_WORKDIR/client.mjs"

          (
            cd "$MCP_WORKDIR"
            npm init -y >/dev/null
            npm install \
              --no-audit \
              --no-fund \
              hostinger-api-mcp@1.26.0 \
              @modelcontextprotocol/sdk@1.10.0
            test -x node_modules/.bin/hostinger-hosting-mcp
            node --check client.mjs
          )

          echo "MCP_CLIENT=$MCP_WORKDIR/client.mjs" >> "$GITHUB_ENV"

      - name: Run safe preflight
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'preflight' }}
        id: preflight
        continue-on-error: true
        shell: bash
        env:
          HOSTINGER_API_TOKEN: preflight-nonsecret-placeholder
        run: |
          set -euo pipefail
          node "$MCP_CLIENT" \
            --mode preflight \
            --domain "$TARGET_DOMAIN" \
            --archive "$ARCHIVE_PATH" \
            --expected-text "$EXPECTED_TEXT" \
            --evidence "$EVIDENCE_PATH"

      - name: Run authorized production apply
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'apply' }}
        id: apply
        continue-on-error: true
        shell: bash
        env:
          HOSTINGER_API_TOKKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
          APPROVAL: ${{ inputs.approval }}
        run: |
          set -euo pipefail
          node "$MCP_CLIENT" \
            --mode apply \
            --domain "$TARGET_DOMAIN" \
            --archive "$ARCHIVE_PATH" \
            --expected-text "$EXPECTED_TEXT" \
            --approved-sha "$APPROVED_SHA" \
            --approval "$APPROVAL" \
            --evidence "$EVIDENCE_PATH"

      - name: Upload sanitized deployment evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: hostinger-static-deployment-${{ github.sha }}-${{ github.run_id }}
          path: ${{ env.EVIDENCE_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Enforce preflight result
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.mode == 'preflight') && steps.preflight.outcome != 'success' }}
        shell: bash
        run: |
          echo "Hostinger static preflight did not complete successfully." >&2
          exit 1

      - name: Enforce production apply result
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'apply' && steps.apply.outcome != 'success' }}
        shell: bash
        run: |
          echo "Hostinger static production deployment did not complete successfully." >&2
          exit 1
