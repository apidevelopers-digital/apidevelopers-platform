name: Site Factory Hostinger API-only Node Build

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preflight validates only; apply creates a real Hostinger build"
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - apply
      approved_sha:
        description: "Required for apply and must exactly match the workflow commit SHA"
        required: false
        type: string
      approval:
        description: "For apply only: IGOR_APROVA_HOSTINGER_DEPLOY"
        required: false
        type: string
      transport:
        description: "API request transport"
        required: true
        default: multipart
        type: choice
        options:
          - multipart
          - documented-json-filename

permissions:
  contents: read

concurrency:
  group: site-factory-hostinger-api-only-preview
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build package and call Hostinger API
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 30
    env:
      HOSTINGER_USERNAME: u242521810
      HOSTINGER_DOMAIN: preview-apidevelopers.apidevelopers.digital
      EVIDENCE_PATH: ${{ runner.temp }}/hostinger-node-build-evidence.json

    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v4

      - name: Validate explicit apply authorization
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        run: |
          set -euo pipefail
          test "${{ inputs.approved_sha }}" = "${GITHUB_SHA}"
          test "${{ inputs.approval }}" = "IGOR_APROVA_HOSTINGER_DEPLOY"
          test -n "$HOSTINGER_API_TOKEN"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install and validate Site Factory
        working-directory: apps/site-factory
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check

      - name: Prepare isolated preview package
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT_ROOT="$RUNNER_TEMP/site-factory-hostinger-api-only-${GITHUB_RUN_ID}"
          PROJECT_DIR="$OUTPUT_ROOT/apidevelopers"
          ARCHIVE_PATH="$RUNNER_TEMP/site-factory-hostinger-api-only-${GITHUB_SHA}.zip"
          mkdir -p "$OUTPUT_ROOT"

          (
            cd apps/site-factory
            npm run project:generate -- \
              --app apidevelopers \
              --domain apidevelopers.digital \
              --title "API Developers.digital" \
              --output "$OUTPUT_ROOT"
          )

          (
            cd "$PROJECT_DIR"
            npm install --no-audit --no-fund
            npm test
            npm run build
            test -f dist/index.html
            test -f package-lock.json
            rm -rf node_modules dist

            if find . -type f \( \
              -name ".env" -o \
              -name ".env.*" -o \
              -name "*.pem" -o \
              -name "*.key" -o \
              -name "id_rsa" -o \
              -name "id_ed25519" \
            \) | grep -q .; then
              echo "Sensitive file found in generated project" >&2
              exit 1
            fi

            zip -q -r "$ARCHIVE_PATH" . \
              -x "node_modules/*" \
              -x "dist/*" \
              -x "build/*" \
              -x ".next/*" \
              -x ".git/*" \
              -x ".env" \
              -x ".env.*" \
              -x "*.pem" \
              -x "*.key"
          )

          ARCHIVE_BYTES="$(stat -f%z "$ARCHIVE_PATH")"
          test "$ARCHIVE_BYTES" -gt 0
          test "$ARCHIVE_BYTES" -le 52428800
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"

      - name: Execute API-only preflight or apply
        id: hostinger
        continue-on-error: true
        shell: bash
        env:
          HOSTINGER_API_TOKEN: ${{ inputs.mode == 'apply' && secrets.HOSTINGER_API_TOKEN || '' }}
        run: |
          set -euo pipefail
          node apps/site-factory/src/run-hostinger-node-build-api-only.mjs \
            --mode "${{ inputs.mode }}" \
            --username "$HOSTINGER_USERNAME" \
            --domain "$HOSTINGER_DOMAIN" \
            --archive "$ARCHIVE_PATH" \
            --transport "${{ inputs.transport }}" \
            --node-version 22 \
            --app-type vite \
            --output-directory dist \
            --build-script build \
            --package-manager npm \
            --evidence "$EVIDENCE_PATH"

      - name: Upload sanitized evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: hostinger-api-only-node-build-${{ github.sha }}-${{ github.run_id }}
          path: ${{ env.EVIDENCE_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Enforce executor result
        if: ${{ steps.hostinger.outcome != 'success' }}
        shell: bash
        run: |
          echo "Hostinger API-only executor did not complete successfully." >&2
          exit 1
