name: uni.co Preview Hostinger Node Deploy
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy-unico-preview:
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy approved preview
        shell: bash
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        run: bash ops/unico-preview/deploy.sh
