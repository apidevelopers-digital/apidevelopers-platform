name: Site Factory Hostinger API-only Node Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-unico-preview:
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 30
    env:
      HOSTINGER_USERNAME: u242521810
      HOSTINGER_DOMAIN: unico-preview.apidevelopers.digital
      SOURCE_SHA: 000ef9ce9e3d28b2b473faf8ef6db17e150b3364
      SOURCE_DIR: ops/unico-preview/source
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate approved boundary and source
        shell: bash
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$HOSTINGER_API_TOKEN"
          node - <<'NODE'
          const fs = require("fs");
          const r = JSON.parse(fs.readFileSync("ops/unico-preview/source/RELEASE.json","utf8"));
          if (r.sourceSha !== process.env.SOURCE_SHA) throw new Error("source_sha_mismatch");
          if (r.publicHost !== process.env.HOSTINGER_DOMAIN) throw new Error("target_mismatch");
          if (r.productionHost !== "unico.apidevelopers.digital") throw new Error("production_mismatch");
          if (r.secretsIncluded !== false || r.productionMutation !== false) throw new Error("unsafe_release");
          NODE
          cd "$SOURCE_DIR"
          npm run check
          test -f server.mjs
          test -f public/index.html

      - name: Create sanitized archive
        shell: bash
        run: |
          set -Eeuo pipefail
          ARCHIVE="$RUNNER_TEMP/uni-co-web-${SOURCE_SHA}.zip"
          (cd "$SOURCE_DIR" && /usr/bin/zip -X -q -r "$ARCHIVE" . -x ".git/*" "node_modules/*" ".env" ".env.*" "*.pem" "*.key")
          /usr/bin/unzip -t "$ARCHIVE" >/dev/null
          echo "ARCHIVE_PATH=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Deploy preview through institutional multipart executor
        shell: bash
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          EVIDENCE_PATH: ${{ runner.temp }}/unico-preview-hostinger-evidence.json
        run: |
          set -Eeuo pipefail
          node apps/site-factory/src/run-hostinger-node-build-api-only.mjs \
            --mode apply \
            --username "$HOSTINGER_USERNAME" \
            --domain "$HOSTINGER_DOMAIN" \
            --archive "$ARCHIVE_PATH" \
            --transport multipart \
            --archive-representation-verified true \
            --node-version 22 \
            --app-type express \
            --output-directory "" \
            --build-script "" \
            --entry-file server.mjs \
            --package-manager npm \
            --expected-text "uni.co" \
            --evidence "$EVIDENCE_PATH"
