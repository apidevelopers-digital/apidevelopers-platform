name: uni.co Preview Hostinger Node Deploy
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy-unico-preview:
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 40
    env:
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare exact-SHA Node archive
        run: bash ops/unico-preview/deploy.sh prepare
      - name: Install pinned Hostinger MCP
        run: bash ops/unico-preview/deploy.sh install-mcp
      - name: Deploy Node app via official Hostinger tool
        run: node ops/unico-preview/deploy-js-mcp.mjs "$NODE_ARCHIVE"
      - name: Verify preview health
        run: bash ops/unico-preview/deploy.sh health
