name: Site Factory Hostinger API-only Node Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Read-only Hostinger API token check
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 5
    env:
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
    steps:
      - name: Validate token with read-only builds endpoint
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOSTINGER_API_TOKEN"
          status="$(
            curl --silent --show-error --location               --output "$RUNNER_TEMP/hostinger-builds.json"               --write-out "%{http_code}"               --header "accept: application/json"               --header "Authorization: Bearer $HOSTINGER_API_TOKEN"               "https://developers.hostinger.com/api/hosting/v1/accounts/u242521810/websites/preview-apidevelopers.apidevelopers.digital/nodejs/builds?page=1&per_page=1"
          )"
          test "$status" = "200"
