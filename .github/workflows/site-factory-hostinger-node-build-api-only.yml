name: Site Factory Hostinger API-only Node Build

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Must be apply for the approved unico preview deployment"
        required: true
        default: apply
        type: choice
        options:
          - preflight
          - apply
      approved_sha:
        description: "Exact approved uni-co-web source SHA"
        required: true
        type: string
      approval:
        description: "Explicit Hostinger deployment approval token"
        required: true
        type: string
      transport:
        description: "API request transport"
        required: true
        default: multipart
        type: choice
        options:
          - multipart
          - documented-json-filename

permissions:
  contents: read

concurrency:
  group: unico-preview-hostinger-api-only
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 30
    env:
      HOSTINGER_USERNAME: u242521810
      HOSTINGER_DOMAIN: unico-preview.apidevelopers.digital
      SOURCE_SHA: 000ef9ce9e3d28b2b473faf8ef6db17e150b3364
      SOURCE_DIR: ops/unico-preview/source
    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enforce exact approved preview boundary
        shell: bash
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "${{ inputs.mode }}" = "apply"
          test "${{ inputs.approved_sha }}" = "$SOURCE_SHA"
          test "${{ inputs.approval }}" = "IGOR_APROVA_HOSTINGER_DEPLOY"
          test "${{ inputs.transport }}" = "multipart"
          test -n "$HOSTINGER_API_TOKEN"
          node - <<'NODE'
          const fs = require("fs");
          const release = JSON.parse(fs.readFileSync("ops/unico-preview/source/RELEASE.json", "utf8"));
          if (release.sourceSha !== process.env.SOURCE_SHA) throw new Error("source_sha_mismatch");
          if (release.publicHost !== process.env.HOSTINGER_DOMAIN) throw new Error("preview_host_mismatch");
          if (release.productionHost !== "unico.apidevelopers.digital") throw new Error("production_host_mismatch");
          if (release.secretsIncluded !== false) throw new Error("secrets_must_be_absent");
          if (release.productionMutation !== false) throw new Error("production_must_not_be_mutated");
          NODE
          if find "$SOURCE_DIR" -type f \( -name '.env' -o -name '.env.*' -o -name '*.pem' -o -name '*.key' -o -name 'id_rsa' -o -name 'id_ed25519' \) | grep -q .; then
            echo "Forbidden sensitive file in preview source" >&2
            exit 1
          fi

      - name: Validate exact uni.co Web source
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$SOURCE_DIR"
          npm run check
          test -f server.mjs
          test -f public/index.html

      - name: Build sanitized source archive
        shell: bash
        run: |
          set -Eeuo pipefail
          ARCHIVE="$RUNNER_TEMP/uni-co-web-${SOURCE_SHA}.zip"
          (
            cd "$SOURCE_DIR"
            /usr/bin/zip -X -q -r "$ARCHIVE" . \
              -x ".git/*" "node_modules/*" ".env" ".env.*" "*.pem" "*.key"
          )
          /usr/bin/unzip -t "$ARCHIVE" >/dev/null
          test -s "$ARCHIVE"
          echo "ARCHIVE_PATH=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Execute governed multipart Hostinger build
        id: hostinger
        continue-on-error: true
        shell: bash
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          EVIDENCE_PATH: ${{ runner.temp }}/unico-preview-hostinger-evidence.json
        run: |
          set -Eeuo pipefail
          node apps/site-factory/src/run-hostinger-node-build-api-only.mjs \
            --mode apply \
            --username "$HOSTINGER_USERNAME" \
            --domain "$HOSTINGER_DOMAIN" \
            --archive "$ARCHIVE_PATH" \
            --transport multipart \
            --node-version 22 \
            --app-type express \
            --output-directory "" \
            --build-script "" \
            --entry-file server.mjs \
            --package-manager npm \
            --expected-text "uni.co" \
            --evidence "$EVIDENCE_PATH"

      - name: Enforce Hostinger executor result
        if: ${{ steps.hostinger.outcome != 'success' }}
        shell: bash
        run: |
          echo "Hostinger multipart executor did not complete successfully." >&2
          exit 1

      - name: Verify public health endpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          node - <<'NODE'
          const url = "https://unico-preview.apidevelopers.digital/health";
          let last;
          for (let i = 0; i < 24; i++) {
            try {
              const response = await fetch(url, { redirect: "follow" });
              const text = await response.text();
              last = { status: response.status, text };
              if (response.ok) {
                const body = JSON.parse(text);
                if (body?.ok === true && body?.product === "uni-co-web") {
                  console.log("preview_health_ok=true");
                  process.exit(0);
                }
              }
            } catch (error) {
              last = { error: error.message };
            }
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          console.error(JSON.stringify(last));
          process.exit(1);
          NODE
