name: Diagnose Hostinger Writer Gateway Clean

on:
  push:
    branches:
      - feat/operator-hostinger-writer-runtime-bridge-clean-20260804

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on:
      - self-hosted
      - macOS
      - X64
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/operator-hostinger-writer-runtime-bridge-clean-20260804
          fetch-depth: 0
      - name: Capture gateway test output
        shell: bash
        run: |
          set +e
          npm --prefix apps/api-gateway test > diagnostic-hostinger-gateway-clean.txt 2>&1
          code=$?
          printf '\nexit_code=%s\n' "$code" >> diagnostic-hostinger-gateway-clean.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostic-hostinger-gateway-clean.txt
          git commit -m "test(ci): registrar saida sanitizada do gateway Hostinger"
          git push origin HEAD:feat/operator-hostinger-writer-runtime-bridge-clean-20260804
