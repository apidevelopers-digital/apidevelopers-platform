openapi: 3.1.0
info:
  title: ADA Media Plugin
  version: 0.1.0-draft
  description: Draft macroplugin facade for API Developers.digital existing backend.
servers:
  - url: https://api.apidevelopers.digital
security:
  - PluginKey: []
paths:
  /v1/plugins/media/health:
    get:
      operationId: media_health
      responses:
        "200":
          description: OK
  /v1/plugins/media/capabilities:
    get:
      operationId: media_capabilities
      responses:
        "200":
          description: Capabilities
  /v1/plugins/media/call:
    post:
      operationId: media_call
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operation]
              properties:
                operation:
                  type: string
                  enum: ["elevenlabs.tts.runtime", "elevenlabs.tts.voices", "elevenlabs.tts.generate_file", "reels.package.status", "reels.package.materialize", "reels.render.from_package", "media.asset.upload", "vnnox.status", "instagram.draft"]
                dry_run:
                  type: boolean
                  default: true
                payload:
                  type: object
                  additionalProperties: true
                confirmation:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Result
        "403":
          description: Confirmation required or action blocked
components:
  securitySchemes:
    PluginKey:
      type: apiKey
      in: header
      name: X-ADA-Plugin-Key
