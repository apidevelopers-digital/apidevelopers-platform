openapi: 3.1.0
info:
  title: ADA Infra Plugin
  version: 0.1.0-draft
  description: Draft macroplugin facade for API Developers.digital existing backend.
servers:
  - url: https://api.apidevelopers.digital
security:
  - PluginKey: []
paths:
  /v1/plugins/infra/health:
    get:
      operationId: infra_health
      responses:
        "200":
          description: OK
  /v1/plugins/infra/capabilities:
    get:
      operationId: infra_capabilities
      responses:
        "200":
          description: Capabilities
  /v1/plugins/infra/call:
    post:
      operationId: infra_call
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operation]
              properties:
                operation:
                  type: string
                  enum: ["operator.status", "system.status", "docker.ps", "fs.list", "fs.read", "backup.snapshot", "ops.healthcheck", "github.read", "hostinger.read", "deploy.dry_run"]
                dry_run:
                  type: boolean
                  default: true
                payload:
                  type: object
                  additionalProperties: true
                confirmation:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Result
        "403":
          description: Confirmation required or action blocked
components:
  securitySchemes:
    PluginKey:
      type: apiKey
      in: header
      name: X-ADA-Plugin-Key
