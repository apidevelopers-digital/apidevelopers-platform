openapi: 3.1.0
info:
  title: ADA Comunicacao Plugin
  version: 0.1.0-draft
  description: Draft macroplugin facade for API Developers.digital existing backend.
servers:
  - url: https://api.apidevelopers.digital
security:
  - PluginKey: []
paths:
  /v1/plugins/comunicacao/health:
    get:
      operationId: comunicacao_health
      responses:
        "200":
          description: OK
  /v1/plugins/comunicacao/capabilities:
    get:
      operationId: comunicacao_capabilities
      responses:
        "200":
          description: Capabilities
  /v1/plugins/comunicacao/call:
    post:
      operationId: comunicacao_call
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operation]
              properties:
                operation:
                  type: string
                  enum: ["communication.inbox", "communication.thread", "whatsapp.diagnostics", "whatsapp.templates", "whatsapp.draft", "whatsapp.handoff", "email.search", "email.draft", "action.approve", "action.execute"]
                dry_run:
                  type: boolean
                  default: true
                payload:
                  type: object
                  additionalProperties: true
                confirmation:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Result
        "403":
          description: Confirmation required or action blocked
components:
  securitySchemes:
    PluginKey:
      type: apiKey
      in: header
      name: X-ADA-Plugin-Key
