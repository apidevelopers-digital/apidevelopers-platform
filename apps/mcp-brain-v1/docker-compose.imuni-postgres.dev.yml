services:
  imuni-postgres:
    image: postgres:16-alpine
    container_name: imuni-postgres
    restart: unless-stopped
    env_file:
      - /opt/api-dev-brain/config/imuni-postgres.env
    volumes:
      - imuni_postgres_data:/var/lib/postgresql/data
      - ./db/imuni/schema.sql:/docker-entrypoint-initdb.d/001_imuni_schema.sql:ro
    networks:
      - imuni_private
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  imuni_private:
    internal: true

volumes:
  imuni_postgres_data:
    name: imuni_postgres_data
