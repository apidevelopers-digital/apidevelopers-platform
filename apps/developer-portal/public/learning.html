<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Memória e Melhorias · Portal</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    body { margin: 0; background: #0b1020; color: #eef2ff; }
    main { max-width: 1120px; margin: auto; padding: 32px 20px 64px; }
    header, .toolbar, .card { border: 1px solid #26314f; background: #11182b; border-radius: 16px; }
    header { padding: 24px; margin-bottom: 16px; }
    h1, h2, p { margin-top: 0; }
    .muted { color: #9ca9c8; }
    .toolbar { display: flex; gap: 12px; padding: 16px; margin-bottom: 16px; flex-wrap: wrap; }
    input { flex: 1; min-width: 240px; padding: 12px; border-radius: 10px; border: 1px solid #34405f; background: #090e1b; color: inherit; }
    button { padding: 12px 18px; border: 0; border-radius: 10px; font-weight: 700; cursor: pointer; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap: 12px; margin-bottom: 16px; }
    .card { padding: 18px; }
    .metric { font-size: 32px; font-weight: 800; }
    .section { margin-top: 18px; }
    .item { padding: 14px; border-top: 1px solid #26314f; overflow-wrap: anywhere; }
    .safe { color: #86efac; }
    .warning { color: #fde68a; }
    code { color: #c4b5fd; }
  </style>
</head>
<body>
<main>
  <header>
    <p class="safe">● Somente leitura</p>
    <h1>Memória e Melhorias</h1>
    <p class="muted">Memórias operacionais, achados e propostas supervisionadas. Esta tela não aprova, altera nem executa mudanças.</p>
  </header>

  <form class="toolbar" id="loader">
    <input id="key" type="password" autocomplete="off" placeholder="Credencial administrativa temporária" required>
    <button type="submit">Carregar projeção</button>
  </form>

  <p id="status" class="muted">Nenhuma credencial é armazenada no navegador.</p>
  <section id="summary" class="grid" aria-label="Resumo"></section>
  <section id="sections"></section>
</main>
<script>
  const form = document.querySelector("#loader");
  const status = document.querySelector("#status");
  const summary = document.querySelector("#summary");
  const sections = document.querySelector("#sections");

  const escapeHtml = (value) => String(value ?? "")
    .replaceAll("&", "&amp;").replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;").replaceAll('"', "&quot;");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const key = document.querySelector("#key").value;
    status.textContent = "Carregando projeção…";
    summary.replaceChildren();
    sections.replaceChildren();

    try {
      const response = await fetch("/v1/admin/learning", {
        headers: { "x-api-key": key },
        cache: "no-store",
      });
      document.querySelector("#key").value = "";
      const payload = await response.json();
      if (!response.ok) throw new Error(payload.message || payload.error);

      const screen = payload.data;
      const metrics = [
        ["Memórias", screen.summary?.memories],
        ["Achados", screen.summary?.findings],
        ["Propostas", screen.summary?.proposals],
        ["Revisão humana", screen.summary?.pendingHumanReview],
      ];
      summary.innerHTML = metrics.map(([label, value]) =>
        `<article class="card"><p class="muted">${escapeHtml(label)}</p><div class="metric">${escapeHtml(value ?? 0)}</div></article>`
      ).join("");

      sections.innerHTML = (screen.sections ?? []).map(section => `
        <article class="card section">
          <h2>${escapeHtml(section.title)}</h2>
          ${(section.items ?? []).length
            ? section.items.map(item => `<div class="item"><code>${escapeHtml(JSON.stringify(item, null, 2))}</code></div>`).join("")
            : '<p class="muted">Nenhum item.</p>'}
        </article>
      `).join("");

      status.innerHTML = '<span class="safe">Projeção carregada. Execução e mutação permanecem bloqueadas.</span>';
    } catch (error) {
      status.innerHTML = `<span class="warning">Não foi possível carregar: ${escapeHtml(error.message)}</span>`;
    }
  });
</script>
</body>
</html>
